sceneBrief: At luncheon, Zaroff appears in country tweeds, complaining of boredom with last night's hunt. Rainsford demands to leave. Zaroff refuses — and forces the choice: hunt with Zaroff, starting tonight, or be turned over to Ivan, who will kill him slowly. Rainsford, seeing Ivan's massive form in the corner, chooses the hunt. Zaroff is delighted: at last, a foeman worthy of his steel. Rainsford is given a three-hour head start, khaki hunting clothes, food, and a hunting knife. He is led to the gate and released into the jungle.
styleGuidance: Tense confrontation. The luncheon scene should feel civilized and horrifying — Zaroff eating Crêpes Suzette while describing how he will hunt Rainsford. The release into the jungle should feel like a door slamming on freedom.
