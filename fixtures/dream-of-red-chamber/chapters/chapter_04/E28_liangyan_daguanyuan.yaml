sceneBrief: "刘姥姥二进荣国府，贾母携她遍游大观园。在秋爽斋、晓翠堂设两宴，鸳鸯行令、凤姐促狭。刘姥姥故意以村言俚语行酒令——'大火烧了毛毛虫''一个萝卜一头蒜''花儿落了结个大倭瓜'——粗鄙可笑，满座哄堂。众人笑态各异：湘云喷饭、黛玉伏桌、宝玉滚到贾母怀里。宴后又游栊翠庵，妙玉用旧年蠲的雨水沏老君眉待客，引出了另一番茶中雅趣。这场是贾府鼎盛时期最和乐欢快的全景式大观园宴乐图，亦是刘姥姥二进荣国府的高潮。"
