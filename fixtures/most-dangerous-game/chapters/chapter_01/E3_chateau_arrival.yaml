sceneBrief: "Rainsford lifts the heavy knocker on the massive door of the château. The door opens to reveal a giant black-bearded man holding a revolver aimed at Rainsford's heart — Ivan. Rainsford explains he fell off a yacht. Ivan does not respond; he cocks his revolver. Then General Zaroff appears, an erect, slender man in evening clothes, and welcomes Rainsford by name, having recognized him from his book on hunting snow leopards in Tibet. Ivan is dismissed with a silent gesture."
