sceneBrief: 保定陷落的消息传来，日本人逼着学生和市民游行庆祝。天安门前升起了庆祝的大气球。瑞宣拒绝参加游行，陷入辞职还是忍辱教书的挣扎。瑞丰却积极得很，穿上中山装做了学生领队。在天安门广场上，学生们低着头，一声不出，默默地走着——他们用沉默表达着最后的抵抗。瑞丰一开始还喊口令，后来也低下了头。
