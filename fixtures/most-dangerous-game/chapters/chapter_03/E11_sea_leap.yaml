narrativeContent:
  opening: "Rainsford burst through the tree line and found himself on the shore of the sea. Twenty feet below, the water churned and hissed against jagged rocks. Across the cove, the gloomy gray stone of Zaroff's château rose against the pale morning sky.\n\nBehind him, the hounds were almost upon him. He could hear their breathing now, the snap of jaws, the padding of paws on the soft earth.\n\nHe leaped.\n\nThe water slammed into him like a wall, and something sharp — a jagged rock — tore at his cheek. He surfaced, gasping, and struck out with strong, desperate strokes. When he looked back, General Zaroff was standing at the cliff edge, silhouetted against the sky. The general shrugged. He sat down, took a silver flask from his pocket, drank, lit a perfumed cigarette, and began to hum a bit from Madama Butterfly.\n\nRainsford swam."
