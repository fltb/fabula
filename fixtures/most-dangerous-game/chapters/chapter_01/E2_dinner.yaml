styleGuidance:
  tone: Drawing-room horror. The dinner must feel opulent and civilized — the
    finest linen, crystal, silver, china, perfectly cooked food — while Zaroff
    calmly describes mass murder. The mounted heads on the walls take on new
    meaning. The hounds through the window are a glimpse of hell. Zaroff's
    ultimatum is delivered with perfect politeness. End with the château gates
    clanging shut behind Rainsford.
