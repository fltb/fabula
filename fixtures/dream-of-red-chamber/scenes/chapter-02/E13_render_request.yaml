sceneBrief: 尤氏卧病，宁国府无人主持丧事。贾珍亲到荣国府请王熙凤协理宁国府。凤姐心中虽喜揽权管事，面上却看贾母眼色，经贾母应允后才接下对牌。她立即理清宁国府的五件积弊——人口混杂遗失东西、事无专管临期推诿、需用过费滥支冒领、任无大小苦乐不均、家人豪纵有脸者不服铃束。次日一早她便召集宁府仆从，分班定岗、各司其职，明确责罚规矩。凤姐言辞凌厉、威仪凛然，将宁国府上下管理得井井有条。她还亲自早起查岗，惩治了一名迟到的仆人，打了二十板子并革去一个月银米。宁国府上下无不震惊，自此兢兢业业不敢懈怠。凤姐的管理才能在丧事中得到充分展现——她不仅是贾府的管家奶奶，更是个铁腕管理者。
styleGuidance: {"tone":"果断、威严、雷厉风行，间有几分得意","characterVoice":{"wangxifeng":"句句有力、字字不虚。她不用高声，但每句话都是命令。'既托了我，我就说不得要讨你们嫌了'——既是预告也是警告。对迟到仆人的处置简洁干脆：'打二十板子！革一个月银米！'","jiazhen":"感激中带着谦卑，亲自向凤姐道谢、拄拐送殡。宁国府当家人在荣国府媳妇面前的低姿态，折射出两府关系的变化。"},"scenePacing":"贾珍求援→凤姐揽权→分析积弊→分派人事→日出点卯→惩治迟到→秩序井然","atmosphere":"宁国府上下乱作一团时凤姐到来。清晨点卯时灯火通明、鸦雀无声。凤姐端坐堂上，手执对牌，目光如刀。仆从战栗听令。","targetWordCount":1200}
