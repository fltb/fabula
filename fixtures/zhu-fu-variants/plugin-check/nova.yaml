project: zhu-fu
title: "祝福"
author: "鲁迅"
defaultModel: mock
defaultLanguage: zh
genre: "literary"
synopsis: "一个返乡的知识分子在鲁镇遇见沦为乞丐的祥林嫂，她问他关于灵魂和地狱的问题，随后在除夕夜冻死街头。通过倒叙，故事展现了她悲惨的一生——被婆婆卖掉改嫁、丧夫失子、被主家视为不洁、捐门槛赎罪仍被排斥，最终在众人的祝福声中孤寂死去。"
tense: past
ideaIR:
  thematicIntent:
    primaryTheme: "封建礼教吃掉个体——鲁镇'祝福'仪式是社会合谋的镜像"
    subThemes:
      - "知识分子的道德无力——'我'的'说不清'是启蒙失败的自供"
      - "女性的三重压迫——夫权、族权、神权"
      - "叙述的伦理——讲述他人的苦难是否本身就是一种剥削"
      - "孤独与沟通的不可能性——祥林嫂的三连问无人能答"
  emotionalArc:
    arcType: "tragedy"
    emotionalBeats:
      - position: "E0"
        emotion: "不安与负疚"
      - position: "E1"
        emotion: "震惊→释然→道德麻木"
      - position: "E2"
        emotion: "希望——祥林嫂唯一的好时光，但读者已知结局"
      - position: "E3"
        emotion: "恐惧与同情——暴力的系统性暴露"
      - position: "E4"
        emotion: "深切的哀悯——'我真傻，真的'"
      - position: "E5"
        emotion: "愤怒与绝望——'你放着罢'消灭了一切救赎可能"
      - position: "E6"
        emotion: "冰冷的释然——祝福照常进行"
snapshotInterval: 3
defaultSceneTextTarget: 1200
plugins:
  enabled: true
  directory: plugins
