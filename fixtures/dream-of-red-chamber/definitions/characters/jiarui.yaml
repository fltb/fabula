backstory: 贾家族人，祖父贾代儒是贾家塾中塾师，贾瑞随祖父在家塾读书。在宁国府寿宴上偶遇王熙凤，见色起意，言语挑逗。凤姐假意周旋，约他夜间在穿堂相见，实则关他在寒冬穿堂中冻了一夜。贾瑞不死心，凤姐又约他在空屋相见，这次被贾蓉、贾蔷捉住勒索，泼了一身粪水。回家后相思成疾，百般医药无效。跛足道人送"风月宝鉴"来救他，叮嘱只照背面，贾瑞却偏照正面见凤姐招手，反复数次后精气耗尽而死。
knownSecrets:
  - 对王熙凤的非分之想
  - 风月宝鉴之死为全书"假作真时真亦假"的具象化隐喻
