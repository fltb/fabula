voiceNotes: 言语温和寡淡，持家以静。说话不多但句句在理。教育儿子时严格，在姐妹中则慈和。起诗社时言语风趣，不失大家风范。
backstory: 荣国府贾珠之妻，贾兰之母。贾珠早亡后寡居，一心教子，不闻外事。为人温厚善良，在贾府中与世无争。在大观园中带领众姊妹结诗社。贾兰长大后科举高中，李纨得以封诰命。
