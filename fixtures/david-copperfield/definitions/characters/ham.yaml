description: "Mr Peggotty's nephew (his brother's son), raised in the Yarmouth boathouse alongside Little Emily, whom he loves and is engaged to marry. Ham is a big, strong, gentle young man — a fisherman and boat-builder by trade. He is simple, honest, and deeply attached to Emily. When she elopes with Steerforth, his heart is broken but he does not curse her. He continues working, living and eventually dies heroically when he attempts to rescue a man from a sinking ship in the great Yarmouth storm — the very ship carrying Steerforth. Ham perishes in the attempt, and his body is laid in the churchyard beside his drowned rival."
appearance: "A large, broad-shouldered, muscular young man with a sunburnt face, a shock of hair, and a shy, gentle expression. He is awkward and bashful in manner but radiates physical strength and kindness. As a youth: a big, rough fisher boy with an open face."
