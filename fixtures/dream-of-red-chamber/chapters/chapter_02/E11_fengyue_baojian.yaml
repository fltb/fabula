narrativeChecklist:
  items:
    - dimension: "道德寓言"
      description: "风月宝鉴的正反之辨——反面骷髅代表真实与死亡，正面凤姐代表欲望与诱惑。贾瑞选择正面，即选择了死。"
      required: true
    - dimension: "凤姐性格"
      description: "凤姐对贾瑞的态度从始至终是戏弄与杀心——'几时叫他死在我手里'——她的狠辣与笑里藏刀在此完全展现"
      required: true
    - dimension: "荒诞与写实交织"
      description: "僧道送镜、镜中招手的超现实元素与贾府日常的现实叙事融合——这是红楼叙事的一个典型手法"
      required: false
