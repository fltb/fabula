voiceNotes: "Short, clipped sentences. Dismissive of animal suffering and sentimentality. Speaks with the authority of an expert hunter. Later in the story, his speech becomes terse, breathless, and edged with terror."
backstory: "Served in World War I. Later became a famous author of hunting books, including one on hunting snow leopards in Tibet that Zaroff has read. Has hunted on every continent and considers himself a realist about the natural order."
