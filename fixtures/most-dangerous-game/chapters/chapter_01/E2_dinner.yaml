pov:
  character: rainsford
  type: third_person_limited
sceneBrief: "In the magnificent candlelit dining hall surrounded by mounted
  animal heads, General Zaroff hosts Rainsford for an exquisite dinner. Over
  borsch, filet mignon, champagne, and port, Zaroff reveals his life story: his
  Cossack youth, his military service, his worldwide hunting career. He
  confesses that hunting all animals had begun to bore him — and that he
  invented a new quarry: man. Rainsford is horrified, calling it murder. Zaroff
  calmly explains his philosophy — life is for the strong, and he only hunts the
  scum of the earth: sailors, tramps. Showing Rainsford the hounds through the
  window, he explains the three-day rules of his game. When Rainsford demands to
  leave in the morning, Zaroff forces the choice: hunt with him or be turned
  over to Ivan. Rainsford, seeing the giant's silent menace, chooses the hunt.
  He is given a three-hour head start with a hunting knife and released into the
  jungle at dusk."
