sceneBrief: "David's mother Clara dies suddenly, and the baby brother dies shortly after. David is called home from Salem House for the funeral — a heartbreaking return to a house now ruled entirely by the Murdstones. Peggotty is dismissed with a month's warning. After the funeral, David is not sent back to school. Instead he is sent to London to work at Murdstone and Grinby's wine warehouse, a filthy, rat-infested establishment on the Thames. At age ten, David spends his days washing bottles alongside rough boys, feeling utterly degraded and abandoned. He lodges at the home of the improvident but kind Mr Micawber, who is soon arrested for debt and sent to the Marshalsea prison."
