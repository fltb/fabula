      value: 忘年之交——诗人与教员
    - dimensionId: notes
      scope: global
      value: 瑞宣与钱默吟是小羊圈胡同的邻居，也是忘年之交。钱先生年长二十多岁，是瑞宣敬重的文人——他爱诗、爱花、爱酒，与世无争。瑞宣常去钱家坐坐，听钱先生谈诗论文，那是他精神上最舒服的时刻。瑞宣觉得钱先生活得像一首诗——比他的英文课、比祁家的日常都更像真的生活。但钱默吟被捕后经历了非人的酷刑，出狱后从吟诗的隐士变成了铁一般的抗日宣传者。这个转变让瑞宣既震撼又惭愧——他最敬佩的人变成了最勇敢的战士，而他自己还困在书斋里。钱默吟也看重瑞宣的正直与善良，出狱后通过瑞宣散布抗日传单。他们的关系从邻里与诗友，变成了地下抗日的同志。
