sceneBrief: "At dusk, Zaroff releases Rainsford into the jungle with a three-hour head start. Rainsford runs — not a straight flight, but a calculated series of fox-like dodges, doubling back on his trail, executing intricate loops. His only goal: put distance and confusion between himself and Zaroff. When night falls, he climbs a large tree with a thick trunk and outspread branches, settling into a crotch to rest. During the night, Zaroff passes beneath the tree, tracking Rainsford's trail. Rainsford considers attacking but sees the glint of a small automatic pistol in Zaroff's hand. Zaroff studies the ground, then looks up — inch by inch — but stops before reaching Rainsford's branch. He smiles, blows a smoke ring, and walks away. Rainsford realizes with horror: Zaroff is playing with him."
