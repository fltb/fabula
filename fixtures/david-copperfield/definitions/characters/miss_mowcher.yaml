description: "A dwarf hairdresser and chiropodist of Yarmouth, a tiny, busy woman with a tongue that cuts through the pretensions of everyone she meets. She dresses Littimer's hair and knows the Steerforth household's secrets. David first mistakes her sharpness for malice, but she proves a loyal friend: it is Miss Mowcher who, having discovered Steerforth's betrayal of Emily, helps expose the servant Littimer's part in the affair and brings him to justice."
appearance: "A tiny woman, scarcely three feet high, with a large head, bright sharp eyes, and a prodigious quantity of hair of her own which she dresses elaborately. She is always in motion, wheeling about on a stool to reach her clients."
aliases:
