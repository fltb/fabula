voiceNotes: "Oratorical, grandiloquent, full of elaborate periods and rhetorical flourishes. He writes letters in the most formal style, with many subordinate clauses and circumlocutions. He quotes Latin tags. His favourite expression is 'something will turn up.' His speech is theatrical, as if he is always addressing a public meeting."
backstory: "A gentleman of respectable family who has squandered his resources and lives in a state of perpetual debt. He takes David as a lodger when the boy is set to work at Murdstone and Grinby's. He is imprisoned in the Marshalsea for debt, released when his friends help pay his obligations, moves his family to Plymouth, and later appears in Canterbury working as Uriah Heep's clerk. He secretly collects evidence of Heep's frauds, which he dramatically reveals in a written statement at the climax of the novel. He emigrates to Australia with his family, where he becomes a prosperous magistrate, proving that his talents were always hampered by English circumstances."
