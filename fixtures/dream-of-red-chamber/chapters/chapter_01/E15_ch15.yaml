sceneBrief: 秦可卿出殡，灵柩寄放铁槛寺。凤姐嫌寺中不便，携宝玉秦钟住馒头庵（水月庵）。净虚老尼趁机托凤姐办事：长安张大财主之女金哥已受守备之子聘定，又被长安府太爷小舅子李衙内看上，张家左右为难欲退亲。净虚求凤姐修书与长安节度使云光，逼守备退亲。凤姐初推脱"等银子作坟地"，净虚激将，凤姐乃索要三千两银子应允。秦钟与智能儿在馒头庵幽会，被宝玉撞见。凤姐假借贾琏名义修书，云光依言拆散姻缘，金哥自缢守备之子投河，凤姐坐享三千两。此后凤姐胆识愈壮，恣意作为。
