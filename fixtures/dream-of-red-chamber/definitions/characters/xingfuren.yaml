voiceNotes: 言语糊涂，一味顺从贾赦。为人吝啬，常因小事计较。说话时讨好贾赦却不得要领，在继媳凤姐面前更显无能。
backstory: 贾赦之续弦妻，王熙凤的婆婆。为人愚钝，一味顺从丈夫贾赦，助纣为虐。曾替贾赦向贾母讨鸳鸯为妾，被贾母痛责。吝啬小气，在贾府中地位尴尬。
