description: "One of literature's great villains. Uriah Heep is a clerk in Mr Wickfield's Canterbury law office who presents himself as an 'umble' servant but is in fact an ambitious, manipulative, and fraudulent schemer. He insinuates himself into Wickfield's confidence, exploits his weakness for drink and his financial troubles, and gradually assumes control of the firm. His ultimate goal is to possess the firm and marry Agnes Wickfield. He is undone by Mr Micawber's secret investigation. Heep's defining characteristic is his exaggerated humility — 'I am well aware that I am the umblest person going' — which is simultaneously a weapon, a disguise, and a bitter mockery of his subordinate position. His physical description — thin, lank-haired, clammy-handed —represents his slithering, cold nature."
appearance: "Extremely thin, tall, and lanky, with pale, clammy skin, red eyes, no eyebrows, and lank red hair. His hands are always cold and fish-like. He writhes and squirms when he speaks, expressing his humility through physical cringing. He dresses in black. His facial expression is a mixture of fawning subservience and secret cunning."
