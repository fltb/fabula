voiceNotes: >
  使用第一人称叙述，语言带有五四新文学的白话风格——简洁、冷峻、含而不露。叙述语气
  在观察者（描述鲁镇风俗）和内省者（剖析自己的罪恶感）之间切换。在面对祥林嫂的灵魂
  问题时的语无伦次——'也许有罢——我想'、'说不清'——是他性格的核心体现：知而不为，
  言而不定。
backstory: >
  他是在外地接受了新式教育的读书人，回到鲁镇过年。他不太认同四老爷这类传统士绅的
  世界观，但也无意挑战——'无论如何，我明天决计要走了'表明他选择离开而不是对抗。
  他代表了五四一代知识分子的困境：看到了旧制度的残酷，却没有采取行动的勇气。他写下
  了祥林嫂的故事——但只在故事中纪念她，而在现实中未能帮助她。
