narrativeContent:
  opening: "General Zaroff did not appear until luncheon. He was dressed faultlessly in the tweeds of a country squire, and he sighed as he took his seat. 'I do not feel so well,' he said, helping himself to Crêpes Suzette. 'Last night I detected traces of my old complaint. Ennui. Boredom.'\n\nRainsford set down his fork. 'General,' he said, 'I wish to leave this island at once.'\n\nZaroff's eyebrows rose. 'But, my dear fellow, you've only just come.' He smiled, and his black eyes held Rainsford's. 'Tonight, we will hunt — you and I.'\n\n'I will not hunt,' said Rainsford.\n\nZaroff shrugged and ate a hothouse grape. 'As you wish. But may I suggest you will find my idea of sport more diverting than Ivan's?'\n\nRainsford looked at the corner where the giant stood, his thick arms crossed on a chest like a hogshead. He understood."
