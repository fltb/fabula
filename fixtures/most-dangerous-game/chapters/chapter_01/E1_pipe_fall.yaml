sceneBrief: "After hearing the gunshots, Rainsford springs to the rail to peer into the darkness. His pipe is knocked from his mouth by a rope; he lunges for it and loses his balance, falling into the blood-warm Caribbean. The yacht speeds away. Rainsford strips off his clothes and swims toward the direction of the shots. He hears an animal scream cut short by a pistol shot. After a desperate swim, he drags himself onto the rocky shore of Ship-Trap Island and collapses into exhausted sleep."
