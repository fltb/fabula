sceneBrief: 战争持续一年多，北平的物资已经枯竭。日本人推行配给制，粮证一次有效，过期作废。市民们拿着粮证去领粮，领到的却是掺了沙子和木屑的"共和面"。李四爷帮忙办粮证，挨了不少冤枉骂。祁家已经断粮多日，只能喝稀粥配咸菜。小崔和孙七这些底层市民更是朝不保夕。程长顺的外婆每天只吃一顿饭，把省下的给外孙。小崔媳妇饿得面黄肌瘦。祁老人再也不说"三个月准保平安"了。
