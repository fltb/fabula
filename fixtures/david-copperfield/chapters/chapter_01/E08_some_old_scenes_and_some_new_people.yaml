styleGuidance:
  tone: "warm and affectionate at first, then increasingly ominous — the gaiety of the Yarmouth scenes is undercut by a growing sense of danger"
  targetWordCount: 800
  atmosphere: "the Peggotty boat-house in Yarmouth — warm firelight, the smell of salt and tar, the cosy interior of the converted boat where the Peggotty family lives; the wide beach and the grey sea; Steerforth's handsome ease among humble folk; Emily's bright eyes and restless spirit; Martha lurking in the shadows of the town"
  scenePacing: "journey to Yarmouth (brisk) → Steerforth at the Peggotty's (warm, comic, charming) → the boat commission (ominous beneath the surface) → Martha and Miss Mowcher (introducing counterpoints) → departure (unease unexpressed)"
  characterVoice:
    narrator: "David is at his most trusting and least perceptive — he basks in Steerforth's reflected glory, narrating the Yarmouth visit with boyish enthusiasm. The adult narrator allows the warmth of the memory to stand, but the reader feels the shadow the young David never saw."
    steerforth: "Effortlessly charming, condescending disguised as warmth — he talks to the Peggotty family with a kind of amused patronage that they mistake for respect. To Emily he is tender, admiring, and infinitely dangerous — 'My little wife, perhaps!' he says of the boat, and the words are more true than he admits."
    emily: "Bright, coquettish, dangerously ambitious — she is flattered by the attention of a gentleman. Her speech is full of restless longing for a life beyond Yarmouth, and Steerforth seems to offer the key."
    dan_peggotty: "Hospitable, generous, utterly unsuspecting — his warm 'Welcome, sir!' to Steerforth is the embrace of a good man who cannot imagine evil."
    miss_mowcher: "Garrulous, knowing, theatrical — she talks in a torrent of observation and innuendo, her small size and comic manner belying a sharp intelligence that misses nothing."
