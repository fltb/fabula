  notes: "At Salem House school, David — lonely, sensitive, bullied — is singled out for protection by the older, charismatic James Steerforth. Steerforth is everything David is not: confident, handsome, aristocratic, effortlessly commanding. David worships him with the uncritical devotion of a younger boy. Steerforth nicknames him 'Daisy' and treats him with an affectionate condescension that David mistakes for true friendship. As adults, they rekindle their bond, and David introduces Steerforth into the Peggotty household in Yarmouth. There Steerforth seduces and abandons Little Emily, destroying her family and her future. The betrayal is absolute: Steerforth has taken David's love and trust and used it to gain access to innocent people he then destroys. David's retrospective narration is haunted by guilt — he introduced the wolf into the fold. The relationship ends with Steerforth's death in a shipwreck off Yarmouth, his body washed ashore beside the body of Ham Peggotty, who died trying to save him. David's final feeling is not hatred but a sorrowful, aching pity."
