narrativeContent:
  opening: "The three shots hung in the air like a question no one would answer. Rainsford was at the rail before the last echo died, straining to see through the absolute blackness. He leaped onto the rail, balancing — and his pipe, striking a taut rope, was torn from his lips. He lunged for it, his center of gravity shifted, and with a hoarse cry he was falling, the blood-warm water closing over his head like a door slamming shut."
