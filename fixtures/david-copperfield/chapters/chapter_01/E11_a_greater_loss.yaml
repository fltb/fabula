styleGuidance:
  tone: "mournful, tender, with moments of bitter irony — Barkis's posthumous generosity set against the devastation of Emily's flight"
  targetWordCount: 900
  atmosphere: "the Yarmouth coast in grief — the undertaker's house, the still body in the bedroom, and the shattered boathouse where the sea murmurs on as if nothing has changed, though everything has"
  scenePacing: "Barkis's decline (slow, patient) → death (quiet) → will reading (surprising warmth) → Emily's flight disclosed (sudden catastrophe) → Mr Peggotty's quest begins (solemn resolve)"
  characterVoice:
    narrator: "Adult David looking back on a double loss — the comic figure of Barkis gone, but overshadowed by the terrible thing Steerforth has done. The voice carries a weight of regret, of having seen more than he understood at the time."
    peggotty: "Simple, grieving, dignified — her sorrow over Barkis mixed with the shock of Emily's fall. She speaks plainly, her goodness untainted by the scandal."
    dan_peggotty: "Broken but not bitter — his voice trembles with grief over Emily but rises with conviction when he vows to find her. 'I'm a-going to seek my niece through the wureld.'"
    ham: "Devastated but forgiving — speaks with a quiet, stunned dignity. His forgiveness of Emily is immediate and unconditional, more heartbreaking than any curse."
