styleGuidance:
  tone: suspenseful, theatrical, with Micawber's characteristic bombast providing
    both comedy and genuine dramatic tension
  targetWordCount: 800
  atmosphere: 'the arrival of the mysterious letter in David''s quiet study — the
    elaborate handwriting, the blotted ink, the mounting dread and excitement. The
    consultation with Traddles and Aunt Betsey: candlelight, maps, whispered plans,
    the sense that a long-pending storm is about to break'
  scenePacing: daily life at David's (calm, ordinary) → the letter arrives (mysterious,
