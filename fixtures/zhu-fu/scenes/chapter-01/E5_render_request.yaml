sceneBrief: 祥林嫂反复讲述阿毛的故事，但鲁镇人从掉泪到厌烦到嘲弄——他们开始故意逗她说'祥林嫂，你们的阿毛如果还在，不是也就有这么大了么？'后来又专拿她额上的伤疤取乐，问她'你那时怎么竟肯了？'，她只能无言地走开。柳妈来做帮工，一日问她额角上的伤疤来历，随后告诉她：到了阴司，两个死鬼男人会争她，阎罗王只好把她锯成两半分给他们。柳妈建议她到土地庙捐一条门槛作为替身——给千人踏万人跨，以此赎罪。祥林嫂恐惧万分，独自到西头的土地庙求捐门槛。庙祝起初不肯，等她哭了才答应——十二元鹰洋，她攒了将近一年。捐完之后她精神舒畅，眼光也分外有神。但冬至祭祀时，当她坦然伸手去拿酒杯和筷子时，四婶慌忙大叫：'你放着罢，祥林嫂！'她像被炮烙似的缩了手，脸色同时变成灰黑——连捐了门槛也洗不清她的'污秽'。从此她不再开口，眼睛窅陷下去，头发在几个月内花白，记性也坏了，连淘米也忘记。她变成了一个木偶人。
styleGuidance: {"tone":"从阿毛故事的重复疲劳→柳妈的骇人地狱描述→捐门槛的短暂希望→冬至喝止的致命一击。四个阶段的情绪色调截然不同，需在同一个场景中完成过渡。","characterVoice":{"liu_ma":"柳妈的语气是关心的、絮叨的、认真的——她不是在吓人，而是在分享她深信的事实。'你呀，我想：这总是你自己愿意了……'——用家常话讲地狱。","fourth_aunt":"一声'你放着罢，祥林嫂！'——短短几个字，要读出恐慌和厌恶混合的力度。"},"scenePacing":"柳妈的对话需要用日常闲聊的平淡口吻说出最恐怖的内容——越是轻描淡写，越显残酷。捐门槛后的短暂舒朗要写得真切（让读者几乎相信她真的得到救赎了），然后冬至喝止要像一道闪电击碎一切。","targetWordCount":1500}
