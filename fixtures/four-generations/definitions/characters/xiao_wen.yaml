description: 文侯爷，虽然是民国元年出生，但继承了前朝旗人的文化与传统。他会唱戏、拉胡琴，是个票友。他的妻子文若霞是女票友，夫妻俩靠唱戏维持生活。他性格温和、与世无争，即使在亡国之际也只关心他的新腔。他代表了北平文化中不问世事、只求艺术的一面。
