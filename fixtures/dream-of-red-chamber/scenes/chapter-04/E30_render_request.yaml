sceneBrief: 香菱随薛宝钗入住大观园蘅芜苑，一心向学作诗。她拜黛玉为师，黛玉命她先读王维五律一百首、杜甫七律一百二十首、李白七绝一百首——'肚子里先有了这三个人做了底子'。香菱拿到诗稿后如痴如醉，白天夜里都在吟哦揣摩，'茶饭无心，坐卧不定'。她以'咏月'为题练笔：第一首语词堆砌被评不好；第二首拘泥月色仍不够；第三首竟在梦中得句——'精华欲掩料应难，影自娟娟魄自寒'——博得众钗一致称赞。宝钗笑她'诗魔'，宝玉赞她'老天生人再不虚赋情性'。
