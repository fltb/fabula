sceneBrief: "The château gates clang shut behind Rainsford, and he is alone in the jungle with nothing but a hunting knife and a sack of food. Zaroff has given him a three-hour head start. Rainsford runs — not blindly, but with a hunter's calculation: doubling back, executing intricate loops to confuse his trail. When night falls, he climbs a great tree with a thick trunk and spreading crown, settling into its crotch to rest. Toward morning, he hears the careful approach of footsteps: Zaroff tracking with preternatural skill. Zaroff stops beneath the tree, studies the ground, then looks up — inch by inch — but stops before reaching Rainsford's branch. He smiles, blows a smoke ring, and walks away. Rainsford realizes with horror: Zaroff is playing with him. At dawn, Rainsford climbs down and forces himself to think. He finds a huge dead tree leaning on a living one and constructs a Malay man-catcher — a trap that will drop the dead tree on anyone who trips its trigger. He hides and waits. Zaroff returns, tracking with bloodhound precision. He steps on the trigger bough and senses danger at the last instant, leaping back — but the dead tree strikes him a glancing blow on the shoulder. Zaroff laughs, congratulates Rainsford, and retreats to dress his wound. Rainsford presses deeper into the island as dusk falls, reaching the treacherous ground of Death Swamp."
