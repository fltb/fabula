sceneBrief: "阳春三月，大观园中百花盛开。宝玉在沁芳闸桥边桃花树下读《西厢记》，桃花落满书页，他抖花入池。恰逢黛玉来葬花——肩担花锄、手挂花囊。见宝玉读的是《会真记》，也要看。宝玉用书中词句打趣——'我就是个'多愁多病身'，你就是那'倾国倾城貌''。黛玉怒斥他拿淫词欺负人，宝玉慌忙赔罪。黛玉嗤地一笑，回了一句'呸，原来是个银样镴枪头'。两人共读入神。黛玉归途路过梨香院墙外，听见戏班演习《牡丹亭》——'原来姹紫嫣红开遍，似这般都付与断井颓垣'——不觉心动神摇、如醉如痴，蹲身坐于山石上细嚼曲中滋味，眼中滚下泪来。"
