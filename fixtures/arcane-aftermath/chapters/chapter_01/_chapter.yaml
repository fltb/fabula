chapter: 1
title: "Chapter 1: The Signal"
summary: "Three weeks after the destruction of the Piltover Council chamber, the city is still reeling. In the absence of clear leadership, the Enforcer Corps has taken on expanded authority, and Camille Ferros — the Steel Shadow — has been granted broad discretion to investigate the growing instability between Piltover and Zaun. Meanwhile, Seraphine, Camille's hextech-empathic consultant, begins to sense something unusual in the emotional resonance of the city. A signal — faint, intermittent, and deeply wrong — that seems to be emanating from the undercity. Chapter 1 establishes the central mystery and sets both protagonist-character arcs in motion."
intent: "Establish the post-Season 1 status quo and introduce the central conflict (missing hextech crystals), introduce Camille's methodical morally gray approach to intelligence work, establish Seraphine's empathic abilities and her uneasy position within the Enforcer structure, and foreshadow the conspiracy within Piltover's own institutions."
plannedScenes: 2
