narrativeContent:
  opening: "The ground turned soft and treacherous beneath Rainsford's moccasins, and he knew he had reached the place Zaroff had warned him about. Death Swamp. His foot plunged into ooze that sucked at him like a living thing, and he wrenched it free with a violence born of pure panic. But the softness of the earth gave him an idea.\n\nHe had dug himself in under fire in the trenches of France. That had been a placid pastime compared to this. He dug with his bare hands, with the knife, with a desperation that transcended thought. The pit grew deeper — above his shoulders — and he climbed out to cut saplings, sharpening their ends into points like fangs, planting them in the dark floor below. Then he wove a carpet of weeds and branches and drew it over the mouth like a shroud.\n\nHe crouched behind a lightning-charred stump and waited. The perfume of incense reached him before the man did."
