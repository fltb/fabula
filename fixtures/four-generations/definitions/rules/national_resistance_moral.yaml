ruleId: national_resistance_moral
name: 民族大义与个人选择
typeId: dilemma
initialEpochId: national_resistance_moral:epoch-1
initialSpecificationId: national_resistance_moral:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: national_resistance_moral:exception:1
    status: active
    constraintIds:
      - national_resistance_moral:constraint:1
      - national_resistance_moral:constraint:2
      - national_resistance_moral:constraint:3
      - national_resistance_moral:constraint:4
    scopeBindings: {}
    condition:
      type: expression
      expression: 钱默吟从隐士变成战士——最和平的人变成最坚决的抗日者
    effect:
      type: exempt
  - exceptionId: national_resistance_moral:exception:2
    status: active
    constraintIds:
      - national_resistance_moral:constraint:1
      - national_resistance_moral:constraint:2
      - national_resistance_moral:constraint:3
      - national_resistance_moral:constraint:4
    scopeBindings: {}
    condition:
      type: expression
      expression: 瑞宣最终在瑞全的启发下走上隐蔽抗日之路——终将两种选择合二为一
    effect:
      type: exempt
specifications:
  national_resistance_moral:specification-1:
    statement: 民族大义与个人选择之间永无解的冲突是全书的灵魂命题。每个人都在亡国之际面临选择：瑞全选择了出走抗日，代价是抛弃年迈的祖父和需要他的家庭；瑞宣选择了留下养家，代价是忍受良知煎熬和亡国之辱；钱默吟被动地被卷入——他没有选择被捕，但他选择了出狱后继续战斗；冠晓荷和大赤包选择了当汉奸，代价是出卖灵魂和沦为历史笑柄。老舍没有给出非黑即白的答案——瑞宣留下来教书养家难道就不爱国吗？瑞全抛下一家老小奔赴国难就一定对吗？他通过祁家每一个人的命运展示了这个残酷的时代命题：在亡国之日，没有一个人能全身而退，每一种选择都有它的代价与痛苦。
    constraints:
      - constraintId: national_resistance_moral:constraint:1
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.choice='leave_to_resist' => entity.guilt_about_family>=60
      - constraintId: national_resistance_moral:constraint:2
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.choice='stay_and_support_family' AND entity.political_stance
            CONTAINS 'patriotic' => entity.sense_of_shame>=70
      - constraintId: national_resistance_moral:constraint:3
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.choice='collaboration' => entity.power>=60 AND
            entity.dignity<=20
      - constraintId: national_resistance_moral:constraint:4
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.social_class='lower_class' => entity.patriotic_instinct>=60
            AND entity.resistance_capacity<=30
