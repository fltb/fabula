sceneBrief: 宁国府庆寿辰，贾瑞偶遇王熙凤便起淫心，上前搭讪调戏。凤姐表面敷衍应允，心中已定下毒计。她先约贾瑞夜间在穿堂等候，却让人锁了穿堂门，使贾瑞在腊月的寒风中冻了一夜，差点冻死，回家又被祖父贾代儒打了三四十板子。贾瑞色心不死，凤姐二次约他在空屋等候，这次派贾蓉和贾蔷前去捉拿，勒索了各五十两银子，又泼了他一身粪水。贾瑞又羞又病，加之功课繁重，终于卧床不起。百般求医无效，忽来一僧一道送'风月宝鉴'，叮嘱只可照反面。贾瑞照反面见一骷髅，吓得大骂道士；转而照正面，见凤姐在镜中招手，便入镜与之云雨，如此三四次后精竭而亡。贾代儒夫妇悲痛欲绝，欲烧宝鉴，镜中哭喊'谁叫你们瞧正面了的'，随后飘然远去。
styleGuidance: {"tone":"从猥琐到阴冷，再到荒诞的寓言式收尾","characterVoice":{"wangxifeng":"表面甜言蜜语、满口答应，实则句句是陷阱。'果然你是个明白人'是她的开场白——越是客气，越是危险。","jiarui":"痴迷而愚蠢。凤姐的假意他全信，两次被捉弄仍不死心。临死前照镜——他的悲剧是看不清真幻。"},"scenePacing":"调戏→一设局（穿堂冻夜）→二设局（空屋被擒泼粪）→病笃→僧道送镜→照镜身亡→焚镜远逝","atmosphere":"前半段寒冬夜色中的穿堂冷风、冻得发僵的贾瑞；后半段病榻上镜中招手的妖艳与骷髅的骇人。荒凉与淫艳交织。","targetWordCount":1200}
