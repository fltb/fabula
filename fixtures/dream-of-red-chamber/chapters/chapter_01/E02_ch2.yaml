sceneBrief: 雨村补授应天府，一下马便遇人命官司：冯渊与薛蟠争买一婢，薛蟠倚势将冯渊打死。雨村欲发签拿人，案边门子使眼色制止，退堂密谈。门子原是葫芦庙小沙弥，献上本省护官符，揭示贾史王薛四大家族联络有亲、一损俱损一荣俱荣之势。门子细说被卖之婢乃甄士隐之女英莲，自幼被拐，今落入薛蟠之手；又劝雨村顺水推舟徇私了案以讨好贾府王府。雨村当初得贾府之力补缺，虽初言不可因私废法，终在门子劝诱下动摇。
