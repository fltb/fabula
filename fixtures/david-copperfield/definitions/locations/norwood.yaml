id: norwood
name: "Norwood"
kind: suburban_estate
description: "Mr Spenlow's house at Norwood, a pleasant suburban estate near London where Dora Spenlow lives with her father and her maiden aunts. David first sees Dora in the garden here, and the place is the setting of his courtship — the sunny garden, the little dog Jip, the girl with golden curls. It represents the pretty, sheltered world of Dora's girlhood."
