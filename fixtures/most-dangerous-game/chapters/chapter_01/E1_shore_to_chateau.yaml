event: E1
title: "The Shore to the Château"
narrativeOrder: 2
sceneType: linear
storyTime: day_1_afternoon
pov:
  character: rainsford
  type: third_person_limited
sceneBrief: "Rainsford wakes late in the afternoon, hungry but alive. Following the shore, he finds evidence of a violent chase: crushed underbrush, bloodstained weeds, an empty .22 cartridge, and a sailor's body torn by hounds. He follows the peculiar tree-skeleton warning deeper into the island. As darkness falls, he sights the lights of an enormous château on a high bluff. Approaching the spiked iron gate, he lifts a heavy gargoyle knocker. The door swings open to reveal a giant black-bearded man holding a revolver aimed at Rainsford's heart — Ivan, who is deaf and mute. Then General Zaroff appears, an erect, slender man in evening clothes, and welcomes Rainsford by name, having recognized him from his book on hunting snow leopards in Tibet. Ivan is dismissed with a silent gesture, and Rainsford is drawn into the warmth and light."
