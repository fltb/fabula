sceneBrief: 大观园工程告竣，贾政带着一众清客相公进园题匾额对联。恰巧撞见宝玉在园中闲逛，便喝命他跟从，实则要试他的才学。众人一路游园：从迎门翠嶂（宝玉题'曲径通幽处'）到沁芳亭（宝玉拟'沁芳'对联'绕堤柳借三篙翠，隔岸花分一脉香'），从潇湘馆（有凤来仪）到稻香村（浣葛山庄），从蘅芜苑（蘅芷清芬）到大观楼，再到怡红院（红香绿玉改怡红快绿）。每到一处贾政先命清客拟名，再问宝玉意见。宝玉才思敏捷、题对连连出彩，贾政心中虽暗喜，面子上却严厉斥责——喝命'叉出去'后又叫回来。清客们知趣地一路捧场。这场游园不仅是宝玉展示才学的舞台，更是大观园在读者面前的第一次全景亮相。
styleGuidance: {"tone":"雅致中带着训诫，轻松中暗含紧张","characterVoice":{"jiabaoyu":"在父亲面前紧张但不怯场，题对句句是真心所感。'编新不如述旧，刻古终胜雕今'是他的文学主张——但他自己也突破了这一主张，'沁芳'便是自创新词。","jiazheng":"满口'畜生''叉出去'的训斥中掩饰着满意。他评价宝玉题对时总是先反话否定，再'也罢''也还使得'——这种含混的认可使宝玉始终活在父亲的影子下。","qingke_guests":"专会凑趣的清客们对一切称赞有加，但也确实烘托了题对的氛围——他们的功能类似古希腊戏剧的歌队。"},"scenePacing":"入园翠嶂→沁芳亭→潇湘馆→稻香村→蘅芜苑→大观楼→怡红院→出园","atmosphere":"大观园初秋景色——翠嶂叠石、清溪泻雪、雕甍绣槛、竹影苔痕。贾政一路扶杖而行，清客们满口称赞，宝玉战战兢兢又忍不住展才。","targetWordCount":1200}
