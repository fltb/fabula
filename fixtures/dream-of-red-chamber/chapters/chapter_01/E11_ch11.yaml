sceneBrief: 清虚观打醮引来世交亲友送礼，贾母后悔惊动众人，下午便回府，次日亦借故不去。宝玉因张道士提亲不快，加之黛玉中暑，探病时二人因言语误会爆发冲突。黛玉借金玉之说试探，宝玉情急之下怒砸通灵宝玉，黛玉痛哭并吐出解暑汤。袭人、紫鹃上前劝解，二人均感悔痛交加，伤心流泪。
