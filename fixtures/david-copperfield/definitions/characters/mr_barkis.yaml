  - patient
voiceNotes: "Short, grudging, and oracular — he speaks in fragments and pregnant silences. His great declaration of love, delivered through David, is the three words 'Barkis is willin', and he never elaborates."
backstory: "Carrier on the Yarmouth road. He falls in love with Peggotty, courts her through David, and marries her after Clara Copperfield's death. He saves money quietly and prospers; on his deathbed at Yarmouth he is attended by David and Peggotty, and leaves his savings to her."
