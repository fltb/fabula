id: old_mrs_wei
name: "卫老婆子"
type: matchmaker_neighbor
role: minor
description: "卫老婆子是卫家山人，祥林嫂的邻居。她的角色功能是中介：她第一次把祥林嫂带到鲁家做帮工，参与了婆婆绑架祥林嫂的行动，又在祥林嫂丧夫失子后再一次把她带回鲁家。她是一个实用主义的中年农村妇女，精于世故，善于说话。她对祥林嫂的命运没有道德反思——'她真是交了好运了'（指祥林嫂被卖给贺老六后的短暂好日子）和'这有什么依不依'（指婆婆卖媳妇）都显示出她完全内化了封建社会的价值观。她是信息的传递者——祥林嫂被绑架后和改嫁后的生活，全是通过她的叙述告知读者的。"
appearance: "一个中年的卫家山农村妇女，穿着朴素的棉衣，面容精干，善于察言观色。具体面容文中未细写。"
aliases:
  - "卫老婆子"
  - "卫妈"
gender: "女"
age: "约四十至五十岁"
profession: "中介人、帮工介绍人"
traits:
  - pragmatic
  - shrewd
  - morally_neutral
  - well_connected
  - talkative
  - complicit
voiceNotes: "说话圆滑、世故，善于用'可是……'、'这实在……'之类的过渡语为自己开脱。她既是祥林嫂的邻居，又是婆婆的同谋，却能两面都说得通。她对四婶描述婆婆绑架行动的经过时，语气近乎欣赏：'他的婆婆倒是精明强干的女人呵，很有打算……你看，这多么好打算？'"
backstory: "卫老婆子是卫家山的居民，与祥林嫂的婆婆家和祥林嫂本人都有来往。她多次来往于卫家山和鲁镇之间，熟悉两家的情况，利用熟人网络充当劳动力中介。她不是故意害人——只是在这个系统中，像她这样的中间人靠人情和灵活生存。她从未反思过自己在祥林嫂悲剧中的同谋角色。"
knownSecrets:
  - "她参与了婆婆绑架祥林嫂的计划——躲在船里接应"
  - "她知道祥林嫂是被强迫嫁给贺老六的"
