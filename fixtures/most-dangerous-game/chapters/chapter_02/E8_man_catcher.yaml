narrativeContent:
  opening: "The ground turned soft beneath him, and Rainsford knew where he was. Death Swamp. Zaroff had warned him about this place — the quicksand, the sucking mud that had already claimed one foolish sailor. His foot sank into the ooze and he wrenched it back with a violent effort, heart hammering. But the softness of the earth gave him an idea.\n\nHe had dug himself in in France when a second's delay meant death. That had been a placid pastime compared to this. He dug with his hands, with the knife, with a desperation that transcended thought. The pit grew deeper, wider. He cut saplings and sharpened their ends into points like fangs and planted them in the floor of the pit. Then he wove a carpet of weeds and branches and drew it over the mouth like a blanket over a sleeping child.\n\nHe crouched behind a lightning-charred stump and waited. The cigarette smoke reached him before the man did."
