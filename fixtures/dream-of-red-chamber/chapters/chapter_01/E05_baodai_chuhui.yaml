sceneBrief: "凤姐刚走，贾母传宝玉来见。只听一阵脚步声，一位年轻公子进来：面若中秋之月，色如春晓之花，鬓若刀裁，眉如墨画，项上金螭璎珞系着一块美玉。宝玉请安后一眼看见黛玉便笑道：'这个妹妹我曾见过的。'宝玉解释说虽没见过却看着面善，像是远别重逢一般。宝玉走近细问黛玉可有玉？闻知没有，登时摘下通灵玉狠命摔在地上，骂'什么罕物！我也不要这劳什子了！'吓得众人一拥去拾玉。贾母急搂着宝玉哄劝，宝玉流泪说'家里姐姐妹妹都没有，单我有，如今来了个神仙似的妹妹也没有，可知这不是好东西。'经再三哄劝方重新戴上。晚间宝玉为黛玉取字'颦颦'，说西方有石名黛可代画眉之墨。"
