sceneBrief: 中秋节，本是北平最美的时节。然而钱孟石在父亲被捕、弟弟殉国的双重打击下病重而死。钱太太在送殡途中悲愤难抑，一头碰死在棺材上。金三爷与李四爷忙乱中把少奶奶抬回来，又发现了昏倒在门洞里的钱默吟——他被释放了，但已被折磨得不成人形：脸上没有肉，牙被打掉，背上布满血网。瑞宣心中如刀绞，他明白：这就是亡国的代价。
