styleGuidance:
  tone: "grim humour — cruelty rendered through a child's eyes with adult retrospective irony"
  targetWordCount: 800
  atmosphere: "the damp, cold corridors of Salem House; the smell of musty classrooms; the crack of Creakle's stick; the solitary shame of the placard; the warmth of Steerforth's room at night where David tells stories by candlelight"
  scenePacing: "arrival and the placard (humiliating, slow) → Creakle's regime (repetitive dread) → Steerforth's protection (quick relief) → friendship with Traddles (gentle interludes)"
  characterVoice:
    narrator: "Child David's vulnerability overlaid with adult David's understanding — the shame of the placard is still raw even in the telling, but the admiration for Steerforth is shaded by what the adult knows will come"
    steerforth: "Easy, confident, slightly mocking — he speaks to everyone as a superior, his kindness to David laced with condescension. 'Come, Copperfield, tell me a story'"
    traddles: "Cheerful despite everything — his voice is bright, his conversation full of sketches and jokes, his laughter unbroken by the beatings"
    creakle: "A voice of pure menace — 'Mr Creakle' spoken with capital letters of dread — his words are few, his presence signalled by the shaking of his head and the reaching for his cane"
