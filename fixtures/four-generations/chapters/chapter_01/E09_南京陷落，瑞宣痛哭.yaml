sceneBrief: 南京陷落的消息传来时，瑞宣正在去学校的路上。他转身回家，一头扎在床上，失声痛哭——这是北平陷落以来他第一次放声大哭。小顺儿的妈不知所措。广播电台上升起更大的气球，"庆祝南京陷落"的大字刺着每个人的眼。瑞宣想到了蒋委员长的继续抗战宣言，心中又燃起一丝希望。他决定：宁可丢了脑袋，也不向敌人屈膝。
