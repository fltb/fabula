description: "David's first love and first wife. Dora is a beautiful, childish, impractical young woman — the daughter of Mr Spenlow, a proctor in Doctors' Commons. David falls hopelessly in love with her at first sight, idealising her as a 'fairy' or a 'seraph.' She is small, pretty, and coquettish, with a passion for her dog Jip, music, and flowers, and a total incapacity for domestic management. She is called a 'child-wife' because she is essentially a child in a woman's body, incapable of managing a household or understanding adult responsibilities. Despite the marriage's practical difficulties, Dora loves David genuinely in her simple, affectionate way. She dies after a long, gentle illness, and her death is one of the most moving passages in the novel."
appearance: "Small, fair, and exquisitely pretty, with bright blue eyes, golden curls, a sparkling little face, and a petite figure. She wears blue and has a little parasol and a little dog named Jip that is as pretty and spoiled as she is. She is always 'the bewitching little Dora.'"
