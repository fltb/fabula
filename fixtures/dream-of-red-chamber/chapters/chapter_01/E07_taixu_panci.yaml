authorNotes:
  - "要求判词以原文韵文形式逐首呈现。金陵十二钗正册的每首判词——从'可叹停机德，堪怜咏絮才'到'情天情海幻情身'——均需以曹雪芹原文的五言/七言绝句形式插入叙述，不可改写为白话。每首判词前的画亦须以白描叙述。"
