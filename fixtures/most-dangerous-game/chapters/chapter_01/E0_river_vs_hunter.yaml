styleGuidance: "Begin with atmospheric, languid dialogue establishing Rainsford's confidence and Whitney's unease. The gunshots are an abrupt intrusion. The fall overboard should be sudden and shocking. The swim is a desperate, methodical fight for survival. End with exhausted collapse on the shore."
narrativeContent:
  opening: "The yacht slid through the Caribbean night like a ghost on water, its engine a muffled heartbeat beneath the deck. Rainsford leaned against the rail, the bowl of his brier pipe glowing and fading in the darkness, and watched the place where the island ought to be — a place that was only a denser patch of blackness against the black sky.\n\n'I rather think they understand one thing — fear,' Whitney was saying. 'The fear of pain and the fear of death.'\n\nRainsford laughed, a short, dismissive sound. 'Nonsense. This hot weather is making you soft, Whitney. Be a realist. The world is made up of two classes — the hunters and the huntees. Luckily, you and I are hunters.'\n\nHe did not see Whitney's troubled expression in the dark. He did not feel the chill that had crept into the air. He only heard, faint and far away, three shots, spaced precisely, punching through the velvet night like a message from another world.\n\nThe three shots hung in the air like a question no one would answer. Rainsford was at the rail before the last echo died, straining to see — and his pipe, striking a taut rope, was torn from his lips. He lunged for it, his center of gravity shifted, and with a hoarse cry he was falling, the blood-warm water closing over his head like a door slamming shut."
