sceneBrief: 春天来了，但北平的人心还冻结在冰里。钱默吟的身体渐渐恢复，但他的精神已经彻底变了。他不再吟诗赏花，不再喝茵陈酒。他告诉瑞宣：他羡慕金三爷的身体，因为有力气才能报仇。他不再考虑什么来得及来不及，只想赶快好起来去和日本人拼命。他鼓励钱少奶奶生一个会打仗的孩子。瑞宣从钱先生身上看到了一种全新的力量——一个最和平的人变成了最坚决的战士。
