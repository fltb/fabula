sceneBrief: "众人正说话间，忽听后院传来笑声：'我来迟了，不曾迎接远客！'黛玉心下纳罕——这人是谁，竟在贾母面前如此放诞无礼？只见一群媳妇丫鬟围拥着一个丽人从后房进来：头上戴着金丝八宝攒珠髻，绾着朝阳五凤挂珠钗，项上带着赤金盘螭璎珞圈，裙边系着豆绿宫绦双衡比目玫瑰佩，身上穿着缕金百蝶穿花大红洋缎窄裉袄——通身的气派非凡。贾母笑着介绍说她是'凤辣子'、王熙凤。凤姐携着黛玉的手上下打量，笑道：'天下真有这样标致的人物，我今儿才算见了！竟不像老祖宗的外孙女儿，竟是个嫡亲的孙女。'又因黛玉母亲去世而用帕拭泪，贾母劝止后立刻转悲为喜，连声吩咐黛玉缺什么要什么只管告诉她。凤姐又问月钱放过了不曾、找缎子给黛玉裁衣裳，雷厉风行间尽显管家少奶奶的精明干练。"
