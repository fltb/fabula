pov:
  character: narrator_omniscient
  type: omniscient
sceneBrief: 贾琏携黛玉送林如海灵柩回姑苏，事毕返回。昭儿先回报信：林如海于九月初三病逝，黛玉从此无家可归，彻底成为荣国府寄居之客。宝玉闻讯深为黛玉伤感。贾珍因秦可卿丧事之后又逢此丧，感叹贾府多事之秋。贾宝玉路遇北静王水溶，水溶以鹡鸰香念珠相赠。黛玉从苏州带回许多书籍笔砚分送诸姐妹，宝玉将北静王所赠念珠转送黛玉，黛玉掷而不取，道"什么臭男人拿过的，我不要他"，显其清高孤傲。
