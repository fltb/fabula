sceneBrief: "David Copperfield is born at Blunderstone Rookery in Suffolk on a Friday at midnight, a posthumous child whose father died six months before. His mother Clara is sitting by the fire, anxious and tearful, when the formidable Miss Betsey Trotwood arrives unexpectedly, demanding to see the baby. Miss Betsey had wanted a girl and when she learns the child is a boy, she leaves in disappointment, declaring it 'as plain as plain can be there's no improvement.' Despite this, David's early life is happy, spent with his gentle mother and the devoted servant Peggotty — running in the garden, reading to Peggotty from the Crocodile Book, and sleeping in the warm nursery. The chapter establishes the key relationships and the narrative voice: David looking back on his infancy with a mixture of affectionate memory and wry humour."
