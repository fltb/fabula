description: "The carrier between Blunderstone and Yarmouth, a dour, secretive man who courts Peggotty through young David with the immortal message 'Barkis is willin'. His courtship is conducted in silence and parcels — he leaves oranges and a wooden egg-cup as tokens. He marries Peggotty, makes a modest fortune by careful savings, and dies years later at Yarmouth, leaving Peggotty a comfortable widow. His dying request to David — 'Barkis is willin' — closes his story with characteristic economy."
appearance: "A gruff, weather-beaten man in a low-crowned hat, driving his grey horse and cart along the Yarmouth road. He has a way of shutting one eye and speaking in short, grudging sentences."
aliases:
