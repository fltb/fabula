sceneBrief: 薛宝钗微恙，贾宝玉前往梨香院探望。宝钗要看宝玉的通灵玉，翻来覆去念着上面的字——'莫失莫忘，仙寿恒昌'。丫鬟莺儿笑说这两句话倒像与姑娘金锁上的'不离不弃，芳龄永继'是一对，宝钗不等她说完便嗔她多话。宝玉索要金锁细看，也念了两遍，笑称'姐姐这八个字倒真与我的是一对'。正说话间，林黛玉来了，一见宝玉在宝钗处便笑道'嗳哟，我来的不巧了'，后又借雪雁送手炉之机暗讽宝玉听宝钗的话。宝玉的奶妈李嬷嬷唠叨劝阻饮酒，黛玉反替宝钗说话，言语间机锋暗藏。这场梨香院的小聚，表面笑语融融，实则金玉良缘之说初露端倪，宝黛钗三人微妙关系从此刻开始浮现。
