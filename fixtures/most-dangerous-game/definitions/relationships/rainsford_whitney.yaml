description: "Rainsford and Whitney are fellow big-game hunters traveling together on a yacht bound for Rio de Janeiro and a jaguar-hunting expedition up the Amazon. They share a profession and a love of hunting, but differ fundamentally in their philosophical outlook. Whitney reproaches Rainsford's dismissive attitude toward animal suffering, introducing the moral tension that will later be tested when Rainsford himself becomes the hunted. Their dynamic is collegial but pointed — Whitney's gentle moralizing sets up the story's central thematic question."
