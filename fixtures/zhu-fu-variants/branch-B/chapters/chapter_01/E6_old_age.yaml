styleGuidance:
  tone: "不是伤感，不是控诉，不是庆祝——是一种'注视'的语调。叙述者试图在零碎信息中还原一个他没有参与的故事。这种距离感本身就应该成为文本的一部分：书写者与被书写者之间，永远隔着一条看见与看不见的河。"
  scenePacing: "贺老六的死（安静地滑入）→祥林嫂独坐的沉默→时光跳到阿毛成家、孙子出生→跳到她的终局：春天的死和灶上的粥。时间在这里加速——因为这是一条没有戏剧性转折的分支。最后回到叙述者的视角：'我'怎样从二手信息中拼凑出这些碎片。结尾落在'被人看见'——这是叙述本身的伦理声明。"
  characterVoice:
    narrator: "这一场的叙述语气应当比原文的E1更安静——不是'不知不觉地渐渐轻松'的自我辩护，而是'我从未真正认识她'的诚实承认。书写不是救赎，书写只是注视。"
    avoid: "不要把她写成'幸福的老太太'——她仍然是穷苦的、粗糙的、没有名字的。不要浪漫化贫穷。不要暗示'如果贺老六没死就一切都好了'——分支B的意义不在于提供一个幸福的替代方案，而在于揭示：在那个系统中，'正常'的存活需要多少偶然条件。"
