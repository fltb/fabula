authorNotes:
  - "众人取别号是了解每个人性格的绝佳窗口——黛玉'潇湘妃子'呼应娥皇女英泪竹典故，宝钗'蘅芜君'端庄含蓄，探春'蕉下客'灵动自嘲——每个号都有深意"
  - "海棠诗限'门盆魂痕昏'韵——这是最经典的限韵之一，宝钗和黛玉的两首七律各有千秋。李纨评宝钗'含蓄浑厚'第一、黛玉'风流别致'第二，体现了她本人的审美取向"
