  notes: "David meets Agnes Wickfield when he arrives in Canterbury to lodge at her father's house. She is twelve, keeping house with a serene wisdom beyond her years. From their first meeting, Agnes is David's 'good angel' — she steadies him, counsels him, and quietly loves him throughout his infatuation with Dora. David, blind to his true feelings, treats her as a beloved sister and confidante. The relationship is profoundly asymmetrical in awareness: Agnes knows her love from childhood; David does not recognise his until after Dora's death, years later. When he finally does, he realises that Agnes has been the steady centre of his life all along — his 'better self' made flesh."
