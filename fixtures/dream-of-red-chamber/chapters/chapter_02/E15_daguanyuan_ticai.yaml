styleGuidance:
  tone: "雅致中带着训诫，轻松中暗含紧张"
  targetWordCount: 1200
  atmosphere: "大观园初秋景色——翠嶂叠石、清溪泻雪、雕甍绣槛、竹影苔痕。贾政一路扶杖而行，清客们满口称赞，宝玉战战兢兢又忍不住展才。"
  scenePacing: "入园翠嶂→沁芳亭→潇湘馆→稻香村→蘅芜苑→大观楼→怡红院→出园"
  characterVoice:
    jiabaoyu: "在父亲面前紧张但不怯场，题对句句是真心所感。'编新不如述旧，刻古终胜雕今'是他的文学主张——但他自己也突破了这一主张，'沁芳'便是自创新词。"
    jiazheng: "满口'畜生''叉出去'的训斥中掩饰着满意。他评价宝玉题对时总是先反话否定，再'也罢''也还使得'——这种含混的认可使宝玉始终活在父亲的影子下。"
    qingke_guests: "专会凑趣的清客们对一切称赞有加，但也确实烘托了题对的氛围——他们的功能类似古希腊戏剧的歌队。"
