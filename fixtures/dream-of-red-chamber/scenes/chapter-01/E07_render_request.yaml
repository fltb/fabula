sceneBrief: 宁国府贾珍之妻尤氏请贾母等来府赏梅。宝玉饭后犯困，被秦可卿引至自己房中安睡。恍恍惚惚睡去，来到太虚幻境。警幻仙子奉宁荣二公之灵所托，带宝玉至薄命司。宝玉开了金陵省大橱，拿出又副册、副册、正册三册册籍。又副册晴雯判词'霁月难逢，彩云易散'，副册香菱判词'根并荷花一茎香'。正册十二钗判词逐一展开：钗黛合幅'玉带林中挂，金簪雪里埋'，元春'榴花开处照宫闱'，探春'生于末世运偏消'，湘云'襁褓之间父母违'，妙玉'欲洁何曾洁，云空未必空'，迎春'子系中山狼'，惜春'勘破三春景不长'，凤姐'凡鸟偏从末世来'，巧姐'势败休云贵'，李纨'到头谁似一盆兰'，可卿'情天情海幻情身'。宝玉看完仍不解，警幻遂带他去听红楼梦曲。
