description: 秦可卿，宁国府长孙贾蓉之妻，秦业养女，金陵十二钗之一。第十三回"秦可卿死封龙禁尉"即其事。美貌绝伦、性格温柔，却早逝于贾府鼎盛之时，葬礼规模逾制，成为全书一大疑点。在太虚幻境中，她是警幻仙姑之妹，乳名兼美，字可卿。
appearance: 鲜艳妩媚，有似乎宝钗；风流袅娜，则又如黛玉——兼二人之美
