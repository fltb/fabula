sourceContext:
  entries:
    - excerpt: "这种人虽然似乎很可怜，但是败坏风俗的，用她帮忙还可以，祭祀时候可用不着她沾手，一切饭菜，只好自己做，否则，不干不净，祖宗是不吃的。"
      classification: FACT
      styleNote: "四叔的判决——'不干不净'将祥林嫂从祭祀体系永久排除。这是她社会死亡的关键转折。"
    - excerpt: "'祥林嫂，你放着罢！我来摆。'四婶慌忙的说。她讪讪的缩了手，又去取烛台。'祥林嫂，你放着罢！我来拿。'四婶又慌忙的说。"
      classification: STYLE
      styleNote: "鲁迅的致命重复——'你放着罢'两次出现，第二次省略了宾语，四婶用最少的语言完成了最彻底的拒绝。这是全文最简洁也最残忍的对话。"
    - excerpt: "她像是受了炮烙似的缩手，脸色同时变作灰黑，也不再去取烛台，只是失神的站着……这一回她的变化非常大，第二天，不但眼睛凹陷下去，连精神也更不济了。"
      classification: FACT
      styleNote: "捐门槛赎罪的彻底失败——'炮烙似的'是鲁迅唯一一次用酷刑比喻祥林嫂的反应，标志着精神世界的最后坍塌。"
