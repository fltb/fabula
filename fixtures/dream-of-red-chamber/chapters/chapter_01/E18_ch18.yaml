sceneBrief: 凤姐将贾赦欲讨鸳鸯作妾之事告知平儿。平儿、袭人在山石后劝慰鸳鸯,三人互诉心事,鸳鸯痛斥贾赦色欲并表明宁死不从、剪发为尼、以死相抗之志。鸳鸯嫂子来劝婚,被鸳鸯唾骂赶走。宝玉自山石后现身,原是他先藏身捉弄袭人,无意中听见三人密语。
