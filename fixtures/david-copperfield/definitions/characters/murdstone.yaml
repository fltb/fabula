id: murdstone
name: "Edward Murdstone"
type: antagonist
archetype: cruel_stepfather
role: supporting
description: "David's cruel stepfather, a stern, dark-browed man with a firm conviction in the virtue of 'firmness.' He is handsome in a dark, brooding way, but his good looks are undercut by a hardness of expression and a coldness of manner. He courts and marries Clara Copperfield after her first husband's death, ostensibly to provide her with protection — but in truth to dominate her and her household. He beats David, sends him away to a harsh school, and after Clara's death sets David to menial labour in his warehouse. His sister Jane Murdstone is his companion and co-tyrant. Together they represent the domestic tyranny that Dickens condemns."
appearance: "Dark complexion, dark hair, heavy brows, a firm mouth, a forbidding expression. Dresses in severe black. His face is 'hard and set.' He has a way of looking at people — especially David — that freezes them. His hands are large and his grip is strong."
