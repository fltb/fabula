voiceNotes: 言语张狂恣意，不守礼法。在族中行事跋扈，与儿媳秦可卿之事令人侧目。但处理宁府事务时亦有威仪。
backstory: 宁国府当家人，贾蓉之父。世袭三品威烈将军，荒淫无度，不理家业。与儿媳秦可卿有不伦之事，为其大办丧事逾制。最终宁国府被查抄，贾珍获罪发配。
