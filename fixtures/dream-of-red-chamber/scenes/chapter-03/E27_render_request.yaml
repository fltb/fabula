sceneBrief: 宝玉自挨打后闭门养息，一日收到探春送来的一幅花笺——欲邀结诗社。宝玉欣然而往。秋爽斋中李纨、黛玉、宝钗、迎春、惜春已到。李纨自荐掌坛，众人商议取别号：李纨号"稻香老农"，探春号"蕉下客"，黛玉号"潇湘妃子"，宝钗号"蘅芜君"，宝玉先取"绛洞花主"又改"怡红公子"，迎春号"菱洲"，惜春号"藕榭"。李纨出题——以白海棠为题吟七律一首，限门盆魂痕昏韵。众人各展才情。黛玉一面想一面写又一面抹——末了以"半卷湘帘半掩门"起笔，至"娇羞默默同谁诉"收束。李纨评定蘅芜君第一（"珍重芳姿昼掩门"），潇湘妃子第二。宝玉落第，却心服口服。社名定"海棠社"，约每月初二、十六两社。诗社既立，大观园从此有了自己的文学传统，众姐妹的青春也因此有了最美的寄托。
