sceneBrief: 天安门的庆祝大会冷清而压抑。学生们站了整整半天，一声不出。日本军官在台上用扩音器讲话，但声音在空旷的广场上散开，只像带着痰的咳嗽。干事们发昭和糖，学生们把糖和纸旗扔在地上。冠晓荷远远地向上深深鞠躬，希望日本人能看见他。蓝东阳躲在远处不敢靠近。只有瑞丰这种没心没肺的人，才以为大会开得很成功。
