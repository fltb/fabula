styleGuidance:
  tone: 冷峻、不安、深冬的沉闷
  targetWordCount: 800
  atmosphere: 灰白色的沉重晚云，满天飞舞的雪花，爆竹的火药香——鲁镇的年终氛围与祥林嫂的凄凉形成对照。
  scenePacing: 缓慢铺陈→突然相遇→匆促逃离
  characterVoice:
    narrator: 第一人称叙述，内省而犹豫。面对问题时语无伦次——'也许有罢——我想'、'说不清'。
    xianglins_wife: 单刀直入的三连问，不绕弯子。她已没有时间和精力客套——这是她人生最后的提问。
