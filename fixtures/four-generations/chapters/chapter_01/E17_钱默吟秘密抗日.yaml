sceneBrief: 钱默吟伤愈后彻底告别了过去的自己。他不再穿大褂，不再吟诗，而是换上了短衣，在城中各处秘密活动。他写抗日传单，联络有志青年。他告诉瑞宣：他找到了比诗歌更有力的语言——用行动去唤醒同胞。他每天在外面奔走，有时深夜才回来。瑞宣问他做什么，他只说"做一点儿一个中国人该做的事"。钱默吟还找到瑞宣，请他帮忙写一些宣传文章。瑞宣犹豫之后答应了——他终于为抗战做了一点事。
