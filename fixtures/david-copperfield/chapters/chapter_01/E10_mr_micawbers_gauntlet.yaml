styleGuidance:
  tone: "comic, warm, slightly rueful — the dinner-party scenes are among the most fully comic in the novel, but the shadow of romantic difficulty and financial anxiety gives the laughter an edge"
  targetWordCount: 800
  atmosphere: "David's chambers in Buckingham Street — a modest but cheerful lodging prepared for a dinner party; the scent of mock turtle soup and roast fowl; Mr Micawber's expansive gestures over the wine; Mrs Micawber's perpetual laments; Traddles's patient good humour; the late-night talk of love and fortune"
  scenePacing: "preparations for the dinner (bustling, happy) → the dinner itself (comic set-piece, expansive) → Micawber's speech (climactic oratory) → the aftermath: Spenlow's prohibition and Miss Murdstone's arrival (sobering, dramatic) → Traddles's confidence (quiet, warm)"
  characterVoice:
    narrator: "David as young host — proud, a little anxious, full of love and high spirits. The narration is warm and observant, relishing the comedy of his friends while honestly recording his own lovesick distraction: 'I didn't eat anything — I lived on Dora and coffee.'"
    micawber: "Magniloquent, theatrical, indefatigable — every speech is an oration, every sentence a rolling period. He speaks of his financial difficulties with the same grandiloquence he brings to proposing a toast. 'Mr Copperfield, I am your obedient servant — though at present I am not in a condition to be the servant of anyone.'"
    mrs_micawber: "Loyal, self-dramatizing, perpetually aggrieved — she 'never will desert Mr Micawber,' and she announces this at every opportunity. Her speech is a series of declarations, each more emphatic than the last, delivered with the air of a tragic heroine."
    traddles: "Good-humoured, modest, persevering — he speaks of his struggles with a cheerful frankness that disarms all pity. His conversation about Sophy is tender but undemonstrative, a steady flame compared to David's blaze."
    steerforth: "Charming, condescending, slightly removed — he joins the party but holds himself apart, amused by the Micawbers, pleasant to Traddles. The reader senses that Steerforth is slumming, and that his patience with David's humble friends is wearing thin."
