ruleId: japanese_occupation_law
name: 日本占领区管制
typeId: state_invariant
initialEpochId: japanese_occupation_law:epoch-1
initialSpecificationId: japanese_occupation_law:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: japanese_occupation_law:exception:1
    status: active
    constraintIds:
      - japanese_occupation_law:constraint:1
      - japanese_occupation_law:constraint:2
      - japanese_occupation_law:constraint:3
      - japanese_occupation_law:constraint:4
    scopeBindings: {}
    condition:
      type: expression
      expression: 汉奸和伪政府工作人员可以不鞠躬、不受盘查
    effect:
      type: exempt
  - exceptionId: japanese_occupation_law:exception:2
    status: active
    constraintIds:
      - japanese_occupation_law:constraint:1
      - japanese_occupation_law:constraint:2
      - japanese_occupation_law:constraint:3
      - japanese_occupation_law:constraint:4
    scopeBindings: {}
    condition:
      type: expression
      expression: 抗日地下工作者以假证件和隐蔽方式规避管控
    effect:
      type: exempt
specifications:
  japanese_occupation_law:specification-1:
    statement: 北平沦陷后，日军通过伪政权实施全面管制：城门设卡盘查、发放良民证、物资统制配给、强迫市民参加庆祝日军胜利的游行集会。不服从者以抗日罪名逮捕、毒刑、甚至处死。整个城市在日军的刺刀下运转，每一个北平市民都活在随时可能被逮捕的恐惧中。
    constraints:
      - constraintId: japanese_occupation_law:constraint:1
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.location IN ('loc_beiping', 'loc_xiaoyangquan') AND
            entity.status='alive' => entity.has_pass=true AND
            entity.has_identity_card=true
      - constraintId: japanese_occupation_law:constraint:2
        kind: transition_constraint
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: event.cause='arrest_by_japanese' => entity.status='arrested' AND
            entity.condition='tortured'
      - constraintId: japanese_occupation_law:constraint:3
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: event.type='celebration_parade' AND entity.location='loc_beiping' =>
            entity.did_attend=true OR entity.hidden=true
      - constraintId: japanese_occupation_law:constraint:4
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.location='loc_beiping' => entity.food_supply<=30 AND
            entity.coal_supply<=30
