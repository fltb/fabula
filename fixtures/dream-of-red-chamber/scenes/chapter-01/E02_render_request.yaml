sceneBrief: 贾雨村中举升官后罢职，游历至扬州，在林如海家做西宾教授林黛玉。一日偶游郊外，遇旧友冷子兴，二人于村肆中饮酒闲谈。冷子兴向贾雨村细说金陵贾府之事：宁荣二公之后分为宁国府与荣国府两支；荣国府如今萧索，外面的架子虽未甚倒，内囊却也尽上来了；当家的是二房贾政，其长子贾珠早夭，次子贾宝玉衔玉而生，抓周时只取脂粉钗环，政老爹断言其将来必是酒色之徒；长女元春因贤孝才德选入宫中。冷子兴又详介贾赦、贾琏、王熙凤等人。这一番谈话为贾府的家族谱系和当下处境画出了全景图。
