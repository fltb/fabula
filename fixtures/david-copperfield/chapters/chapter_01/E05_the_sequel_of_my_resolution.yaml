sceneBrief: "Unable to endure his miserable life any longer, David resolves to run away. He sets out from London on foot, heading for Dover to find his only known relative, Aunt Betsey Trotwood. His journey is arduous: his box and half-guinea are stolen, he is robbed by a young man with a donkey-cart, he sells his waistcoat for food, and he sleeps in the open air. After six days of walking, hungry and ragged, he arrives in Dover and finds Miss Betsey's cottage. He presents himself to her, and after some initial shock and cross-examination, Miss Betsey decides to take him in. She writes to the Murdstones, confronts them, and declares she will be David's guardian from now on, renaming him 'Trotwood Copperfield.'"
