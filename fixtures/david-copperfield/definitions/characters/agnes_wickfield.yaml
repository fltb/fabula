id: agnes_wickfield
name: "Agnes Wickfield"
type: love_interest
archetype: angelic_guardian
role: supporting
description: "David's 'good angel' — the steady, wise, loving daughter of Mr Wickfield, who keeps house for her father from the age of twelve and bears the weight of his alcoholism and financial decline. She is the quiet centre of the Canterbury household and of David's emotional life, though he fails to recognise his love for her until late in the novel. Agnes is everything Dora is not: practical, intelligent, selfless, perceptive, and spiritually mature beyond her years. She serves as David's moral guide, his confidante in his love for Dora, and ultimately his wife. Her love for David is constant, patient, and self-effacing — she conceals it for years to avoid compromising his happiness with Dora."
appearance: "Young lady of serene and gentle beauty, with a calm, thoughtful face, a placid brow, and a graceful figure. She has a way of raising her eyes — David calls them 'her mild, clear eyes' — that seems to see into his soul. She is always neatly and simply dressed in quiet colours. Her real beauty is in her expression: earnest, gentle, intelligent."
