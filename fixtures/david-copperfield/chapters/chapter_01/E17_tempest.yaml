threadProgress:
- thread: T4
  advancement: The tragedy of Emily and Steerforth concludes in the most devastating
    possible way — Ham dies a martyr attempting to save the man who destroyed his
    life; Steerforth dies by the sea that was the instrument of his seduction of Emily.
    Both are taken by the same wave, their bodies laid in the same churchyard. The
    moral and emotional arc of the subplot is complete.
  progressAfter: 100
  progressTotal: 100
- thread: T1
  advancement: David's world is shaken to its foundations — he has lost his oldest
    schoolfellow (the idol of his youth) and his Yarmouth friend in a single night
    of horror. The tempest becomes the outer expression of an inner chaos that will
    take years to calm. This is the darkest moment of his young manhood.
  progressAfter: 80
  progressTotal: 100
- thread: T2
  advancement: The violence of the storm and the deaths at Yarmouth stand in stark
    contrast to the quiet domestic sorrow of Dora's decline — two different kinds
    of loss, one cataclysmic, the other gentle, both stripping David of everyone he
    loves.
  progressAfter: 80
  progressTotal: 100
