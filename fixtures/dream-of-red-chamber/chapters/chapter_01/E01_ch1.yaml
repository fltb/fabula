sceneBrief: 作者自云经历梦幻后隐去真事，借通灵之说撰《石头记》，以假语村言敷演闺阁故事。女娲补天遗一顽石于青埂峰下，石头自怨无材入选，遇一僧一道求携入红尘。茫茫大士施幻术将其缩成美玉，携入富贵场温柔乡。不知几世几劫后空空道人过此，见石上刻字，从空见色、由色生情，自色悟空，改名情僧，改《石头记》为《情僧录》。后曹雪芹披阅增删，题曰《金陵十二钗》。正文开始：姑苏阊门外十里街仁清巷葫芦庙旁，住乡宦甄士隐，禀性恬淡不以功名为念，每日观花酌酒为乐。庙中寄居穷儒贾雨村。
