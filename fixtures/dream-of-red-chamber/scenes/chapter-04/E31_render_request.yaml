sceneBrief: 紫鹃为试探宝玉对黛玉的真心，故意谎称黛玉不日就要回苏州老家。宝玉听罢如遭雷击——'一头热汗，满脸紫胀'，继而人事不知，口不能言，眼直手凉。贾府上下慌作一团，袭人哭求紫鹃告知原由。贾母赶来痛斥紫鹃，紫鹃说出是玩笑话。宝玉这才渐渐苏醒，拉住紫鹃不放，说'要去连我也带了去'。待他好转后，紫鹃回到潇湘馆，劝黛玉趁老太太硬朗时早做大事打算——'万两黄金容易得，知心一个也难求'——然而黛玉终究只能暗自垂泪，主仆二人都知道这件大事无人做主。
