chapter: 2
title: "红楼梦——金玉良缘与大观园兴衰"
summary: "本卷涵盖第八回到第二十三回的关键场景：从识金锁、贾瑞之死、秦可卿丧事、凤姐弄权铁槛寺，到大观园题匾、元妃省亲、宝玉悟禅机、宝黛共读西厢。金玉良缘初见端倪，大观园由建到盛，宝玉情悟逐步深入。"
intent: "CORPUS-3: 9 selected scenes from chapters 8-23 of Dream of the Red Chamber (E10-E18). Covers the emergence of the gold-jade destiny, decline of lesser Jia members, construction and inauguration of the Grand View Garden, deepening of Bao-Yu and Dai-Yu's bond, and Bao-Yu's first enlightenment."
plannedScenes: 9
