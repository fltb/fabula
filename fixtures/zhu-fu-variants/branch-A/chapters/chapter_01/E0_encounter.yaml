sceneBrief: "旧历年底，叙述者'我'回到故乡鲁镇，暂住在四叔鲁四老爷家。除夕前日，'我'在镇东头河边遇到沦为乞丐的祥林嫂——她头发全白，脸黄中带黑，木刻似的神情，只有眼珠间或一轮表明她还活着。她突然拦住'我'，用发亮的眼睛盯着'我'，问了三个关于灵魂和地狱的问题：人死了有没有灵魂？有没有地狱？死去的家人能不能见面？与原文不同，'我'这一次没有用'说不清'来搪塞，而是诚实地告诉她：'我是不信这些的——人死了，大概就像灯灭了吧。既没有灵魂，也没有地狱，更不会有死去的人再见面。''我'不知道自己说得对不对，但'我'看着她，不想再骗她。她听了，呆了一呆，眼里的光慢慢暗下去——但嘴角似乎微微动了一下，像是感激，又像是释然。她转身走了，'我'站在雪地里，心里也说不清是什么滋味。"
