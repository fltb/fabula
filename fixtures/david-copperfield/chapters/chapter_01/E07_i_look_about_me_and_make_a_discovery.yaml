styleGuidance:
  tone: "restless, observant, slightly awed — the young man's first real taste of the world beyond school"
  targetWordCount: 800
  atmosphere: "Highgate Hill on a fine day — the elegant Steerforth drawing-room with its dark portraits and polished furniture; Rosa Dartle's harp and her scarred lip; the dusty old world of Doctors' Commons with its velvet-collared proctors and ecclesiastical courts; London's streets full of energy and purpose"
  scenePacing: "school's end and visit to Yarmouth (nostalgic, brief) → Highgate and Steerforth (elegant, unsettling) → Doctors' Commons and the proctor decision (measured, decisive) → Buckingham Street lodgings (fresh start)"
  characterVoice:
    narrator: "David is at the threshold of adulthood — his narration is eager, observant, still impressionable but gaining a sharper eye. He notices Rosa's intensity without understanding it. He reports Steerforth's manner with undiminished admiration, but the gap between David's perception and the reader's understanding is beginning to widen."
    steerforth: "Confident, charming, effortlessly superior — speaks with the easy authority of a young man who has never known contradiction. His conversation is full of warmth and condescension in equal measure, fascinating David and repelling Rosa."
    rosa_dartle: "Sharp, bitter, elliptical — every question is a dagger, every pause carries a weight of unspoken grievance. Her voice is thin, piercing, and full of innuendo that David completely misses."
    betsey_trotwood: "Decisive and practical — 'I want him to be a proctor!' she declares, and the thing is done. Her no-nonsense management of David's future shows her love expressed through action rather than sentiment."
