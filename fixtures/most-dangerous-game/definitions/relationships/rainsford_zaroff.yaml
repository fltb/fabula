type: host_to_prey
description: "The central relationship of the story. Initially, Zaroff is the gracious, cultured host welcoming the celebrated hunter Rainsford to his island home. Rainsford is a guest and fellow sportsman. When Zaroff reveals his true game — hunting men — the relationship pivots to predator and prey. Zaroff views Rainsford as a worthy opponent, a 'foeman worthy of my steel at last.' Rainsford is forced into the role of the hunted, experiencing the terror he once dismissed in animals. Their relationship is one of deadly respect: Zaroff admires Rainsford's woodcraft, and Rainsford is forced to acknowledge the hunter's supreme skill even as he fights for his life."
