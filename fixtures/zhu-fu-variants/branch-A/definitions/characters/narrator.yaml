id: narrator
name: 我
type: intellectual_witness
archetype: passive_observer
role: supporting
description: >
  一个受过新式教育的知识分子，估计二三十岁，在外地读书或工作，年底回到故乡鲁镇。
  他称鲁四老爷为四叔，是四老爷的本家侄子。他属于新党——接受了新文化运动的一些思想，
  懂一点新学，但在旧式家族关系中仍是晚辈。他住在四老爷书房里，看到房中未完全的理学书
  和未必完全的康熙字典，感到与这个家庭的隔阂。他性格中最核心的特质是道德上的犹豫与
  逃避——他看出了祥林嫂命运的不公，但选择了'说不清'的回避策略，最终在祝福的爆竹声中
  轻松地放下内疚。
appearance: >
  一个年轻的知识分子，穿着城里人的衣服，与鲁镇的乡绅氛围格格不入。具体的面容和衣着
  文中未详写，但从他与四老爷的关系和住在书房来看，他有读书人的清瘦气质。
aliases:
