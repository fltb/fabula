sceneBrief: 赵姨娘深恨王熙凤与贾宝玉，暗请马道婆施魇魔法，将二人年度庚帖咒符压于床下。不数日，宝玉突发癫狂——胡言乱语、持刀弄棒、见人就砍，合府上下愕然。正乱间，凤姐亦提刀冲入，见鸡杀鸡、见狗杀狗、见人瞪眼即欲杀之。贾政束手无策，贾母痛哭"已无指望"。一日二人气息渐弱，忽闻木鱼声响，一僧一道飘然而至，谓那通灵宝玉已被声色货利所迷，故招邪祟。和尚持诵三十三天，将玉摩挲复灵，恶咒方解，二人渐次痊愈。经此一难，赵姨娘险恶之心毕露，而凤姐与宝玉皆元气大伤。
