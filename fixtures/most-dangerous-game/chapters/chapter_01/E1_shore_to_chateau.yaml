styleGuidance: "Exploration and discovery. The island should feel beautiful and menacing at once — evidence of violence accumulates gradually, building unease. The château's appearance should feel like a mirage. Ivan at the door is a jump-scare; Zaroff's entrance is a relief that curdles into unease. End with Rainsford crossing the threshold, leaving the jungle for the gilded cage."
narrativeContent:
  opening: "Rainsford opened his eyes to the sun's late-afternoon glare and knew, with the hunter's instinct that had never failed him, that he had slept through most of the day. He was alive. That was the first fact. The second was hunger — a sharp, insistent clawing in his belly. The third fact lay before him: a trail of crushed weeds, a patch of crimson-stained moss, and glittering in the dying light, an empty brass cartridge.\n\nHe followed the trail through the beautiful and terrible jungle, past the stripped tree that stood like a skeleton warning, until at last, as darkness fell, he saw the lights of the château rising on a high bluff — immense, improbable, a fragment of civilization in the heart of savagery. The knocker was a gargoyle, its face frozen in a leering grin, and it boomed against the massive door with a sound that startled Rainsford with its violence. The door swung open as if on a spring, flooding the darkness with a river of glaring gold light. In the center of that light stood a giant, black-bearded to the waist, and in his hand, a long-barrelled revolver aimed directly at Rainsford's heart."
