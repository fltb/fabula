  - obsessive
  - perceptive
voiceNotes: "Eager, insistent, and barbed — her questions pursue a point like a hound, and her speech is full of sharp asides and probing repetitions. She speaks of Steerforth with a mixture of adoration and accusation."
backstory: "Orphaned niece of Mrs Steerforth, raised in her house. Steerforth scarred her lip with a hammer in childhood. She loves him secretly and bitterly, and her questions to David about his doings are the reader's first warning of Steerforth's capacity for cruelty. After Steerforth drowns she is broken, and vanishes from the story into grief."
