description: 替祁家种坟地的乡下人，横粗的小老头儿，约六十岁。他忠厚老实，每年进城给祁家送新小米。战争开始后，他带来了城外不安宁的消息——有人在偷坟盗墓，连王爷坟都被扒了。他提醒祁老人注意祖坟的安全。他的到来给祁家带来了一点点来自土地的亲切与温暖。
