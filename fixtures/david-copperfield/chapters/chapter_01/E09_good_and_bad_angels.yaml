sceneBrief: "David is invited to Mr Spenlow's house in Norwood and meets Mr Spenlow's daughter Dora — 'the bewitching little Dora' — and falls instantly, hopelessly in love. Dora is small, pretty, golden-curled, and utterly charming with her little dog Jip and her coquettish ways. David becomes obsessed, wandering around Norwood, writing passionate letters, and living in a dream of love. Meanwhile, he visits Agnes in Canterbury and writes to her about his passion; she listens with her usual gentle sympathy, though her own feelings are concealed. The chapter contrasts David's childish infatuation with Dora ('my bad angel' — his undisciplined heart) and his deep, unacknowledged reliance on Agnes ('my good angel')."
