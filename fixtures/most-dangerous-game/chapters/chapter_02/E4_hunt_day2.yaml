styleGuidance:
  tone: Frantic desperation. The swamp should feel like a living thing trying to
    swallow Rainsford. The pit-building is primal, methodical. The hound's death
    scream is a victory that tastes like ash. The knife trap should feel like
    throwing the last card in a losing hand — the moment Ivan dies is a
    split-second triumph swallowed by the continuing baying of the hounds. End
    with Rainsford unarmed and pursued.
