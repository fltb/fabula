ruleId: zaroff_hunt_3day
name: Zaroff's Three-Day Hunt
typeId: conflict_rule
initialEpochId: zaroff_hunt_3day:epoch-1
initialSpecificationId: zaroff_hunt_3day:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions: []
specifications:
  zaroff_hunt_3day:specification-1:
    statement: "If the quarry chooses to play the game, Zaroff grants him a
      three-hour head start and follows armed only with a small-caliber pistol.
      The quarry receives a supply of food and an excellent hunting knife — no
      other weapon. If the quarry eludes Zaroff for three whole days, he wins
      the game and is set free on the mainland. If Zaroff finds him before
      midnight of the third day, the quarry loses and is fed to the hounds.
      Zaroff's exact words: 'Three whole days... And then, if at the end of
      three days you have not been caught, you win.'"
    constraints:
      - constraintId: zaroff_hunt_3day:constraint:1
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: zaroff_hunt_active == true => (rainsford_location != 'chateau' AND
            rainsford_status == 'alive') OR (rainsford_status == 'dead' AND
            hunt_over == true)
      - constraintId: zaroff_hunt_3day:constraint:2
        kind: postcondition_requirement
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: zaroff_hunt_active == true => if time > day_4_midnight AND
            rainsford_status == 'alive' then rainsford_wins == true
      - constraintId: zaroff_hunt_3day:constraint:3
        kind: transition_constraint
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: zaroff_in_hunt == true => (zaroff_inventory does not contain
            'hunting_rifle') OR (zaroff_using_rifle_during_hunt == false)
