voiceNotes: 言语好色贪婪，年老而不自重。在母亲贾母面前尚有几分忌惮，在家人面前则倚老卖老。说话粗鄙，贪财好色。
backstory: 荣国府长房贾赦，袭一等将军之职，贾母之长子。贪财好色，荒淫无度。曾欲强纳贾母丫鬟鸳鸯为妾，被贾母痛斥。后因交通外官、仗势欺人等罪名被革职抄家。
