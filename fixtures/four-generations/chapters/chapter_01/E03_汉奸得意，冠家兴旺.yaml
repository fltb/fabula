sceneBrief: 与祁家的愁云惨雾相反，冠家喜气洋洋。冠晓荷认为改朝换代正是活动的好时机，大赤包更是野心勃勃。他们商量着如何巴结日本人，第一步就是出卖钱默吟——冠晓荷知道钱家二儿子仲石摔死了一车日本兵。他决定向日本人告密，作为进身之阶。大赤包热烈支持，认为这是"立功"的好机会。
