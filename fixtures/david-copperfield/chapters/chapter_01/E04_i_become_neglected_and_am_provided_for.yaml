threadProgress:
  - thread: T1
    advancement: "David's lowest point — orphaned, abandoned by the Murdstones, reduced to child labour at Murdstone and Grinby's warehouse. This is the nadir of his childhood, the moment that will drive him to take desperate action."
    progressAfter: 20
    progressTotal: 100
  - thread: T5
    advancement: "First appearance of Micawber and his family. Micawber's endless financial troubles — his credulity, his oratory, his imprisonment in the Marshalsea — establish the pattern of comic desperation that will define his character throughout the novel."
