ruleId: ivan_alternative
name: Ivan's Alternative
typeId: consequence_rule
initialEpochId: ivan_alternative:epoch-1
initialSpecificationId: ivan_alternative:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions: []
specifications:
  ivan_alternative:specification-1:
    statement: "If the quarry refuses to play the game, Zaroff turns him over to
      Ivan. Ivan, who once served as official knouter to the Great White Tsar,
      has his own ideas of sport. The quarry is invariably killed — but not
      quickly. Zaroff presents this as a choice, knowing that any man with sense
      will choose the hunt. His exact words: 'If he does not wish to hunt, I
      turn him over to Ivan.'"
    constraints:
      - constraintId: ivan_alternative:constraint:1
        kind: transition_constraint
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: quarry_refuses_hunt == true => quarry_status == 'dead' AND
            cause_of_death == 'ivan_execution'
