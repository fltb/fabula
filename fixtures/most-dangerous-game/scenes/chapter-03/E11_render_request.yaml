chapter: 3
sceneBrief: The hounds resume the chase. Rainsford, unarmed and exhausted, runs toward a gap of blue showing between the trees — the sea. He reaches the edge of the cliffs and looks down: twenty feet below, the sea rumbles and hisses against jagged rocks. Across a cove he can see the gloomy gray stone of the château. He hesitates, hearing the hounds behind him. He leaps far out into the sea, cutting his cheek on a jagged rock as he enters the water. Zaroff and the hounds arrive at the cliff edge. Zaroff shrugs, sits down, takes a drink of brandy, lights a cigarette, and hums an aria from Madama Butterfly. Rainsford has escaped — for now.
styleGuidance: Desperate climax. The leap should feel like a final, irrational act of defiance — choosing the sea over the hounds. Zaroff's casual response (brandy, cigarette, opera) should feel more chilling than any rage.
