ruleId: widow_purity
name: 寡妇不洁禁忌
typeId: constraint
initialEpochId: widow_purity:epoch-1
initialSpecificationId: widow_purity:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: widow_purity:exception:1
    status: active
    constraintIds:
      - widow_purity:constraint:1
      - widow_purity:constraint:2
    scopeBindings: {}
    condition:
      type: expression
      expression: 如果寡妇的儿子成年并主持祭祀，母亲的身份可以部分覆盖寡妇的身份
    effect:
      type: exempt
specifications:
  widow_purity:specification-1:
    statement: 寡妇被视为不洁、不祥的人。祭祀是洁净的仪式，容不得'不洁'的人触碰。祥林嫂因为寡妇和再寡的双重身份，被彻底排除在祝福祭祀的参与之外。她捐了门槛试图洗净自己，但禁忌的力量超越了个人的赎罪努力——四婶的一句'你放着罢'表明，只要社会认定你不洁，你永远不洁。鲁四老爷在她死后骂她'谬种'——连她的死亡都被视为对祝福仪式的玷污。
    constraints:
      - constraintId: widow_purity:constraint:1
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.gender='女' AND entity.marital_status IN ('widow',
            'remarried_widow') => entity.can_touch_ritual_items=false
      - constraintId: widow_purity:constraint:2
        kind: transition_constraint
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: event.season='new_year_eve' => widow_death.is_ritually_polluting=true
