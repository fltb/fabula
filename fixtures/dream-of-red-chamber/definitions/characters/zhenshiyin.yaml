backstory: 姑苏阊门外十里街仁清巷居住，本是本地望族。一日在梦中对通灵宝玉有一面之缘，梦醒后见一僧一道。元宵节时家仆霍启抱女儿英莲看灯，英莲被拐子拐走。后葫芦庙失火殃及甄家，家产尽毁，投奔岳父封肃受尽白眼。一日在街上遇跛足道人唱《好了歌》，顿悟后随道人出家。
knownSecrets:
  - 梦中曾见"太虚幻境"牌坊及对联"假作真时真亦假，无为有处有还无"
  - 女儿英莲（后为香菱）被拐后下落
