description: "One of Dickens's most memorable comic characters. Mr Micawber is a gentleman of magnificent eloquence and perpetual impecuniosity, always waiting for 'something to turn up.' He is kind-hearted, generous, grandiloquent, and eternally optimistic despite being constantly pursued by creditors and confined to debtors' prison. He takes David in as a lodger during the Murdstone and Grinby days and becomes a father figure. Later, he works as Uriah Heep's confidential clerk while secretly investigating Heep's frauds, culminating in a dramatic exposure scene. He emigrates to Australia where he finally prospers as a magistrate. His philosophy is encapsulated in his famous maxim: 'Annual income twenty pounds, annual expenditure nineteen nineteen and six, result happiness. Annual income twenty pounds, annual expenditure twenty pounds ought and six, result misery.'"
appearance: "A portly gentleman with a bald head, a florid complexion, a large nose, and a pair of eyes that roll expressively. He wears a shabby-genteel suit — very worn but attempting respectability. He has a magnificent chest voice and an oratorical manner."
