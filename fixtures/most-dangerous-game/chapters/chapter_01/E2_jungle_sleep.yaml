narrativeContent:
  opening: "Rainsford opened his eyes to the sun's late-afternoon glare and knew, with the hunter's instinct that had never failed him, that he had slept through most of the day. He was alive. That was the first fact. The second was hunger — a sharp, insistent clawing in his belly. The third fact lay before him: a trail of crushed weeds, a patch of crimson-stained moss, and glittering in the dying light, an empty brass cartridge."
