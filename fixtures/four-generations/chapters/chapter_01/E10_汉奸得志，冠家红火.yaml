sceneBrief: 南京陷落让汉奸们弹冠相庆。大赤包通过李空山的关系当上了妓女检查所所长，威风八面。瑞丰靠胖太太的二舅也当上了教育局庶务科科长。冠家门前贴起了"贵府冠夫人荣升织女检查所所长"的红报子。蓝东阳、瑞丰、冠晓荷三个汉奸互相倾轧又互相利用。大赤包得意洋洋地说："日本人拿第一份，我们拿第二份！"胖菊子也学会了骂人，把蓝东阳推了个趔趄。
