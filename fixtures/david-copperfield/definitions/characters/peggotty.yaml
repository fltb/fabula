id: peggotty
name: "Clara Peggotty"
type: supporting_character
archetype: faithful_servant
role: supporting
description: "The devoted servant of the Copperfield household, universally called Peggotty (by her first name Clara, but the household has two Claras). She is a plump, red-cheeked, warm-hearted woman with rough hands from her housework and a perpetual odour of soap and starch about her. She is David's first and most enduring protector — his refuge from Murdstone's cruelty, his nurse through childhood illnesses, his confidante in all troubles. She marries Mr Barkis, the carrier, and becomes Mrs Barkis, but David always calls her Peggotty. After Barkis's death she keeps house for David until his marriage. She is the sister of Daniel Peggotty of Yarmouth, connecting David to the Peggotty family."
appearance: "Plump, with red cheeks and arms so hard and rough from scrubbing that they used to 'pinch' David when she hugged him. Always wears a clean white apron and a straw bonnet with green ribbons. Her pockets are full of mysterious odds and ends — keys, pincushions, pieces of string."
aliases:
