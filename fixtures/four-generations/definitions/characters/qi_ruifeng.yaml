description: 祁家二孙，瑞宣的弟弟。他浮浅、无聊、爱虚荣，在小学当庶务。北平沦陷后，他先是巴结蓝东阳参加庆祝保定陷落的游行，又投靠冠晓荷，最后靠太太的关系当上了教育局庶务科科长。他毫无国家观念，只在乎吃喝玩乐。瑞宣多次劝他不要当汉奸，他全当耳旁风。他是祁家的反面——没骨气、没担当、没良心。
