sceneBrief: 当天傍晚，'我'坐在四叔书房里越发不安，觉得自己的回答可能害了她。晚饭时四叔照例骂新党，但语气比平日更冷。从短工的简短回答中——'老了'（死了）、'什么时候？——昨天夜里，或者就是今天罢。——我说不清'、'怎么死的？——还不是穷死的？'——'我'得知祥林嫂已经死了。四叔的反应是一句咒骂：'不早不迟，偏偏要在这时候——这就可见是一个谬种！'晚饭沉闷地吃完后，'我'独自坐在灯下，外面的雪花声似乎更大了。'我'的心地渐渐轻松起来——但偶一想到她，又仿佛有些负疚。在孤灯下，'我'开始回想起她半生事迹的断片。
beats:
  - 当天傍晚，'我'坐在四叔书房里越发不安，觉得自己的回答可能害了她。
  - 晚饭时四叔照例骂新党，但语气比平日更冷。
  - 从短工的简短回答中——'老了'（死了）、'什么时候？
  - ——昨天夜里，或者就是今天罢。
  - ——我说不清'、'怎么死的？
  - ——还不是穷死的？
  - "'——'我'得知祥林嫂已经死了。"
  - 四叔的反应是一句咒骂：'不早不迟，偏偏要在这时候——这就可见是一个谬种！
  - "'晚饭沉闷地吃完后，'我'独自坐在灯下，外面的雪花声似乎更大了。"
  - "'我'的心地渐渐轻松起来——但偶一想到她，又仿佛有些负疚。"
  - 在孤灯下，'我'开始回想起她半生事迹的断片。
