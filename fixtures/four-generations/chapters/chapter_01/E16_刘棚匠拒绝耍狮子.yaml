sceneBrief: 新民会为了庆祝保定陷落，要组织游行大会，想找会耍狮子的棚匠们参加。冠晓荷来约六号的刘棚匠去耍狮子。刘师傅是耍狮子的名手，但他一口回绝："我的老家在保定，祖坟在保定！我不能庆祝保定陷落！就是爸爸来叫我，我也不去给日本人耍狮子！"冠晓荷碰了一鼻子灰。刘师傅后来和瑞宣倾诉：他真想走，可是没钱没路费。要是南京偷偷派人来招兵，他一定去。
