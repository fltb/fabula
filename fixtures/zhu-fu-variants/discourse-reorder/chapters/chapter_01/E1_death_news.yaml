    - excerpt: "'不早不迟，偏偏要在这时候——这就可见是一个谬种！'"
      classification: FACT
    - excerpt: 我独坐在发出黄光的菜油灯下，想，这百无聊赖的祥林嫂……现在总算被无常打扫得干干净净了。
      classification: STYLE
      styleNote: 鲁迅的冷抒情——'无常打扫'是佛道混合修辞，'反而渐渐的舒畅起来'暴露了叙述者的自我麻醉。
