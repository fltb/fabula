description: "祁老人，本名不详，七十五岁。小羊圈胡同五号院的房主，祁家的最高长辈。他白手起家，靠勤劳置下房产，一生信奉'和气生财'与'忍为高'。他个子高大，虽然年迈走路还硬朗，小眼睛里总带着笑意。他对日本人并无深仇大恨，只求能平安过自己的日子、过生日、过中秋节。但战争的残酷一点点打碎了他的乐观——钱默吟被捕、孙子瑞全出走、生日无人来贺、钱孟石病死，他先是愤怒，后是沉默，最后也不得不承认：日本人已经不许他过节过生日了。"
appearance: "高大身材，背微驼，花白胡须，小眼睛常带笑意。冬天穿狗皮袜头，扎腿带。"
