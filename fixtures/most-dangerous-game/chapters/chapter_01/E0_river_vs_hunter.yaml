event: E0
title: The River and the Hunter
narrativeOrder: 1
sceneType: linear
storyTime: night_0
pov:
  character: rainsford
  type: third_person_limited
sceneBrief: "On the deck of a yacht cutting through the moonless Caribbean
  night, Whitney reproaches Rainsford's dismissive attitude toward the animals
  they hunt. Rainsford laughs it off: 'The world is made up of two classes — the
  hunters and the huntees. Luckily, you and I are hunters.' Whitney goes to bed
  uneasy. Rainsford, alone, hears three gunshots in the darkness. He springs to
  the rail to peer into the darkness — and his pipe, striking a taut rope, is
  torn from his lips. He lunges for it and loses his balance, falling into the
  blood-warm Caribbean. The yacht speeds away. Stripping off his clothes, he
  swims toward the direction of the shots. An animal scream is cut short by a
  pistol shot. After a desperate swim, Rainsford drags himself onto the rocky
  shore of Ship-Trap Island and collapses into exhausted sleep."
