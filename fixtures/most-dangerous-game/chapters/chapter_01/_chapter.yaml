chapter: 1
title: "On the Yacht and Ship-Trap Island"
summary: "Rainsford and Whitney discuss hunting on the yacht as they approach the mysterious Ship-Trap Island. Rainsford dismisses animal suffering — 'The world is made up of two classes — the hunters and the huntees.' After three gunshots in the night, Rainsford falls overboard and swims to the island. He explores the shore, finding evidence of a violent hunt, and follows a trail to an enormous château where he is greeted by Ivan and the cultured but sinister General Zaroff. Over a magnificent dinner, Zaroff reveals his true passion: hunting the most dangerous game of all — man. He forces Rainsford to choose: hunt or be turned over to Ivan. Rainsford chooses the hunt and is released into the jungle."
intent: "Establish Rainsford's hunter worldview (which will be tested when he becomes prey), introduce Ship-Trap Island's sinister atmosphere, foreshadow the hounds and Zaroff's true nature, and create the moral framework that the rest of the story will challenge. The chapter ends with Rainsford released into the jungle, the hunt begun."
