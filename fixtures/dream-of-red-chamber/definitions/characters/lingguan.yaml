id: lingguan
name: 龄官
type: minor
role: background
description: 龄官，贾府为元春省亲而从苏州采买的十二个戏子之一，工旦角。第三十回"龄官划蔷痴及局外"中，她在蔷薇花架下以金簪在地上反复画"蔷"字，被宝玉看见。她对贾蔷情有独钟，拒绝宝玉的亲近，让宝玉领悟到"各人各得各人的眼泪"——爱情不能勉强、一人只得一人之情。
appearance: 眉蹙春山，眼颦秋水，面薄腰纤，袅袅婷婷，大有黛玉之态
aliases:
  - 龄官儿
gender: 女
age: 15-17
profession: 戏子（旦角）
traits:
  - 痴情
  - 清高
  - 倔强
initialState:
  location: 大观园
  status: alive
  condition: well
backstory: 从苏州采买的女孩，在贾府梨香院学戏，工旦角，技艺精湛。元妃省亲时曾为她之名角表演，元妃赏赐时独加赏她。她性格清高倔强，虽为戏子却不卑不亢。与宁国府贾蔷相恋，思念入骨。第三十回中在蔷薇花架下以金簪反复画"蔷"字，画出几千个"蔷"字而不自知，被宝玉撞见。宝玉请她唱戏，她正色拒绝。后因朝廷对豪门蓄养戏班之禁令而离散或赐予各主人，下落不明。
knownSecrets:
  - 与贾蔷之恋是《红楼梦》中少数真心相待的感情之一
  - 以"划蔷"启发了宝玉关于情感本质的第一次反思
