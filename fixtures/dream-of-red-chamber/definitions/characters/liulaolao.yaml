description: 刘姥姥，乡下老妪，与贾府王家有远亲关系（其女婿王狗儿祖上曾与王夫人之父连宗）。她三进荣国府是全书的叙事线索：一进打秋风得凤姐接济，二进游大观园逗贾母开心，三进搭救巧姐报恩。以底层视角反照贾府的奢靡与衰落。
appearance: 老妪模样，乡下人打扮，头上插花
