sceneBrief: 前一日宝玉因晴雯不开门而心中烦闷，次日晨独立沁芳闸桥下看《会真记》。一阵风吹过，落花如雨，满身皆是。他不忍践踏，用衣襟兜了撒入流水。恰遇黛玉肩上担着花锄、手挂纱囊、缓步而来——她认为落花入水流到外面肮脏之地，不如以绢袋盛了埋在花冢中，日久化为净土。二人遂共葬前日之落花。宝玉以《会真记》中词句打趣，黛玉嗔怒。午后宝玉各处寻黛玉不见，忽闻山坡那边传来呜咽之声。他悄悄过去，只见黛玉于花冢前边哭边吟——"花谢花飞花满天，红消香断有谁怜……"一字一句，如泣如诉。宝玉初听不觉痴倒，细品更觉断肠。黛玉吟完全诗转身欲去，被宝玉追上。宝玉哭道"我今儿才算是明白了"，二人相对流泪，互诉衷肠。
styleGuidance: {"tone":"极致的诗化抒情——葬花词是《红楼梦》中最具悲剧美学的篇章。从温柔葬花到撕心裂肺的哭吟，情绪的张力逐步攀升至顶点。宝玉当场痴倒——这是全书最为'痴'的时刻。","atmosphere":"春末花谢的残败之美——落花、泪痕、悲吟交织成一场凄美的葬礼。葬的不是花，是青春，是生命本身。","targetWordCount":1200}
