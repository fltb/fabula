description: "The eldest child of David and Agnes Copperfield, named after Aunt Betsey Trotwood. Her existence in the final retrospect completes the family picture of David's happy married life — the child around whom Aunt Betsey, now an old woman, dotes. She appears only in the closing survey of the novel, as the emblem of the fulfilled life David has earned."
appearance: "A little girl, the child of David and Agnes; she is presented in the final retrospect among the children at play in the evening light of the family drawing-room."
