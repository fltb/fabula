id: emily
name: "Little Emily"
type: supporting_character
archetype: fallen_woman
role: supporting
description: "Little Emily is Mr Peggotty's orphaned niece, engaged to Ham Peggotty, and the most tragic figure in the novel's subplot. She is a beautiful, wild, and sensitive girl who dreams of becoming a lady and escaping the humble life of Yarmouth. When James Steerforth — charismatic, handsome, and utterly selfish — seduces and elopes with her, she believes he will marry her. Instead, he abandons her abroad after a brief liaison. Her 'fall' shatters the Peggotty family, breaks Ham's heart, and sends Mr Peggotty searching for her across Europe. She is eventually found by Martha and brought to London, then emigrates to Australia with Mr Peggotty to start a new life. Emily is one of Dickens's 'fallen women' treated with genuine sympathy — she is a victim, not a sinner."
appearance: "About fifteen when first introduced, with a bright, merry face, a light figure, a sunburnt complexion, and blue eyes. She wears a little straw hat and a clean, plain dress. Mr Peggotty calls her 'the sweetest little face that ever was seen.' After her fall, her face is worn and sad."
