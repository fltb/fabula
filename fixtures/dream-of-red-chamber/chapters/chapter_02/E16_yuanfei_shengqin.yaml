styleGuidance:
  tone: "极盛中透悲凉——表面的钟鸣鼎食与内心的骨肉离散"
  targetWordCount: 1200
  atmosphere: "元宵月圆之夜，大观园内灯火如昼、香烟缭绕。金顶版舆缓慢穿行于雕梁画栋之间。钟磬声、念诵声、丝竹声交织。一切辉煌到不真实——像一场精心编排的梦。然而元春三次流泪——这梦是悲的。"
  scenePacing: "候驾→入园游览→行礼→亲人相见痛哭→题诗品评→点戏→赏赐→告别→銮驾远去园中空寂"
  characterVoice:
    yuanchun: "三句话是她的核心台词——'好奢华'（对大观园的叹息）、'当日既送我到那不得见人的去处'（对命运的控诉）、'不可如此奢华靡费了'（临别叮嘱）。她说的每句话都带着深宫压抑的气息。"
    jiazheng: "以臣子之礼跪拜女儿——'臣草莽寒门，鸠群鸦属之中，岂意得征凤鸾之瑞'——用最隆重的官话对答，父女之间的私人情感完全消弭在君臣礼数中。"
    jiabaoyu: "在元春面前的宝玉是拘谨而敬重的——元春对他的关爱与母亲无异，但身份已隔天壤。"
