voiceNotes: 说话慈祥和蔼，是贾府的最高权威。疼爱孙子孙女时言语宠溺，处理家务时不失威严。偏爱热闹，常组织宴席游戏。
backstory: 金陵世家史侯之女，嫁与荣国公贾代善为妻，是贾府辈分最高的长辈。极其宠爱孙辈，尤其是贾宝玉和林黛玉。在她的庇护下，宝黛得以在贾府中成长。但最终在家族败落前夕去世。
knownSecrets:
- 暗中支持宝黛之情但未公开表态
- 私下存有私房钱以备不时之需
