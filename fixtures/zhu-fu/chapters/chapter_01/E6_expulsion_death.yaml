sceneBrief: "祥林嫂变成木偶人之后，四婶终于无法忍耐——'祥林嫂怎么这样了？倒不如那时不留她'。她被暗示离开，从此沦为乞丐。她是从四叔家出去就成了乞丐，还是先到卫老婆子家再沦为乞丐？'我'不知道。到'我'在镇东头河边遇见她时，她已是头发全白、黄中带黑、木刻似的脸上眼珠间或一轮、竹篮破碗、开裂竹竿——纯乎是一个乞丐了。除夕夜，或者当天，她死了。短工说：'怎么死的？还不是穷死的？'四叔骂她是'谬种'。她的尸体可能正躺在大街上，而第二天清晨，鲁镇的祝福大典照常举行——爆竹声连绵不断，天地圣众醉醺醺的，预备给鲁镇的人们以无限的幸福。"
