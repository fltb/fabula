voiceNotes: "Grave, courteous, and self-reproachful — he speaks of his dead wife with a tenderness that unmans him, and of his own weakness with a painful candour. His speech is that of a gentleman, but drink loosens his dignity."
backstory: "Widower and solicitor of Canterbury; father of Agnes Wickfield. He takes David as a lodger. Grief and drink make him easy prey for Uriah Heep, who becomes his partner and defrauds him. He is rescued by Micawber's exposure of Heep, recovers, and lives to see his daughter married to David Copperfield."
