sceneBrief: 宝玉与凤姐同时中邪，举止疯狂，合家惊慌失措。众人延医问卜无效，叔嫂二人气息将绝。赵姨娘幸灾乐祸，被贾母痛斥。至第四日，癞头和尚与跛足道人降临，持诵通灵宝玉，嘱将宝玉悬挂室内，避阴人冲犯，三十三日可愈。二人坐于王夫人房中守护，宝玉凤姐渐渐苏醒。黛玉念一声阿弥陀佛，宝钗讥笑佛祖也管姻缘，黛玉红了脸。
