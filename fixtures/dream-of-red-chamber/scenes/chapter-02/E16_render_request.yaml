sceneBrief: 元宵佳节，贾元春奉旨省亲。大观园内张灯结彩、香烟缭绕，处处珠光宝气。元春先乘金顶金黄绣凤版舆入大观园游览，见园中太过奢华，暗自叹息。至贾母正室，元春与贾母、王夫人等亲人终于相见，满眼垂泪、呜咽对泣——'当日既送我到那不得见人的去处'。她一一见过家中各人，问及宝玉学业。元春命宝玉及众姊妹题诗，看了薛林二人的诗作后赞赏有加，独指黛玉代宝玉所作《杏帘在望》为最佳。又请戏班唱戏，点了四出戏。临别时元春再三叮嘱'不可奢华'，又嘱咐贾母等保重身体。众人含泪送别。省亲盛事更胜皇家庆典，但表面的辉煌之下是骨肉分离的悲酸——皇妃身份隔绝了天伦之乐，大观园再华美也只是一座'石头的牢狱'中的片刻欢愉。
styleGuidance: {"tone":"极盛中透悲凉——表面的钟鸣鼎食与内心的骨肉离散","characterVoice":{"jia_yuanchun":"三句话是她的核心台词——'好奢华'（对大观园的叹息）、'当日既送我到那不得见人的去处'（对命运的控诉）、'不可如此奢华靡费了'（临别叮嘱）。她说的每句话都带着深宫压抑的气息。","jiazheng":"以臣子之礼跪拜女儿——'臣草莽寒门，鸠群鸦属之中，岂意得征凤鸾之瑞'——用最隆重的官话对答，父女之间的私人情感完全消弭在君臣礼数中。","jiabaoyu":"在元春面前的宝玉是拘谨而敬重的——元春对他的关爱与母亲无异，但身份已隔天壤。"},"scenePacing":"候驾→入园游览→行礼→亲人相见痛哭→题诗品评→点戏→赏赐→告别→銮驾远去园中空寂","atmosphere":"元宵月圆之夜，大观园内灯火如昼、香烟缭绕。金顶版舆缓慢穿行于雕梁画栋之间。钟磬声、念诵声、丝竹声交织。一切辉煌到不真实——像一场精心编排的梦。然而元春三次流泪——这梦是悲的。","targetWordCount":1200}
