  characterVoice:
    narrator: Adult David with a note of theatrical relish — the mystery of Micawber's
      letter is both comic and thrilling, and the telling captures the excitement
      of a plot advancing toward its resolution.
    micawber: The letter is pure Micawber — rolling periods, classical allusions,
      dark hints wrapped in elaborate syntax, the writer clearly enjoying his dramatic
      role as the secret avenger. 'The serpent that has gnawed my vitals' is vintage
      Micawber, mixing genuine grievance with exquisite self-dramatisation.
    traddles: Earnest, practical, the steady legal mind — his voice cuts through Micawber's
      rhetoric with clear analysis. He has grown from the boy who drew skeletons into
      a reliable young man of law.
    betsey_trotwood: Keen, shrewd, ready for battle — the prospect of confronting
      Heep restores her energy. She has not forgotten her ruined fortune and is eager
      to see justice done.
