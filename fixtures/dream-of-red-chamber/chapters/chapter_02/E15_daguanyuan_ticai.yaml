    advancement: "大观园第一次以完整面貌呈现——从翠嶂到沁芳亭、潇湘馆到怡红院，每一处匾额都在为后续事件（省亲、结社、葬花）预定舞台。这园子是人间的太虚幻境。"
    progressAfter: 0.42
    progressTotal: 1.0
  - thread: T3
    advancement: "大观园的奢华令贾政也觉'太富丽了些'——他深知此园耗资巨大，'省亲不过一瞬间，这园子却要用一辈子来养'。世家大族的体面是沉重的经济负担。"
    progressAfter: 0.42
    progressTotal: 1.0
