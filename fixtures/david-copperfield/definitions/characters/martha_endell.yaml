  - intelligent
  - remorseful
  - proud
  - redemptive
  - knowing
voiceNotes: "Low, urgent, and self-lacerating — she speaks of her own shame with a terrible frankness, and of the world's dark places with the authority of one who has lived in them. Her offer to find Emily is made as a form of penance."
backstory: "A Yarmouth girl who fell into prostitution and was driven from the town. She watches the Peggotty household with longing. Years later, living in the London slums, she hears of Emily's flight, finds her in a house near the Thames, and brings Mr Peggotty to her — the instrument of Emily's rescue and her own partial redemption. She emigrates to Australia with the Peggotty party."
