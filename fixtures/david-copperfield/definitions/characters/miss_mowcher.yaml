  - loyal
  - candid
  - observant
voiceNotes: "Rapid, satirical, and inexhaustible — she talks in a torrent of jokes and home truths, mocking her own diminutive size before anyone else can, and cutting through affectation with devastating directness."
backstory: "A Yarmouth hairdresser who attends Littimer and knows the Steerforth household. David at first suspects her of complicity in Emily's ruin, but she is innocent and loyal: she later helps David and Mr Peggotty, and her evidence against Littimer brings the treacherous servant to justice."
