voiceNotes: "说话带着农村老太太的絮叨和关心。讲述地狱恐怖时语气认真而确信——她不是在吓唬人，而是在真诚地分享自己所信的事实。她的标志性语气是'善意的告诫'：'我想，你不如及早抵当。你到土地庙里去捐一条门槛，当作你的替身，给千人踏，万人跨，赎了这一世的罪名，免得死了去受苦。'"
backstory: "柳妈是鲁镇的普通老年妇女，吃斋念佛，自认为是行善积德之人。她所属的民间佛教信仰融合了因果报应、地狱惩罚和功德交易——这些观念本身是封建社会对女性施加精神控制的上层建筑。柳妈在吓到祥林嫂之后毫无愧疚——她真心觉得自己的地狱故事是在'救人'。"
