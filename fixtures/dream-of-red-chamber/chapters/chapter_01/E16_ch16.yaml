sceneBrief: 刘姥姥在凤姐与鸳鸯的安排下以粗鄙言语和笨拙举箸逗笑贾府众人，贾母等上上下下大笑不止。饭后众人至探春卧室闲话，纵览其阔朗摆设。忽闻鼓乐之声，贾母命家班借水音于藕香榭演习，众人在缀锦阁饮酒，并乘棠木舫游池，凤姐戏撑船晃动，引出后续游览之事。
