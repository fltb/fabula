description: "The numerous children of Tommy Traddles and his wife Sophy, who fill their happy home in the final retrospect. Their existence — a house full of children, with Traddles a successful judge and family man — completes the portrait of the steady, good friend whose homely virtues were rewarded, in pointed contrast to the glamorous ruin of Steerforth."
appearance: "A troop of healthy, happy children, the children of Traddles and Sophy; they appear in the closing retrospect as the cheerful population of the Traddles household."
