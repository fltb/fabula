pov:
  character: rainsford
  type: third_person_limited
sceneBrief: "The hounds resume the chase. Rainsford, unarmed and exhausted, bursts through the tree line to find himself on the sea cliffs — twenty feet below, the water churns against jagged rocks. Across the cove, the gloomy gray stone of Zaroff's château rises against the sky. The hounds are almost upon him. He leaps far out into the sea, cutting his cheek on a jagged rock. He surfaces, gasping, and swims. Zaroff arrives at the cliff edge, shrugs, sits down, takes a silver flask from his pocket, lights a perfumed cigarette, and hums an aria from Madama Butterfly. Rainsford swims around the island and infiltrates the château, hiding in the curtains of Zaroff's bedroom. Zaroff, having dined well, retires at ten o'clock. He locks the door, walks to the window to call to his hounds, and switches on the light. Rainsford steps from the curtains. Zaroff is shocked but recovers quickly, congratulating Rainsford on winning the game. Rainsford refuses the victory: 'I am still a beast at bay.' 'One of us is to furnish a repast for the hounds,' says Zaroff. 'The other will sleep in this very excellent bed. On guard, Rainsford.' They fight. Rainsford wins. The story ends as it began: 'He had never slept in a better bed.'"
