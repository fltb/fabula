voiceNotes: 言语孤傲冷僻，嫌贫爱富。自称"槛外人"，对俗人俗事不屑一顾。但内心深处对宝玉暗藏情愫，言语间偶露波澜。品茶论道时辞锋犀利。
backstory: 金陵十二钗之一，出身仕宦之家，从小多病，买了许多替身均不中用，最后亲自入了空门才好了。寄居贾府栊翠庵，精通茶道、诗词。性格孤傲冷僻，对宝玉暗藏情愫。最终贾府败落后被强盗掳走。
