sceneBrief: 贾母提议凑份子为凤姐过生日，尤氏操办。凤姐推脱，尤氏在荣府处理份子钱，暗中退还平儿、鸳鸯、彩云及赵周姨娘的银两。九月初二生日当天，众人热闹，宝玉却一早素衣出城，借口去北静王府，实际前往水仙庵，准备祭奠金钏儿。
