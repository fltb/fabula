chapter: 3
title: "The End"
summary: "Cornered at the sea cliffs by Zaroff and the hounds, Rainsford leaps into the ocean rather than be torn apart. He swims around the island and infiltrates Zaroff's château, confronting the general in his bedroom. The two men fight. Rainsford wins. The story ends with Rainsford sleeping in Zaroff's bed — the very bed described in the story's opening paragraph."
intent: "Resolve all three threads: Rainsford's survival (he kills Zaroff), his moral awakening (he has become a killer), and Zaroff's curse (his need for a worthy opponent leads to his death). Pay off all foreshadowing: the hunters/huntees inversion is complete, the hounds are avenged, the bed is slept in."
plannedScenes: 1
