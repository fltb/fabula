id: yuanchun
name: 贾元春
type: minor
role: supporting
description: 贾元春，贾政长女，金陵十二钗之一。入宫为妃，封贤德妃，是贾府"烈火烹油、鲜花着锦"般权势的顶峰象征。第十八回"元妃省亲"是她唯一正面出场的情节，省亲大观园与家人短暂团聚，哭诉宫中"不得见人的去处"。判词云"虎兕相逢大梦归"，暗示其最终死于宫闱斗争。
appearance: 雍容华贵，气度非凡
aliases:
  - 元妃
  - 贤德妃
  - 大小姐
gender: 女
age: 20-30
profession: 皇妃
traits:
  - 贤淑
