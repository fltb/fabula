ruleId: no_other_weapon
name: Quarry Weapon Restriction
typeId: equipment_rule
initialEpochId: no_other_weapon:epoch-1
initialSpecificationId: no_other_weapon:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions: []
specifications:
  no_other_weapon:specification-1:
    statement: "The quarry may have no weapon but a small hunting knife — or nothing
      at all. Zaroff gives him a supply of food and an excellent hunting knife,
      but no firearm. Zaroff's exact words: 'I give him a supply of food and an
      excellent hunting knife. I give him three hours' start. I am to follow,
      armed only with a pistol of the smallest calibre and range.' This
      inequality of arms is the foundation of the game — the quarry must rely on
      cunning, woodcraft, and courage rather than firepower."
    constraints:
      - constraintId: no_other_weapon:constraint:1
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: rainsford_in_hunt == true => rainsford_inventory does not contain
            'gun' AND rainsford_inventory does not contain 'rifle' AND
            rainsford_inventory does not contain 'pistol'
