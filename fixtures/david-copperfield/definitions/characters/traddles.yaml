description: "David's loyal schoolfellow at Salem House and lifelong friend. Traddles is a good-natured, hard-working boy with a talent for drawing skeletons and a perpetual state of being unjustly punished by Mr Creakle. He is the most thoroughly good character in the novel — honest, patient, persevering, and without a trace of malice. As an adult he studies law with determination, overcomes poverty and obstacles, marries his beloved Sophy, and eventually becomes a respected judge. He helps David expose Uriah Heep's frauds and is the repository of the evidence collected by Micawber."
appearance: "Sturdy, round-faced, with a cheerful expression and a roughly brushed head of hair that stands up all over. He is always somewhat rumpled and ink-stained. Has a habit of rubbing his hands together when pleased."
