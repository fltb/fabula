description: "Whitney is Rainsford's companion on the yacht, a fellow big-game hunter bound for a jaguar hunting expedition up the Amazon. He is more philosophically inclined than Rainsford, with a poetic sensibility that makes him sensitive to the moral implications of their sport. He is the first to sense the malevolent atmosphere surrounding Ship-Trap Island. He exits the story after the opening scene on the yacht."
