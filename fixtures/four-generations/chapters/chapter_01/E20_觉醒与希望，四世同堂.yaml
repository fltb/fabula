sceneBrief: 珍珠港事件爆发，日本人在小羊圈胡同里围着大槐树欢呼。与此同时，程长顺的新生儿呱呱坠地——一条小小的生命给这死气沉沉的胡同带来了一丝生机。瑞宣与瑞全在中山公园的谈话后，心中豁然开朗。他决定不再犹豫，像钱默吟和瑞全那样去行动。祁家的四世同堂在战火中虽然残破——瑞全在外抗日，瑞宣找到了自己的使命，老人和妇孺在家苦熬——但希望仍在。北平虽沦陷，人心不死。
