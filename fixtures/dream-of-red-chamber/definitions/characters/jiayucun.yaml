backstory: 原系湖州人氏，流寓至姑苏寄居葫芦庙中卖文为生。甄士隐赏识其才学，赠银五十两及冬衣助其上京赴考。中进士后任知府，因"贪酷之弊"被革职。后经林如海举荐、贾政保荐复起任应天府尹，在任上徇情枉法乱判葫芦案，放走薛蟠；后一路攀附贾府升至大司马。贾府败落后对贾家落井下石。
knownSecrets:
  - 葫芦案中明知香菱即甄士隐之女英莲却未施救
  - 甄士隐赠银之恩后忘恩负义
