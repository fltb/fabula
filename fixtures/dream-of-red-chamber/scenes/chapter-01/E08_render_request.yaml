sceneBrief: 宝玉看完判词仍不解，警幻仙子遂领他来到歌舞场，命十二舞女演奏《红楼梦》十二支曲子。先引子《红楼梦引》：'开辟鸿蒙，谁为情种？'随后十二支曲逐一演奏：《终身误》'都道是金玉良姻，俺只念木石前盟'，《枉凝眉》'一个是阆苑仙葩，一个是美玉无瑕'，《恨无常》元春之曲，《分骨肉》探春之曲，《乐中悲》湘云之曲，《世难容》妙玉之曲，《喜冤家》迎春之曲，《虚花悟》惜春之曲，《聪明累》凤姐之曲，《留余庆》巧姐之曲，《晚韶华》李纨之曲，《好事终》可卿之曲。收尾《飞鸟各投林》：'好一似食尽鸟投林，落了片白茫茫大地真干净！'宝玉听了散漫无稽，竟未悟得其中奥妙——警幻叹其痴儿尚未悟。
