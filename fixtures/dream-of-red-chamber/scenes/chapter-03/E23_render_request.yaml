sceneBrief: 端阳节后，晴雯伺候宝玉换衣时失手跌折了一把扇子。宝玉叹道"蠢材，蠢材"，晴雯性子刚烈，当即顶嘴——"二爷近来气大得很，嫌我们就打发了我们。"宝玉气得浑身乱颤。袭人赶来解围，说了一句"好妹妹，你出去逛逛"，反被晴雯嘲讽——"你如今也学坏了，专会充正经人"。宝玉怒气未消，扬言要回太太打发她出去。晚间宝玉从薛蟠处吃酒回来，醉意微醺，见晴雯在院中凉榻上乘凉，便凑过去拉她起来。晴雯犹带余怒，宝玉笑道"你的性子越发惯娇了"。晴雯说"我最喜欢听撕扇子——把扇子给我，爱怎么撕就怎么撕"。宝玉便将自己的扇子递过去，晴雯嗤嗤几声撕成几半。宝玉又把麝月的扇子夺来给她撕。麝月抱怨，宝玉笑道"千金难买一笑"。二人笑闹和好，一晚上的撕扇声成了怡红院独有的欢乐。
