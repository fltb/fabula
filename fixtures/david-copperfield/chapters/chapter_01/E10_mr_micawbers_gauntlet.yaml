threadProgress:
  - thread: T2
    advancement: "David's courtship of Dora faces its first serious obstacles. Mr Spenlow forbids visits, and the Murdstone complication makes access to Dora nearly impossible. The opposition stiffens David's resolve and heightens the romantic drama — the course of true love is proving anything but smooth."
    progressAfter: 15
    progressTotal: 100
  - thread: T5
    advancement: "Micawber reappears in David's life, his fortunes at a new low. The dinner party reveals Micawber at his most magnificent and ludicrous — full of grand rhetoric and empty pockets. This is the last time David will see Micawber in his old character before the great transformation that lies ahead."
    progressAfter: 15
    progressTotal: 100
  - thread: T1
    advancement: "David's London life takes fuller shape — social, professional, and romantic. The dinner party shows him as a young host, a young lover, and a young friend. His circle is widening: the loyal Traddles, the dashing Steerforth, the comic Micawbers. The ordinary texture of young adult life is richly rendered."
