voiceNotes: "说话带着主母的权威和实用主义的语气。最初对祥林嫂评价正面——'试工期内，她整天的做，似乎闲着就无聊，又有力，简直抵得过一个男子'。但在关键时刻的喝止——'你放着罢，祥林嫂！'——简短、急促、带着真切的恐慌，仿佛她在触碰一个污秽的东西。这句话是她对祥林嫂态度的本质表达。"
backstory: "四婶是鲁四老爷的妻子，掌管鲁家的日常运作。她遵循丈夫的道德标准——对祥林嫂的排斥不仅出于个人好恶，更是她作为这个封建家庭管家人的角色要求。她不是天生的恶人，但她的'本分'行为最终参与了杀死祥林嫂。"
