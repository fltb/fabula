sceneBrief: "Mr Murdstone marries David's gentle mother Clara, and the happy Blunderstone childhood ends. Murdstone's stern sister Jane arrives to run the household with cold efficiency. David struggles under the new regime of 'firmness' — the Murdstones' favourite word for their system of harsh discipline. When David falls behind in his lessons under Mr Murdstone's brutal teaching methods, he is beaten. In desperation, David bites Mr Murdstone's hand and is sent away to Salem House school as punishment. Before he leaves, Peggotty takes David to Yarmouth to visit her brother's boathouse family, giving him a last taste of happiness before his ordeal."
