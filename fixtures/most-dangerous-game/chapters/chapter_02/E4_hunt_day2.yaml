styleGuidance: "Frantic desperation. The swamp should feel like a living thing trying to swallow Rainsford. The pit-building is primal, methodical. The hound's death scream is a victory that tastes like ash. The knife trap should feel like throwing the last card in a losing hand — the moment Ivan dies is a split-second triumph swallowed by the continuing baying of the hounds. End with Rainsford unarmed and pursued."
narrativeContent:
  opening: "The ground turned soft and treacherous beneath Rainsford's moccasins, and he knew he had reached the place Zaroff had warned him about. Death Swamp. His foot plunged into ooze that sucked at him like a living thing, and he wrenched it free with a violence born of pure panic. But the softness of the earth gave him an idea.\n\nHe dug with his bare hands, with the knife, with a desperation that transcended thought. The pit grew deeper — above his shoulders — and he climbed out to cut saplings, sharpening their ends into points like fangs, planting them in the dark floor below. Then he wove a carpet of weeds and branches and drew it over the mouth like a shroud.\n\nHe crouched behind a lightning-charred stump and waited. The perfume of incense reached him before the man did.\n\nBut when the pit cover gave way, it was not Zaroff who screamed."
