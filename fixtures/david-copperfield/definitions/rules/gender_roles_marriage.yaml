ruleId: gender_roles_marriage
name: Victorian Gender Roles in Marriage
typeId: constraint
initialEpochId: gender_roles_marriage:epoch-1
initialSpecificationId: gender_roles_marriage:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: gender_roles_marriage:exception:1
    status: active
    constraintIds:
      - gender_roles_marriage:constraint:1
      - gender_roles_marriage:constraint:2
      - gender_roles_marriage:constraint:3
    scopeBindings: {}
    condition:
      type: expression
      expression: An unmarried woman with independent means may enjoy greater freedom
        than a married woman
    effect:
      type: exempt
  - exceptionId: gender_roles_marriage:exception:2
    status: active
    constraintIds:
      - gender_roles_marriage:constraint:1
      - gender_roles_marriage:constraint:2
      - gender_roles_marriage:constraint:3
    scopeBindings: {}
    condition:
      type: expression
      expression: A widow regains legal personhood and control of property
    effect:
      type: exempt
specifications:
  gender_roles_marriage:specification-1:
    statement: "Victorian marriage was governed by the doctrine of coverture: a
      wife's legal identity was subsumed by her husband's. She could not own
      property, sign contracts, keep her own wages, or sue or be sued
      separately. The ideal wife was the 'Angel in the House' — a domestic,
      pious, submissive, and nurturing figure who managed the household, bore
      children, and provided moral refuge for her husband from the corrupting
      world of commerce. A wife was expected to be ignorant of business,
      finances, and worldly affairs. Intellectual companionship was not
      required; the ideal was complementary spheres: man in the public world,
      woman in the private home. A woman who failed to meet these ideals — by
      being too independent, too intellectual, too worldly, or unable to manage
      a household — was deemed a failure as a wife. The double standard was
      absolute: male sexual transgression was winked at; female transgression
      was social death."
    constraints:
      - constraintId: gender_roles_marriage:constraint:1
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.gender='female' AND entity.marital_status='married' =>
            entity.can_own_separate_property=false
      - constraintId: gender_roles_marriage:constraint:2
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.gender='female' AND entity.role='wife' =>
            entity.household_knowledge>50 AND entity.business_knowledge<20
      - constraintId: gender_roles_marriage:constraint:3
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.gender='female' AND entity.role='wife' AND
            entity.household_management<30 => entity.social_approval<30 AND
            entity.husband.satisfaction<40
