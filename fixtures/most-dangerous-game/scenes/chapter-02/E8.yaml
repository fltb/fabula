sceneBrief: "After Zaroff retreats to dress his wound, Rainsford resumes his desperate flight through the jungle. Dusk falls, then darkness. He presses on until the ground grows soft beneath his moccasins — he has reached Death Swamp. His foot sinks into quicksand; snip he wrenches it free. The soft earth gives him an idea. He digs a deep pit, sharpens saplings into stakes, plants them at the bottom, and covers the pit with a carpet of weeds and branches. He hides behind a lightning-charred stump and waits. Zaroff approaches with unusual swiftness. The pit cover gives way — but it is not Zaroff who falls in: it is one of his best hounds. Zaroff calls out that Rainsford has scored again, then announces he will return with the whole pack."
