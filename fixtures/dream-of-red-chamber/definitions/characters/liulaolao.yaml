backstory: 寡居多年，与女儿女婿王狗儿一家度日，家境贫寒。因年关难过，听从女婿建议，带外孙板儿到荣国府"打秋风"（认亲求助）。王熙凤接见了她并赠银二十两。二进荣国府时被贾母留下住了几天，游遍大观园，行酒令、品茶、逛园子，闹出许多令人捧腹又心酸的笑话。贾府败落后，刘姥姥三进荣国府，得知巧姐被卖，倾尽家财救出巧姐。
knownSecrets:
  - 目睹贾府最繁华时的种种细节
  - 贾府败落后是少数未落井下石的故人
