sceneBrief: "贾雨村因林如海举荐和贾政相助，补授应天府知府。到任即接一桩人命案：薛蟠打死冯渊后抢走婢女扬长而去，冯家告了一年状无人敢受理。雨村大怒欲发签拿人，案边一门子向他使眼色。雨村退堂密召门子——原来是当年葫芦庙的小沙弥。门子取出一张'护官符'：贾史王薛四大家族谚语，解释道四家联络有亲，薛蟠正是薛家之人，若拿了他官位性命皆难保。被抢婢女竟是甄士隐当年丢失的女儿英莲。雨村听罢徇情枉法，谎称薛蟠已死，冯家得烧埋银了事——遂胡乱判了此案。事后他写信向贾政王子腾报功，又将门子远远发配。"
