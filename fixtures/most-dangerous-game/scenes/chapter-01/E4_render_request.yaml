sceneBrief: Zaroff hosts Rainsford at a magnificent dinner in the medieval dining hall, surrounded by mounted animal heads. Over borsch, filet mignon, champagne, and port, Zaroff reveals his life story: his Cossack youth, his military service, his worldwide hunting career. He confesses that hunting had begun to bore him — and that he invented a new animal to hunt. The animal is man. Rainsford is horrified, calling it murder. Zaroff explains his philosophy: life is for the strong. He offers Rainsford the chance to hunt with him tomorrow. Rainsford refuses and is escorted to his room, where he finds the door locked from the outside.
styleGuidance: Drawing-room horror. The dinner should feel opulent and civilized — the finest linen, crystal, silver, china, perfectly cooked food — while Zaroff calmly describes mass murder. The mounting heads on the walls take on new meaning. Rainsford's horror should grow as Zaroff's pleasantness never wavers.
