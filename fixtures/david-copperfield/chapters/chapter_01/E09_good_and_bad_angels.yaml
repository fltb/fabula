styleGuidance:
  tone: "ecstatic, feverish, self-mocking — adult David looking back on his youthful folly with affectionate derision"
  targetWordCount: 800
  atmosphere: "Mr Spenlow's house in Norwood — a sunny garden, a little dog barking, a girl with golden curls and a blue ribbon; the dusty precincts of Doctors' Commons where David cannot concentrate; the tranquil Canterbury household where Agnes listens with a still, sad patience; the streets of London at night, walked by a man on fire with love"
  scenePacing: "invitation to Norwood (sudden, bright) → first sight of Dora (magical, breathless) → the obsession (accelerating, comic) → visit to Canterbury (poignant contrast) → return to London (resolution to win her)"
  characterVoice:
    narrator: "David narrates his first love with the passionate immediacy of the young man he was, filtered through the rueful humour of the adult he has become. The prose is at once feverish and self-aware — 'I was swallowed up in an abyss of love' — the narrator knows how absurd he was, but he does not mock the feeling itself."
    dora_spenlow: "Light, playful, childish — she speaks in little exclamations, calls her dog Jip, and has no idea of the effect she produces. 'Oh, thank you, Mr Copperfield! How very kind!' — her speech is all surface charm, with no depth, which is both her attraction and her limitation."
    agnes_wickfield: "Gentle, restrained, quietly penetrating — she listens to David's raptures with steady sympathy, but her questions reveal a deeper understanding of what he does not see. 'Are you quite sure, Trotwood, that you love her?' The question is gentle but searching."
    mr_spenlow: "Formal, complacent, a little pompous — a proctor of the old school, more concerned with appearances than with his daughter's happiness. He speaks in measured legal periods, unaware of the romance blooming under his nose."
