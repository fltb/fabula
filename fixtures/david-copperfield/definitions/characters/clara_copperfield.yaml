id: clara_copperfield
name: "Clara Copperfield"
type: supporting_character
archetype: gentle_mother
role: supporting
description: "David's mother, a beautiful, youthful, and gentle-natured woman. She was barely twenty when she married the much older David Copperfield senior, and was left a widow with a child soon after. She is described as looking scarcely more than a child herself — small, fair-haired, with a girlish figure and a trusting disposition. After her marriage to Mr Murdstone, she becomes increasingly timid and submissive, unable to protect her son from the Murdstones' cruelty. She dies when David is about ten years old, worn down by the Murdstone regime and the loss of her baby son. David remembers her with profound tenderness. Her grave in Blunderstone churchyard is a recurring touchstone in his memory."
appearance: "Young, fair, with beautiful luxuriant hair that falls about her face when she takes off her cap. Small and slight, with a youthful figure and a face that expresses her emotions transparently. Often in mourning black or simple white. The very picture of a 'wax doll' as Betsey Trotwood calls her."
