    attribute: effect_on_xianglins_wife
    narrativeHint: "柳妈的出发点是好意——她真心相信捐门槛能救人。但她的地狱恐吓和捐门槛建议共同摧毁了祥林嫂：地狱故事制造了前所未有的恐惧，而捐了门槛后被拒绝则证明这恐惧即使按规则去化解也无法消除。柳妈是无意的毁灭者，也是这套信仰体系的受害者。"
    confidence: 0.9
