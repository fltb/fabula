ruleId: shimmer_addiction_timeline
name: "Shimmer Addiction Timeline"
category: progression_rule
type: "rule"
statement: "Shimmer grants temporary enhancement but causes cumulative physiological damage and dependency."
ruleClass: natural_law
logicalConsequences:
  - description: "Advanced addiction without doses causes withdrawal."
    check:
      type: state_invariant
      filter: "character.shimmer_addiction_phase >= 3"
      severity: error
      assert: "extended abstinence produces withdrawal"
  - description: "Phase transitions require their minimum duration."
    check:
      type: transition_constraint
      filter: "character.shimmer_addiction_phase changes"
      severity: error
      assert: "minimum phase duration is satisfied"
  - description: "Continued use progresses the addiction timeline."
    check:
      type: progression
      filter: "character uses shimmer continuously"
      severity: warning
      assert: "phase increases on the defined timeline"
evidenceChain: []
