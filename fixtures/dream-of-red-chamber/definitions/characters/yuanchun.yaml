  location: 皇宫
  status: alive
  condition: well
  atmosphere: isolated
backstory: 贾政与王夫人之长女，自幼由贾母教养，因"贤孝才德"被选入宫中充任女史，后晋封为凤藻宫尚书、贤德妃。获皇帝恩准省亲，贾府为此修建大观园以迎驾。省亲当日见园内外奢华过费，虽不赞同却无可奈何。与亲人相见时泣不成声，言宫中虽富贵却犹如囚笼——"当日既送我到那不得见人的去处"。省亲后命宝玉及众姊妹搬入大观园居住。其判词画面为"一张弓，弓上挂着香橼"，暗示死于宫斗（"虎兕相逢大梦归"）。
knownSecrets:
  - 宫中生活实为囚笼般的残酷
  - 省亲时已预见大观园繁华之下的家族隐患
