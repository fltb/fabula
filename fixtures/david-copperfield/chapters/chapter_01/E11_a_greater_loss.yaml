sceneBrief: "Mr Barkis, Peggotty's husband and the carrier, dies after a long illness. David goes to Yarmouth for the funeral and stays with Peggotty in her grief. Barkis's will reveals that he has left Peggotty a substantial fortune of three thousand pounds saved from his miserly ways — 'Barkis is willin'' turns out to have been truer than anyone knew. David administers the will and is moved by Peggotty's simple goodness. But the greater loss is that Little Emily has run away with Steerforth. The Peggotty household is shattered. Ham is devastated but forgives her. Mr Peggotty, refusing to curse her, sets out on a desperate search for his lost niece, vowing to find her and bring her home."
