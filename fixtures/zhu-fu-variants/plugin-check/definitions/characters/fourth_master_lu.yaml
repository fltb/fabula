voiceNotes: "说话带着士绅的威严和训诫腔调。骂人时语气短促、不容置疑——'不早不迟，偏偏要在这时候——这就可见是一个谬种！'他的话语是权威的、判决式的，不需要论证和解释。对新党（康有为）的咒骂是习惯性的，近乎口头禅，显示他的保守已内化为本能。"
backstory: "鲁四老爷是鲁镇本地的大户，一个以理学自居但未通过科举考试的读书人。他维持着传统士绅的生活方式和道德标准，是鲁镇事实上的社会权威。他对一切与新学、改革有关的东西都本能地排斥。辛亥革命虽然推翻了帝制，但像他这样的地方士绅依然是农村的统治力量。"
