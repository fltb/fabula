threadProgress:
  - thread: T1
    advancement: "David enters adulthood and London society. His apprenticeship as a proctor marks the beginning of his independent life — the young man now steps into the world, with lodgings, a profession, and a growing circle of acquaintances. The 'undisciplined heart' is about to find its first object."
    progressAfter: 35
    progressTotal: 100
  - thread: T2
    advancement: "Dora not yet met, but David's heart is 'undisciplined' and ready for his first love. The restlessness and eager curiosity of this chapter prepare the ground for his instant infatuation. Meanwhile, Agnes remains in Canterbury, already a constant but quiet presence in David's thoughts."
    progressAfter: 7
    progressTotal: 100
  - thread: T4
    advancement: "Steerforth's charm is on full display in Highgate — his mother adores him, Rosa Dartle watches him with a strange, wounded intensity that hints at a past injury. David, dazzled as always, notices nothing of the darkness beneath the surface. Rosa's bitterness is the reader's first warning of Steerforth's capacity for cruelty."
    progressAfter: 10
    progressTotal: 100
foreshadowing:
