chapter: 2
title: "The Hunt Begins"
summary: "Released into the jungle with only a hunting knife, Rainsford uses every trick of the fox to evade Zaroff. He climbs a tree to rest and is discovered by Zaroff, who toys with him. Rainsford constructs a Malay man-catcher that wounds Zaroff, then presses deeper into the island. In Death Swamp he digs a Burmese tiger pit that kills Zaroff's finest hound. At daybreak the whole pack is released. Rainsford sets a Ugandan knife trap that kills Ivan, but loses his only weapon. Unarmed and pursued by the hounds, he is driven toward the sea cliffs."
intent: "Move from moral choice to pure survival. The chapter establishes the physical and psychological stakes: Rainsford must use every trick as a hunter to survive becoming the hunted. Zaroff's superiority is demonstrated as he tracks Rainsford through the night and deliberately toys with him. Rainsford scores victories — wounding Zaroff, killing a hound, killing Ivan — but each success costs him and strips away his advantages."
plannedScenes: 2
