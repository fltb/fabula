sceneBrief: 秦可卿病重迟迟未决，贾珍经冯紫英举荐请来张友士先生诊脉。张先生先望脉后论症，断定非喜脉而是心病，虑伤脾肝木忒旺经血不调，开益气养荣补脾和肝汤，称若过春分可望痊愈。与此同时贾敬寿辰将近，其不愿回府受礼，命贾珍自行款待亲朋。贾蓉奉命照旧例办两日筵席并请西府诸眷。次日张先生到府，诊脉后分析脉象与症候一一对应，指出病因乃聪明太过思虑过甚，病尚有三分可治。十一回开篇贾敬寿辰日，贾珍遣贾蓉送十六捧盒上等果品，渐有宾客到来，贾瑞于见熙凤时已起淫心。
