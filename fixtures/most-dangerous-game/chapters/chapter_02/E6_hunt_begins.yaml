narrativeContent:
  opening: "The château gates clanged shut behind him, and Rainsford was alone in the jungle with nothing but a knife, a sack of food, and the certain knowledge that the most dangerous hunter in the world would be coming for him at dusk.\n\nFor two hours he ran, not blindly but with calculation, doubling back on his own trail, executing intricate loops through the trackless wilderness. He recalled every trick of the fox hunt, every dodge of the fox. When night found him leg-weary on a thickly wooded ridge, he climbed a great tree with a spreading crown and settled into its crotch, hidden by leaves as thick as tapestry.\n\nHe did not sleep. The silence of a dead world settled over the jungle. And then, toward morning, he heard it: the careful, deliberate approach of footsteps on the winding trail he had left. Something was coming through the bush.\n\nIt was General Zaroff."
