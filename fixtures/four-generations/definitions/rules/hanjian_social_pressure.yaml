ruleId: hanjian_social_pressure
name: 汉奸告密与白色恐怖
typeId: state_invariant
initialEpochId: hanjian_social_pressure:epoch-1
initialSpecificationId: hanjian_social_pressure:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: hanjian_social_pressure:exception:1
    status: active
    constraintIds:
      - hanjian_social_pressure:constraint:1
      - hanjian_social_pressure:constraint:2
      - hanjian_social_pressure:constraint:3
      - hanjian_social_pressure:constraint:4
    scopeBindings: {}
    condition:
      type: expression
      expression: 抗日志士在极少数可靠同志中可以暴露身份
    effect:
      type: exempt
specifications:
  hanjian_social_pressure:specification-1:
    statement: 日伪统治下，汉奸成为日本人控制北平的重要工具。冠晓荷告密导致钱默吟被捕；蓝东阳、瑞丰在教育局内争权夺利互相倾轧；大赤包通过妓女检查所敛财。汉奸之间既相互勾结又相互倾轧，形成了笼罩北平的告密网络。任何一个市民都可能因为邻居的一句谗言而被送入宪兵队。这种白色恐怖比刺刀更可怕——它撕裂了邻里之间的信任，让每个人都互相提防。
    constraints:
      - constraintId: hanjian_social_pressure:constraint:1
        kind: transition_constraint
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: event.cause='informing' => entity.status='arrested' OR
            entity.status='taken_away'
      - constraintId: hanjian_social_pressure:constraint:2
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.tags CONTAINS 'hanjian' => entity.allies.size<=1 AND
            entity.enemies.size>=2
      - constraintId: hanjian_social_pressure:constraint:3
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.tags CONTAINS 'law_abiding_citizen' AND
            entity.neighbor.is_suspicious=true =>
            entity.distance_from_suspicious_person>=50
      - constraintId: hanjian_social_pressure:constraint:4
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.political_stance='resistance' =>
            entity.is_public_about_resistance=false
