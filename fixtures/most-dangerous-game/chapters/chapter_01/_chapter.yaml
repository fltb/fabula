chapter: 1
title: "On the Yacht and Ship-Trap Island"
summary: "Rainsford and Whitney discuss hunting on the yacht as they approach the mysterious Ship-Trap Island. Rainsford dismisses animal suffering with his famous line — 'The world is made up of two classes — the hunters and the huntees.' After hearing three gunshots in the night, Rainsford falls overboard and swims to the island. He explores the shore, finding evidence of a violent hunt, and follows a trail to an enormous château where he is greeted by the cultured but sinister General Zaroff. Over dinner, Zaroff reveals his true passion: hunting the most dangerous game of all — man. Rainsford refuses to participate, setting the stage for the hunt."
intent: "Establish Rainsford's hunter worldview (which will be tested when he becomes prey), introduce Ship-Trap Island's sinister atmosphere, foreshadow the hounds and Zaroff's true nature, and create the moral framework that the rest of the story will challenge. The chapter ends with Rainsford trapped in the château, having refused Zaroff's invitation to hunt."
plannedScenes: 5
