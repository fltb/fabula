sceneBrief: "Rainsford swims around the island and infiltrates Zaroff's château. He hides in the curtains of Zaroff's bedroom. Zaroff, having dined well, retires at ten o'clock. He looks out at the courtyard, calls to his hounds, and switches on the light. Rainsford steps from the curtains. Zaroff is shocked but recovers quickly, congratulating Rainsford on winning the game. Rainsford refuses the victory: 'I am still a beast at bay.' 'One of us is to furnish a repast for the hounds,' says Zaroff. 'The other will sleep in this very excellent bed. On guard, Rainsford.' They fight. Rainsford wins. The story ends as it began: 'He had never slept in a better bed.'"
