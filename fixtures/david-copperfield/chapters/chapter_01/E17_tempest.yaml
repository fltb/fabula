styleGuidance:
  tone: apocalyptic, sublime, overwhelming — the prose must match the fury of the
    storm and the profound tragedy of the double drowning. There is no comfort here,
    only the raw power of nature and the terrible consequences of human action and
    inaction.
  targetWordCount: 1500
  atmosphere: the Yarmouth coast under a black sky — wind that tears the breath from
    the mouth, rain that flies horizontally, the sea a boiling chaos of white and
    grey. The wrecked ship heaves and groans in the surf, its masts whipping, a human
    figure barely visible in the rigging. The crowd on the beach is huddled and helpless,
    their cries lost in the wind. Ham stands apart, his face strange and fixed, already
    gone from them.
  scenePacing: journey to Yarmouth (ominous weather, gathering dread) → the coast
    before the storm (portentous stillness, the sea breathing) → the storm breaks
    (crescendo of wind and wave) → the ship appears (horror approaching) → the figure
    in the rigging (distant desperation) → Ham's decision (inevitable, terrible) →
    the rescue attempt (held breath, crushing wave) → Ham gone (silence within the
    roar) → the body of Steerforth (the face from the past) → the double death accepted
    in stunned silence
  characterVoice:
    narrator: Adult David at his most stripped and direct — the retrospective narrator
      abandons all ornament and irony, describing the storm and its consequences with
      a plain, terrible clarity. The horror is too great for literary effect; the
      prose becomes elemental.
    ham: Almost silent — his few words before the rescue are spoken with a strange,
      faraway calm. 'Masse'r Davy,' he says, 'if my time is come, 'tis come.' He speaks
      with a dignity that transcends his rough dialect. There is no bravado, only
      acceptance.
    david_copperfield: David's voice is that of a helpless witness — he pleads with
      Ham not to go, he screams warnings that are lost in the wind, he stands paralysed
      as the waves close over his friend. His narration conveys the particular horror
      of watching someone you love walk calmly to their death.
