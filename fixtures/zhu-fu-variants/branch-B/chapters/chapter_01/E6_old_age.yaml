sceneBrief: "又过了许多年。贺老六在一个冬天里安静地走了——不是伤寒复发，是老。他的头发全白了，躺在床上，握着祥林嫂的手说：'我走了，你跟阿毛过。'然后闭上眼睛，就像睡着了一样。祥林嫂没有哭——她这辈子已经哭够了。她坐在床边，摸了摸他的额头，凉的。阿毛已经是大人了，娶了媳妇，生了孩子。春丫头也嫁到隔壁村去了。祥林嫂做了奶奶，每天在灶前坐着，看着孙子孙女满院子跑。她的手还是粗糙的，头发也全白了，但脸上有了皱纹——是笑纹，不是木刻的纹路。她从来不问灵魂的事——没有人来吓她，她也不需要寻求答案。她死在一个春天的早晨——还是春天，但这一次，春天没有夺走她的什么东西。她是在自己的床上死的，身边是阿毛和儿媳妇。她说的最后一句话是：'灶上还有粥。'叙述者'我'从来不知道她的后半生——'我'在鲁镇遇到的祥林嫂已经死了，没有另一个人来问'我'灵魂问题。'我'只能从卫老婆子支离破碎的闲谈中拼凑出这些片段——'她倒熬出来了'、'后来在贺家坳老死的'。'我'不知道她的全名，不知道她死在哪一年，不知道她的孙儿叫什么。'我'只知道她没有被锯成两半——不是因为捐了门槛，而是因为她从未走进那套需要锯人的信仰。'我'写下这些，不是为了证明什么——只是想让这个没有名字的女人，至少在这几页纸上，被人看见。"
