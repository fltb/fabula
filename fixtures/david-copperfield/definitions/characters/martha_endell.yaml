id: martha_endell
name: "Martha Endell"
type: supporting_character
archetype: fallen_woman_redemptrix
role: supporting
description: "A Yarmouth girl of Emily's age who has 'gone wrong' — seduced and abandoned, she has sunk into the lowest depths of London. Ostracised by the townspeople of Yarmouth, she watches the Peggotty family from a distance with a desperate, envious longing for the respectability she has lost. Her knowledge of the Thames-side underworld where fallen women hide makes her the instrument of Emily's rescue: it is Martha who finds Emily after Steerforth abandons her, and leads Mr Peggotty to her. Her redemption is Dickens's clearest statement that the 'fallen woman' can be the agent of salvation."
appearance: "A thin, dark-haired young woman with a wild, hunted look; in Yarmouth she wears a shawl over her head and keeps to the edges of the crowd. In London she is ragged and desperate, but her face shows a fierce intelligence beneath the ruin."
aliases:
  - "Martha"
  - "Martha Endell"
gender: female
age: "About Emily's age, early twenties"
profession: "Needleworker (fallen)"
traits:
  - ruined
