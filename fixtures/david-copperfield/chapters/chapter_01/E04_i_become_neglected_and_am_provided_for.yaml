    progressTotal: 100
foreshadowing:
  - id: micawber_providence
    hint: "Micawber's perpetual refrain — 'something will turn up' — sounds comically optimistic now, but it prefigures his eventual redemption and his crucial role in exposing Uriah Heep's fraud."
    targetRevealChapter: 52
    thread: T5
  - id: warehouse_humiliation
    hint: "David's degradation at the warehouse — his shame at being seen by anyone he knows, his fall from the gentry into manual labour — plants the desperate resolve that will eventually drive him to run away to Dover."
