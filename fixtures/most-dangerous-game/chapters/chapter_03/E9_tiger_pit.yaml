sceneBrief: "At dusk, Rainsford reaches Death Swamp. The ground is soft and treacherous; his foot sinks into quicksand. He wrenches it free and, inspired by the soft earth, begins to dig. He has dug foxholes in France under fire, but this is different — this is a pit to kill. He digs until it is above his shoulders, then cuts hard saplings and sharpens them to fine points, planting them in the pit floor. He covers the mouth with a carpet of weeds and branches. Crouching behind a lightning-charred stump, he waits. Zaroff approaches with unusual swiftness. The pit cover gives way — but it is not Zaroff who falls in. It is Lazarus, Zaroff's finest hound, impaled on the stakes. Zaroff calls out his congratulations, then announces he will return with the whole pack."
