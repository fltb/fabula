name: 贾雨村
type: minor
role: supporting
description: 贾雨村，名化，表字时飞，别号雨村。红楼梦第一回出场的线索人物，为全书"假语村言"的谐音象征。穷书生出身，受甄士隐资助上京考中进士，先后任知府、应天府尹，官场中几起几落，是贾府由盛转衰的亲历者和见证人。
appearance: 敝巾旧服，虽是贫窘，然生得腰圆背厚，面阔口方，更兼剑眉星眼，直鼻权腮
aliases:
  - 贾化
  - 贾时飞
