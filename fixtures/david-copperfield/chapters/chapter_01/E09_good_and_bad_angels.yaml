threadProgress:
  - thread: T2
    advancement: "David meets Dora — the central romance of his early manhood begins. He falls instantly, irrationally, and completely in love with 'the bewitching little Dora.' This is the 'bad angel' of the chapter — the undisciplined heart that chooses beauty and charm over substance. Meanwhile, Agnes listens to David's raptures with gentle patience, concealing her own feelings. The triangle of Dora-Agnes-David is established."
    progressAfter: 12
    progressTotal: 100
  - thread: T1
    advancement: "David's 'undisciplined heart' is in full flower. His obsession with Dora — wandering Norwood, writing letters, neglecting his work — is the first serious test of his character. He is incapable of seeing that his love is a boy's fantasy rather than a man's commitment. The chapter explicitly names the moral struggle: 'good angel' vs 'bad angel.'"
    progressAfter: 45
    progressTotal: 100
foreshadowing:
  - id: dora_jip
    hint: "Dora's little dog Jip is more than a pet — he is a symbol of Dora herself: small, pretty, pampered, jealous, and incapable of serious life. Jip's hostility to David and Dora's obsessive care for the dog foreshadow the limitations of their marriage — a household run by caprice rather than competence."
    targetRevealChapter: 37
    thread: T2
  - id: agnes_silent_love
    hint: "Agnes listens to David's raptures about Dora with perfect composure, but the narrative hints at a hidden depth of feeling — 'there was something in her gentle eyes that I could not read.' Her silent love, unspoken for years, is the quiet counterpoint to David's noisy infatuation."
    targetRevealChapter: 60
    thread: T2
  - id: undisciplined_heart_named
    hint: "The chapter title 'Good and Bad Angels' makes explicit the moral framework of the novel. David's 'undisciplined heart' — his tendency to fall in love with the beautiful rather than the good — is the central flaw he must overcome. This pattern will repeat until he learns to govern his affections."
    targetRevealChapter: 45
    thread: T1
