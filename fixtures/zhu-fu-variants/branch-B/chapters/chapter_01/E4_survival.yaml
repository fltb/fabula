sceneBrief: "分支B：贺老六没有死。春天那场伤寒来得很凶，他躺在床上烧了七天七夜，祥林嫂日夜守在床边，用冷水给他擦身。村里人都说不行了——但第八天早上，他睁开了眼睛，要水喝。他活过来了。祥林嫂哭了一整夜——不是悲伤的哭，是那种从地狱门口捡回一条命的哭。阿毛还小，还坐在门槛上剥豆，还活着。春天过去了，夏天来了，贺老六慢慢恢复了力气，又能上山了。大伯本来以为贺老六不行了，已经盘算着来收房——但贺老六站了起来，大伯没来。祥林嫂对自己说：也许她的人生还有一点运气。她再也没有想过回鲁镇。"
