sceneBrief: 芒种节后，大观园中众姐妹正行饯花之礼，独不见黛玉。宝钗自告奋勇去潇湘馆寻她，途中见宝玉进了潇湘馆，便抽身而退。行至池边，忽见一双玉色蝴蝶大如团扇，迎风翩跹、上下翻飞。宝钗取出袖中扇子扑了上去——蹑手蹑脚、屏气凝神，从池心亭直追到滴翠亭，累得香汗涔涔、娇喘细细。正待放弃，忽听亭内有人说话。她止步细听，原来是小红与坠儿在密谈芸儿赠帕定情之事——这是不为人知的丫鬟私情。宝钗心知不妥，怕被发觉招怨，急中生智，故意放重脚步笑说"颦儿，我看你往哪里藏！"假装追寻黛玉至此。小红与坠儿果然只当是黛玉听了去，不再起疑。宝钗金蝉脱壳而去，心头却掠过一丝不安。
