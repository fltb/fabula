sceneBrief: "有一年的秋季，卫老婆子又带了祥林嫂来到鲁四老爷家。她仍然头上扎着白头绳、乌裙、蓝夹袄、月白背心，脸色青黄——但两颊上已经消失了血色，眼角上带着泪痕，眼光也失去了先前那样的精神。四婶起初踌躇——她已是再寡的人了。但听她讲述阿毛的故事，眼圈也有些红了，便将她留下，但暗中告诫：祭祀时不许她沾手。祥林嫂反复讲述阿毛被狼叼走的事：'我真傻，真的。'她说，'我单知道雪天是野兽在山坳里没有食吃，会到村里来；我不知道春天也会有。我一清早起来开了门，拿小篮盛了一篮豆，叫我们的阿毛坐在门槛上剥豆去。他是很听话的，我的话句句听。他就出去了。我就在屋后劈柴，淘米。米下了锅，要蒸豆。我叫阿毛，没有应。出去一看，只见豆撒得一地，没有我们的阿毛了。各处去一问，都没有。我急了，央人出去寻。直到下半天，寻来寻去寻到山坳里，看见刺柴上挂着一只他的小鞋。大家都说，糟了，怕是遭了狼了。再进去，他果然躺在草窠里，肚里的五脏已经都给吃空了，手上还紧紧的捏着那只小篮呢。……'她接着又讲贺老六的死：伤寒复发，吃了冷饭就走了。而丧夫失子之后，大伯来收房，将她赶了出来——她无处可去了。"
