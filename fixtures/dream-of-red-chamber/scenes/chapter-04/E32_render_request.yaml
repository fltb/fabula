sceneBrief: 宝玉生日，群芳在红香圃设宴行令。湘云豪爽贪杯，几轮下来已醉意蹒跚。她悄悄离席外出，众人寻遍不见。有小丫头指山石后芍药花丛——湘云以鲛帕为枕，醉卧芍药花丛中，满头满身都是落花，扇坠般芍药花瓣散落一地，蜂蝶围绕飞舞，她犹在半梦半醒中念着酒令——'泉香而酒冽，玉碗盛来琥珀光，直饮到梅梢月上，醉扶归，却为宜会亲友'。众人笑醒她，她起来还吃了一碗醒酒汤，又忙着划拳行令。黛玉笑她'死也要吃酒'。这场是湘云最经典的形象定格——以花为床、以天为幕的名士风流。
