sceneBrief: 忠顺亲王府长史官前来索要琪官蒋玉菡——宝玉私交戏子之事败露，贾政又羞又怒。贾环趁机告密，说宝玉强奸金钏未遂致其投井。贾政气得面如金纸，喝令"拿宝玉来！拿大棍！拿绳子捆上！"亲自动手，将宝玉按在凳上狠打。宝玉先是哀哀求饶，后痛得乱喊乱叫，贾政更怒——板子下得又狠又快，直打得宝玉皮开肉绽、昏死过去。王夫人闻讯赶来，抱住板子哭诉"既要勒死他，先勒死我"，贾政泪如雨下却仍不肯饶。贾母颤巍巍赶到，厉声喝道"先打死我，再打死他"，贾政方才跪下告罪。宝玉被抬回怡红院，已是面白气弱、臀腿血肉模糊。袭人含泪照看，宝钗送来丸药，黛玉哭得两眼红肿。夜间袭人偷偷向王夫人进言——请求让宝玉搬出大观园，以免再生事端。王夫人深以为然。
styleGuidance: {"tone":"从忠顺王府来索人的紧张到贾政雷霆大怒到痛打的惨烈到众人哭求的戏剧性高潮——层层推进。打完之后各人探视的温情段落作为缓和，最后以袭人进言的暗流收束。","atmosphere":"荣国府笼罩在暴力的阴影中——贾政的雷霆大怒、板子落下的声音、王夫人的哭喊、贾母的怒斥交织在一起。这是全书最为惨烈的家庭冲突。","targetWordCount":1200}
