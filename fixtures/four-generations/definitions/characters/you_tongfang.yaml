description: 冠晓荷从外面娶回来的小老婆，原是唱奉天大鼓的。东北人，因为家乡沦陷流落北平。她在大赤包手下讨生活，但有自己的骨气和是非观。她同情钱家，暗中给钱家送过戒指和钱。她和高第成了好友，两人曾商量一起逃走。
appearance: 小个子，但很精神。会唱曲，有几分风尘气。
aliases:
- 桐芳
gender: 女
age: 约二十多岁
profession: 唱曲艺人（嫁作妾）
traits:
- spirited
