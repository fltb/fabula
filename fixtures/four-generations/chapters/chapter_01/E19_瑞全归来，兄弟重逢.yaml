sceneBrief: 瑞全秘密潜回北平执行任务。他在中山公园后身与大哥瑞宣秘密见面。瑞全变了——不再是那个冲动的学生，而是一个沉着干练的战士。他告诉瑞宣：战争已经进入了新阶段，太平洋战争爆发了，中国的抗战不再孤独。他邀请瑞宣为抗日做更多的工作。瑞宣看着弟弟，心中充满了骄傲与希望——老三回来了，而且老三没有看不起他。他终于找到了自己在战争中的位置。
