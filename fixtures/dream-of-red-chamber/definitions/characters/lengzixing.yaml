description: 冷子兴，都中古董商，贾府管家周瑞的女婿。第二回"冷子兴演说荣国府"中的关键人物，通过他与贾雨村在村野酒肆中的闲谈，向读者宏观介绍贾府世系、人物关系及"一代不如一代"的现状。
