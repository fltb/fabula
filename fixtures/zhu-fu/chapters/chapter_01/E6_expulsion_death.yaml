authorNotes:
  - "本场以《祝福》原文为唯一表述基准：优先保持 sourceContext 中原句的语序、关键词、对白与留白。"
  - "保留“我可不知道”的死亡留白；不得描写死亡现场或为任何人物补写悔意。结尾以原文爆竹、雪花与天地圣众收束。"
sourceContext:
  entries:
    - excerpt: "我给那些因为在近旁而极响的爆竹声惊醒，看见豆一般大的黄色的灯火光，接着又听得毕毕剥剥的鞭炮，是四叔家正在'祝福'了；知道已是五更将近时候。我在朦胧中，又隐约听到远处的爆竹声连绵不断，似乎合成一天音响的浓云，夹着团团飞舞的雪花，拥抱了全市镇。"
      classification: STYLE
      styleNote: "鲁迅的环形收束——'拥抱'是全文唯一的温柔词，却来自祝福仪式而非对人——自然的祝福（爆竹+雪花）掩盖了人的死亡。这是最冷的反讽。"
    - excerpt: "然而她是从四叔家出去就成了乞丐的呢，还是先到卫老婆子家然后再成乞丐的呢？那我可不知道。"
      classification: STYLE
      styleNote: "逐出后的空白是叙述者知识与责任的双重留白；必须保留“不知道”，不以推测填补。"
