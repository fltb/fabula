description: "Richard Babley, known universally as Mr Dick, is Aunt Betsey Trotwood's amiable, eccentric companion. He is a man of childlike simplicity who is widely considered 'half-witted' — though Aunt Betsey insists that 'his simplicity is his wisdom.' He spends his days writing a Memorial (a petition to some unspecified authority) that never gets anywhere because it keeps turning to the story of King Charles the First, and flying a kite from which he hangs copies of his written pages. Despite his apparent foolishness, Mr Dick has moments of profound insight and emotional intelligence. He is a loyal friend to David, a devoted support to Aunt Betsey, and a gentle, loving presence in the household."
appearance: "A middle-aged man with a fresh, boyish face, a high forehead, bright eyes, and a mild, contented expression. He has a habit of carrying a sheaf of papers covered in writing and looking earnestly at people. He dresses plainly and neatly."
aliases:
  - "Mr Dick"
  - "Richard Babley"
gender: male
