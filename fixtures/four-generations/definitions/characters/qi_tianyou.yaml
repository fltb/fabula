description: 祁天佑是祁老人的独子，祁家长辈中唯一在外挣钱的男人。他在西单牌楼附近开一家小布铺，为人诚信，尺码加一，永不欺客。七七事变后生意日渐清淡，城门关闭让乡下主顾进不来城。他忧虑国事却从不张扬，默默支撑着一家人的生计。他的头发在短短几个月里白了许多根。
appearance: 中等身材，圆脸，常穿蓝布大衫。头发渐白，面带愁容。
aliases:
