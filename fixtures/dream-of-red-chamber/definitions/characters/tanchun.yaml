voiceNotes: 说话爽利明快，有男子气概。理家理事时条理分明、魄力十足。在母亲赵姨娘面前颇感无奈，言辞间时露刚强与自尊。
backstory: 贾政与赵姨娘之女，贾宝玉同父异母的妹妹。精明能干，有志气有才能，曾代理荣国府家务，大力改革弊端。因是庶出，常感自卑而更好强。最终远嫁海疆。
