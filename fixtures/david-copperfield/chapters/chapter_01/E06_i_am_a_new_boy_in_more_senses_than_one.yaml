styleGuidance:
  tone: "grave, earnest, quietly hopeful — the prose takes on the measured dignity of the Cathedral town"
  targetWordCount: 800
  atmosphere: "the ancient Cathedral town of Canterbury — the quiet gravity of Doctor Strong's schoolroom, the scent of cobwebs and old books in Mr Wickfield's dim office, the neat order of the Wickfield household managed by a child, Uriah Heep's unsettling presence in the dusty back office"
  scenePacing: "arrival in Canterbury (wonder, observation) → meeting the Wickfields (warm, establishing) → introducing Heep (ominous, unsettling) → school life (steady, peaceful)"
  characterVoice:
    narrator: "David, now with several years of retrospection, narrates his Canterbury years with fondness and gratitude. The voice is more settled and confident — he has found a home and a school worth loving. The unease with Heep is reported with adult hindsight: 'I remember him as a red-haired, lanky youth with a clammy hand.'"
    agnes_wickfield: "Quiet, wise, gently authoritative for her age — speaks with a calm clarity that belies her years. Her dialogue is marked by understatement and a serene directness that steadies everyone around her."
    uriah_heep: "Fawning, unctuous, exaggeratedly humble — every sentence is drenched in self-deprecation. 'I am well aware that I am the humblest person going.' His speech is a mask of servility that barely conceals a rapacious ambition."
    mr_wickfield: "Kind but weighed down by grief and an excessive reliance on his daughter — speaks in gentle, weary tones, often preoccupied with the past and his own weakness of purpose."
