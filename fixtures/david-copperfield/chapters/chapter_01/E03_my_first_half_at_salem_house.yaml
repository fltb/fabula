    progressTotal: 100
  - thread: T4
    advancement: "Steerforth's first appearance establishes his charismatic dominance. David's adoration of the older boy — telling him stories, buying him treats — plants the seeds of the idolatry that will blind David to Steerforth's flaws until it is too late."
