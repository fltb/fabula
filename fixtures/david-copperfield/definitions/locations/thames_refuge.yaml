id: thames_refuge
name: "Thames-side Refuge"
kind: london_slums_riverside
description: "The desperate house near the Thames, close to Blackfriars Bridge, where Emily hides after Steerforth abandons her abroad and she returns to London. It is a place of fog, mud, and ruined women — the world Martha Endell knows intimately and the last refuge of the fallen. It is here that Mr Peggotty finds Emily and forgives her."
