id: ivan
name: "Ivan"
type: servant_bodyguard
description: "Ivan is the largest man Rainsford has ever seen — a gigantic creature, solidly made and black-bearded to the waist. His small eyes peer out from a snarl of beard. He wears a black uniform trimmed with gray astrakhan, and carries a long-barrelled revolver with practiced ease. Though he cannot speak or hear, his physical presence alone is enough to inspire terror. He was formerly an official knouter to the Great White Tsar."
traits:
