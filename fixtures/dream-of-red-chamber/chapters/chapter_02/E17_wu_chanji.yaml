sceneBrief: "薛宝钗及笄生日，贾母出资摆酒唱戏。宝钗点了《鲁智深醉闹五台山》，宝玉嫌热闹，宝钗笑念戏中《寄生草》——'赤条条来去无牵挂'。宝玉拍膝叫好。席间凤姐说小旦像某人，湘云直口说像黛玉，宝玉使眼色制止，湘黛皆恼。宝玉两头劝解不成，反被抢白，回想'赤条条来去无牵挂'的句意，回房提笔写下禅偈——'你证我证，心证意证。无可云证，是立足境。'又续填一支《寄生草》。黛玉看了偈子，笑改一句——‘“无立足境，是方干净”——你这偈子还不通透呢！’宝玉无言以对，只得笑道'谁又参禅了'。"
