description: "《四世同堂》的全知叙述者——第三人称全知叙事的声音。他不作为人物出现在故事中，却深入每一个角色的内心，俯瞰小羊圈胡同的众生相：祁家的忠厚、冠家的无耻、钱家的气节、底层市民的挣扎。他的声音冷静而带着深沉的悲悯，是沦陷区北平世相的观察者与评判者。"
appearance: "不出现在故事中；是俯瞰小羊圈胡同的全知叙事视角。"
