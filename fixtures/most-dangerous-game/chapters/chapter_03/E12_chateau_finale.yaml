styleGuidance: "Tense, intimate confrontation. The bedroom should feel like a trap that has snapped shut. Zaroff's politeness should remain until the very end — he is a sportsman to the last. The fight itself can be brief; the meaning of the moment is in the dialogue and the closing line."
narrativeContent:
  opening: "General Zaroff had an exceedingly good dinner that evening. He drank a bottle of Pol Roger and half a bottle of Chambertin, and he read Marcus Aurelius in his library to soothe himself. Only two annoyances troubled his contentment: the difficulty of replacing Ivan, and the thought that his quarry had escaped him. But surely, he reasoned, the American hadn't played the game — must have drowned.\n\nAt ten o'clock he went up to his bedroom, locked the door, and walked to the window. He looked down at the courtyard where his hounds prowled, and called to them: 'Better luck another time.' Then he switched on the light.\n\nA man stepped from the curtains of the bed.\n\n'Rainsford!' screamed the general. 'How in God's name did you get here?'\n\n'Swam,' said Rainsford. 'I found it quicker than walking through the jungle.'\n\nThe general sucked in his breath and smiled. 'I congratulate you,' he said. 'You have won the game.'\n\nRainsford did not smile. 'I am still a beast at bay,' he said, in a low, hoarse voice. 'Get ready, General Zaroff.'\n\nThe general bowed, deeply, one sportsman to another. 'Splendid! One of us is to furnish a repast for the hounds. The other will sleep in this very excellent bed. On guard, Rainsford.'\n\nHe had never slept in a better bed, Rainsford decided."
