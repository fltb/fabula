threadProgress:
  - thread: T3
    advancement: "凤姐弄权铁槛寺是她由管家走向擅权的转折点——以贾府权势干预司法、从中牟利，两条人命就此断送。这是贾府衰败的内在原因之一：掌权者以权谋私，法纪废弛。"
    progressAfter: 0.39
    progressTotal: 1.0
  - thread: T4
    advancement: "凤姐的狠辣在这一事件中从'整治下人'升级为'漠视人命'。她并非不知后果，而是'从来不信什么阴司地狱报应的'——这种无所畏惧是她的力量也是她的悲剧。"
    progressAfter: 0.39
    progressTotal: 1.0
narrativeChecklist:
  items:
    - dimension: "权力运作"
      description: "凤姐以贾府之名写信给节度使——世家大族对地方司法的干预赤裸裸地展现。一个深宅奶奶的一封信就能决定一场官司的胜负。"
      required: true
    - dimension: "道德转折"
      description: "凤姐并非不知道退亲会有什么后果——净虚说'不过是两家情愿'，但凤姐清楚这是仗势欺人。她的选择标志着一个道德门槛的跨过。"
      required: true
    - dimension: "悲剧对照"
      description: "金哥和守备之子的殉情是一对底层年轻人的纯真爱情悲剧，与凤姐在馒头庵里数银子的场面形成极端对照"
      required: false
styleGuidance:
  tone: "冷峻、精于算计，结尾急转直下的悲剧"
  targetWordCount: 1200
  atmosphere: "馒头庵本是停灵之所，却成了权钱交易的密谋地。老尼净虚的精明、凤姐的精算、最终两条年轻生命的消逝——佛寺之净与此事之污形成反讽。"
  scenePacing: "停灵铁槛寺→住进馒头庵→净虚求助→凤姐要价→双方议定→写信云光→金哥自缢→守备子投河→凤姐从容收银"
  characterVoice:
    wangxifeng: "表面推辞实则精算——'我又不等着银钱使，也不做这样的事'——以退为进。被净虚一激立刻接话：'你是素日知道我的，从来不信什么阴司地狱报应的'——这句话是她整个人生哲学的注脚。"
    jingxu_nun: "老尼姑口齿伶俐，深谙人情世故。她以'太太知道'激将凤姐——她精准抓住了凤姐最大的软肋：好胜心。"
