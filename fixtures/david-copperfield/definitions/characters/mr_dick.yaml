  - cheerful
voiceNotes: "Earnest, simple, and curiously direct. He speaks about his Memorial and King Charles's head as if they are the most urgent matters in the world. His observations, though oddly expressed, often cut to the heart of a matter."
backstory: "Mr Dick's brother had him declared insane and confined him. Miss Betsey befriended him (or 'adopted' him, as she says) and brought him to live in her cottage at Dover, where he is free to write his Memorial and fly his kites to his heart's content. His family tried to get him back, but Miss Betsey fought them off. His association with King Charles's head (which 'always comes into his writing') is a recurring comic motif."
