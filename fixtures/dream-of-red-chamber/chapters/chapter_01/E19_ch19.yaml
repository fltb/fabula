sceneBrief: 元妃省亲后，宁府请贾母赏灯看戏，宝玉嫌喧闹逛至小书房，撞见茗烟与卐儿幽会，未加追究。袭人回家探母归来，以赎身之论试探宝玉，假称家里要赎她回去，哄得宝玉真切挽留。袭人趁机约法三章：一不许赌咒发誓，二不许吃人胭脂，三要读书上进。宝玉一一应允。次日午后，宝玉至黛玉房中，见黛玉午睡，便歪在床上编耗子精偷香芋的故事逗黛玉。黛玉先捶他后缠他讲故事，二人嬉闹间，宝钗走进，取笑宝玉不知典故出处，三人说笑一团。
