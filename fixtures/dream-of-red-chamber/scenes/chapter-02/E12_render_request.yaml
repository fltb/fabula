sceneBrief: 宁国府贾珍之媳、贾蓉之妻秦可卿病逝。贾珍悲痛欲绝，哭得泪人一般，倾尽所有为儿媳办丧事，要丧礼风光体面。尤氏却突然犯了旧疾，卧床不起，宁国府内务无人主持。贾珍为丧礼更加体面，花一千二百两银子给贾蓉捐了五品龙禁尉的官衔，以便灵牌上好看。又请钦天监择日，停灵四十九日，请一百零八众僧人在大厅拜大悲忏，设坛于天香楼。葬礼规格之高、排场之大，逾制越礼，引来满城议论。各路王公贵族皆来祭吊，四王六公的祭棚摆满长街。秦可卿的棺木本是坏了事的义忠亲王老千岁的樯木，贾珍执意使用。这场丧事是宁国府由盛转衰的一个警示性节点——表面的风光之下是逾矩和亏空。
