sceneBrief: On the deck of the yacht cutting through the moonless Caribbean night, Whitney and Rainsford smoke their pipes and discuss Ship-Trap Island — a place the crew fears. Whitney reproaches Rainsford's dismissive attitude toward the animals they hunt, suggesting that the jaguar feels fear and pain. Rainsford laughs it off: 'The world is made up of two classes — the hunters and the huntees. Luckily, you and I are hunters.' Whitney goes to bed uneasy. Rainsford, alone, hears three gunshots in the darkness.
styleGuidance: Atmospheric, languid opening. Build the Caribbean night as a tangible presence — thick, warm, black. The dialogue should establish Rainsford's confidence and Whitney's unease. The gunshots arrive as an abrupt intrusion.
