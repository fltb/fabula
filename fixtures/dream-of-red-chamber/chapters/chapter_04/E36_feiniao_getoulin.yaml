sceneBrief: "宝玉重游太虚幻境，警幻仙姑再展金陵十二钗册籍。十二钗判词依次闪过——从林黛玉薛宝钗的'玉带林中挂，金簪雪里埋'到王熙凤的'一从二令三人木'——宝玉虽见而未能全解。继而十二支红楼梦曲奏响：《枉凝眉》叹宝黛之泪债、《分骨肉》诉探春之远嫁、《乐中悲》怜湘云之坎坷、《世难容》惜妙玉之高洁、《喜冤家》悲迎春之被虐、《虚花悟》证惜春之出家、《聪明累》醒凤姐之机关、《留余庆》叹巧姐之侥幸、《晚韶华》悼李纨之虚名、《好事终》哭可卿之纲常坏。收尾以《飞鸟各投林》作结——'好一似食尽鸟投林，落了片白茫茫大地真干净！'宝玉在幻境中悲戚不已。此场与E08同游幻境并行，但以曲终收束金陵十二钗的全部命运预言。"
