id: blue_dongyang
name: "蓝东阳"
type: hanjian
archetype: petty_collaborator
role: supporting
description: "一个身材矮小、獐头鼠目的汉奸文人，在日伪政权下靠告密和钻营谋生。他与瑞丰同为汉奸阵营中人，却互相倾轧——瑞丰在冠家打牌输钱后恼羞成怒，动手打了蓝东阳；蓝东阳怀恨在心，伺机报复。他是小羊圈胡同汉奸群像中最猥琐的一个，专靠捧日本人的臭脚过活。"
appearance: "身材矮小，獐头鼠目，脸色发绿，一副猥琐相。"
aliases:
  - "蓝东阳"
  - "东阳"
gender: male
age: "中年"
profession: "日伪机关小职员（文人汉奸）"
traits:
  - 猥琐
  - 阴险
  - 记仇
  - 钻营
  - 无骨气
voiceNotes: "说话阴阳怪气，阿谀奉承中带着阴毒。得势时趾高气扬，失势时缩头缩脑。"
backstory: "日伪政权下的文人汉奸，与瑞丰、冠晓荷同属汉奸阵营。因牌局纠纷与瑞丰结怨，被瑞丰殴打后怀恨在心，成为汉奸内讧中的一员。"
