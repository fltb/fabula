    - dimensionId: notes
      scope: global
      value: "David first sees Dora Spenlow at the home of his employer, Mr Spenlow,
        and falls instantly and hopelessly in love. Dora is a 'child-wife' —
        beautiful, playful, impractical, devoted to her lapdog Jip. She embodies
        everything youthful and charming, and David's love for her is the
        passionate, undisciplined love of first youth. Their courtship is
        conducted in secret (Mr Spenlow disapproves), and they marry after a
        period of separation following Mr Spenlow's sudden death. The marriage
        is happy but strained: Dora cannot manage a household, has no head for
        practical matters, and remains childlike. David tries to 'form her mind'
        and fails. She falls ill, miscarries, and dies slowly, tenderly — her
        last act being to ask Agnes to take her place. David's love for Dora is
        genuine but immature; it burns bright and ends in grief, teaching him
        the difference between love and compatibility."
