sceneBrief: 刘姥姥是一个久经世代的老寡妇，靠女婿狗儿度日。因年关将近家中吃食不继，刘姥姥想起狗儿祖上曾与金陵王家连过宗，王家之女王夫人现是荣国府二房太太。于是刘姥姥带着外孙板儿天不亮便进城，来到荣国府角门前。她先找到周瑞家的（周瑞之妻）求见。周瑞家的念及旧日情分又想在刘姥姥面前显弄体面，便带她先见了平儿——凤姐贴身丫鬟。平儿见刘姥姥朴实可怜便去回禀凤姐。刘姥姥等候时只闻满屋香气、陈设耀眼争光，浑身不自在。凤姐召见，刘姥姥在地下拜了数拜。凤姐满面春风问好，一面让刘姥姥吃饭。饭后凤姐先说了贾府大有大的艰难去处——但终究给了二十两银子和一吊钱的车马费，说'暂且给这孩子做件冬衣罢'。刘姥姥千恩万谢而去。
