styleGuidance:
  tone: 从四婶的不耐烦→祥林嫂消失的真空→'我'的冷淡叙述→祝福大典的盛大与荒谬。最终段需要写出巨大的反讽——祥林嫂的尸体正不知躺在哪里，而整个鲁镇正在醉醺醺地接受天地的祝福。
  targetWordCount: 1800
  scenePacing: 逐出过程的简短交代（祥林嫂被悄然打发走）→沦为乞丐的空白期（'我'不知道她怎么变成乞丐的）→E0的河边相遇在此重新浮现→死亡的简短确认→祝福的盛大终场。时间线从倒叙回到框架现在，形成环形叙事。
  characterVoice:
    narrator: 最后一段的语气表面平静、甚至'懒散而且舒适'，实质上是最大的反讽——他在恭喜发财的爆竹声中，用文学的笔将祥林嫂重新埋葬。
    avoid: 不要用任何煽情的语言描写祥林嫂的死亡——她的死需要和叙述的冷漠形成对比。
