sceneBrief: 宝玉挨打后卧病在床，心中最放不下的是黛玉。他想让晴雯去看看黛玉，又恐袭人多心，便使了个调虎离山之计——支开袭人去借书。晴雯来后，宝玉取了两条半旧的绢帕交给她，让她送去潇湘馆。晴雯不解——送旧帕子未免太奇怪了。宝玉笑道"你放心，她自然明白"。黛玉收到旧帕后，初时一怔，继而细细思忖——忽而大悟：这旧帕子正是宝玉"令她私相传递"之意。她不禁五内沸然，由不得余意缠绵，命掌灯铺纸，研墨蘸笔，在三方帕上题下绝句三首。其一："眼空蓄泪泪空垂，暗洒闲抛却为谁？尺幅鲛绡劳解赠，叫人焉得不伤悲！"其二："抛珠滚玉只偷潸，镇日无心镇日闲。枕上袖边难拂拭，任他点点与斑斑。"其三："彩线难收面上珠，湘江旧迹已模糊。窗前亦有千竿竹，不识香痕渍也无。"题完后只觉浑身火热，面上作烧——走至镜前，腮上通红，真合压倒桃花——却不知病由此萌。
