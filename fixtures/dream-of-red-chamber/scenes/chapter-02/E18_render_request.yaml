sceneBrief: 阳春三月，大观园中百花盛开。宝玉在沁芳闸桥边桃花树下读《西厢记》，桃花落满书页，他抖花入池。恰逢黛玉来葬花——肩担花锄、手挂花囊。见宝玉读的是《会真记》，也要看。宝玉用书中词句打趣——'我就是个'多愁多病身'，你就是那'倾国倾城貌''。黛玉怒斥他拿淫词欺负人，宝玉慌忙赔罪。黛玉嗤地一笑，回了一句'呸，原来是个银样镴枪头'。两人共读入神。黛玉归途路过梨香院墙外，听见戏班演习《牡丹亭》——'原来姹紫嫣红开遍，似这般都付与断井颓垣'——不觉心动神摇、如醉如痴，蹲身坐于山石上细嚼曲中滋味，眼中滚下泪来。
styleGuidance: {"tone":"春日明媚中透出惘然——甜蜜、羞涩、惆怅、情思萌动的复合情绪","characterVoice":{"jiabaoyu":"用戏文表白是勇敢也是冒失——他说出'多愁多病身'和'倾国倾城貌'时不是调戏，是真情的泄露。被黛玉斥责后立刻慌了手脚——他在真挚情感面前是笨拙的。","lindaiyu":"表面怒斥宝玉用淫词欺负她，实则已将戏文记在心底。她回宝玉的'银样镴枪头'说明她也在看同一本书——而且同样入了迷。她在梨香院墙外听曲时的反应——'如醉如痴，站立不住'——是她情感到达巅峰的瞬间。那是文字、音乐、情感的三重共振。"},"scenePacing":"宝玉读西厢→黛玉葬花来→共读西厢→宝玉戏语→黛玉嗔怒→赔礼和解→共读共鸣→归途闻曲→牡丹亭动心→心痛神痴泪下","atmosphere":"大观园春日——桃花落红成阵、春风拂面、溪水潺潺。沁芳闸桥边：宝玉在桃花树下读禁书、花瓣落满书页。黛玉葬花而来，肩上花锄系着锦囊、手里是花帚——她是春天的诗人也是春天的悼亡者。","targetWordCount":1200}
