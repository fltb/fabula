id: david_copperfield
name: "David Copperfield"
type: protagonist
archetype: bildungsroman_hero
role: supporting
description: "David Copperfield is the narrator and protagonist of the novel. Born at Blunderstone Rookery on a Friday at midnight, he is a posthumous child whose father died six months before his birth. He grows from a sensitive, observant boy into a mature novelist and family man. His character is defined by his emotional sensitivity, his strong moral conscience, his capacity for deep attachment, and his gradual acquisition of self-knowledge. He experiences the full range of Victorian social positions — from cherished only child to abused stepson, from child labourer to gentleman's apprentice, from adoring husband to bereaved widower, and finally to successful author and happy husband. His 'undisciplined heart' leads him into infatuation with Dora Spenlow before he learns to recognise the true worth of Agnes Wickfield. He is called by several names at different stages of his life: Davy (by his mother and Peggotty), Trotwood (by Aunt Betsey), Trot (by Agnes and others), Daisy (by Steerforth, mockingly), and Master Copperfield (formally)."
appearance: "As a child: small, fair-haired, sensitive-looking, often in mourning clothes. As a young man: slight build, thoughtful expression, earnest manner. In maturity: a composed, successful gentleman with a novelist's observant eye. Peggotty says he looks like his mother and has her 'fine, bright, pretty eyes.'"
