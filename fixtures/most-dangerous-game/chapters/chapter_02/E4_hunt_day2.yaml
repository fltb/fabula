event: E4
title: Death Swamp and the Knife Trap
narrativeOrder: 5
sceneType: linear
storyTime: day_3_dusk
pov:
  character: rainsford
  type: third_person_limited
sceneBrief: "Rainsford's foot sinks into the treacherous ooze of Death Swamp —
  quicksand that sucks at him like a living thing. He wrenches it free and,
  inspired by the soft earth, begins to dig. He has dug foxholes under fire in
  France, but this is different — this is a pit to kill. He digs until it is
  above his shoulders, cuts hard saplings and sharpens them to fine points like
  fangs, and plants them in the pit floor. He covers the mouth with a carpet of
  weeds and branches. Crouching behind a lightning-charred stump, he waits.
  Zaroff approaches with unusual swiftness. The pit cover gives way — but it is
  not Zaroff who falls in. It is Lazarus, Zaroff's finest hound, impaled on the
  stakes. Zaroff calls out his congratulations, then announces he will return
  with the whole pack. At daybreak, Rainsford is awakened by the baying of
  hounds — the whole pack is on his trail. Fleeing through the jungle, he
  remembers a native trick from Uganda: bending a springy sapling, lashing his
  hunting knife to it with wild grapevine, blade pointing down the trail. He
  releases the tension and runs. The baying grows closer, then stops abruptly.
  Rainsford climbs a tree and looks back. General Zaroff still stands — but Ivan
  lies dead, the knife having found his heart. Rainsford is now unarmed, and the
  hounds pick up the cry again."
