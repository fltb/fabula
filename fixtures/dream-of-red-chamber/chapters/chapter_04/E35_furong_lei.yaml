  - thread: T2
    advancement: "黛玉改词——'茜纱窗下，我本无缘'——无意中点破了宝黛爱情的无缘结局。芙蓉诔明祭晴雯，暗谶黛玉，木石前盟的命运在此以文学的形式提前宣告。"
    progressAfter: 0.93
    progressTotal: 1.0
  - thread: T4
    advancement: "芙蓉诔不仅是晴雯的挽歌，也是金陵十二钗的共同悼词——'艳质将亡，兰膏正芫'、'自为红绡帐里，公子情深；始信黄土垄中，女儿命薄'——每一句都可作众钗命运的注脚。"
    progressAfter: 0.92
    progressTotal: 1.0
narrativeChecklist:
  items:
    - dimension: "骈体文采"
      description: "《芙蓉女儿诔》是全书最长的韵文之一，其骈俪对偶、用典之精、悲愤之切，须以高度风格化的骈体中文呈现。"
      required: true
    - dimension: "象征双关"
      description: "芙蓉的象征——晴雯为芙蓉花神，黛玉也是芙蓉（木芙蓉）——玉蓉诔明祭晴雯暗诔黛玉，这一层双关必须在叙述中揭示。"
      required: true
    - dimension: "黛玉改词"
      description: "黛玉为宝玉改'红绡帐里'为'茜纱窗下'是全书最精妙的自我谶语——她的诗才和命运同时浓缩在这一改之中。"
      required: true
