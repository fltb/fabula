styleGuidance: "Drawing-room horror. The dinner must feel opulent and civilized — the finest linen, crystal, silver, china, perfectly cooked food — while Zaroff calmly describes mass murder. The mounted heads on the walls take on new meaning. The hounds through the window are a glimpse of hell. Zaroff's ultimatum is delivered with perfect politeness. End with the château gates clanging shut behind Rainsford."
narrativeContent:
  opening: "The dining hall was a cathedral of death. Lions, tigers, elephants, moose, bears — their glass-eyed heads stared down from every wall, trophies of a lifetime of slaughter. Rainsford sat at the vast refectory table, eating borsch from a silver spoon, while his host, immaculate in evening clothes, smiled with red lips and pointed teeth.\n\n'I have but one passion in my life, Mr. Rainsford,' said General Zaroff, 'and it is the hunt.'\n\nHe refilled Rainsford's glass with a venerable port, and his black eyes glittered in the candlelight. 'I have invented a new sensation. A new animal to hunt. The most dangerous game of all.'\n\nRainsford set down his glass. 'What game?'\n\nZaroff's smile widened. 'It must have courage, cunning, and above all, it must be able to reason.'\n\nA pause. The candles flickered. The dead animals watched.\n\n'But you can't mean——' Rainsford gasped.\n\n'And why not?' said General Zaroff.\n\nLater, from the window, Zaroff showed him the kennels — a dozen enormous black shapes that prowled and growled in the darkness below. 'My best friends in the world,' said Zaroff. 'Tonight we will hunt together, you and I. But first — you must choose.'"
