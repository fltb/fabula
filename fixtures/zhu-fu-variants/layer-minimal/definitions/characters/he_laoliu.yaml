id: he_laoliu
name: "贺老六"
type: mountain_hunter_farmer
role: supporting
description: "贺老六是贺家坳的一个猎户兼农人，强壮有力，能干活，有自己的房子，上头没有婆婆。他是祥林嫂被婆婆以八十千卖给的对象——换句话说，他也是这个买卖婚姻的一部分。但命运让他成为祥林嫂生命中唯一短暂的光亮：他没有虐待她，靠力气养家，她年底生下儿子阿毛。然而他只与祥林嫂共同生活了大约两年便死了——染上伤寒，病好了又吃了一碗冷饭，复发而死。他是祥林嫂两个亡夫中的一个，在来世的地狱里，他将和前夫祥林争夺她的灵魂。"
appearance: "一个山里人的健壮体格，臂膀有力，脸被日晒风吹得黝黑——典型的贫苦山区农民兼猎户的外形。文中没有具体的面容描写。"
