    narrativeHint: "捐门槛之后她以为自己赎了罪——'神气很舒畅，眼光也分外有神'。但冬至祭祀时四婶的喝止——'你放着罢，祥林嫂！'——揭示了一个残酷真相：在民间信仰中，捐门槛可以赎来世的罪，但挡不住今世社会的排斥。仪式的不洁是由人决定的，不是由神决定的。"
    confidence: 1.0
