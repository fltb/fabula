sceneBrief: 林黛玉辞别父亲林如海，随贾雨村进京投奔外祖母贾母。初入荣国府，黛玉步步留心——府门巍峨、仆从肃然、气派非凡。她先拜见贾母，祖孙相拥大哭。随后依次拜见大舅母邢夫人、二舅母王夫人、李纨与迎春、探春、惜春三姊妹。众人见黛玉举止不俗而体弱怯不胜衣，问及所服何药，黛玉答以人参养荣丸。贾母怜其孤弱，拨紫鹃服侍，安排住于碧纱橱内。正谈及黛玉之母贾敏生前事，忽听后院传来一阵笑声，有人朗声道：'我来迟了，不曾迎接远客！'——凤姐到了。
