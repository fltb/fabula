injected:
  - entityId: "E3"
    attribute: "event"
    expectedValidator: "causality"
    expectedSeverity: "error"
    description: "E3 event deleted from the DAG — E2 postconditions have no downstream consumer, E4 preconditions are unsatisfied."
  - entityId: "E4"
    attribute: "preconditions"
    expectedValidator: "reachability"
    expectedSeverity: "warning"
    description: "E3 is deleted so E3's postconditions (xianglins_wife.marital_status = widowed_twice, has_ah_mao = true) are absent — E4's preconditions that depend on these values are unreachable."
  - entityId: "E2"
    attribute: "preconditions"
    expectedValidator: "reachability"
    expectedSeverity: "warning"
    description: "E2's postcondition (xianglins_wife.location = fourth_master_lu_house) has no downstream consumer because E3 was the event that consumed it. E2's precondition depends on now-deleted facts."
