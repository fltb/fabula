event: E20
title: 王熙凤正言弹妒意 林黛玉俏语谑娇音
narrativeOrder: 20
sceneType: linear
pov:
  character: narrator_omniscient
  type: omniscient
sceneBrief: 李嬷嬷又至宝玉房中，拄拐大骂袭人装狐媚子哄宝玉不理她们老货。凤姐闻声赶来，一面笑劝一面拉李嬷嬷去吃酒，以两句巧语将李嬷嬷拉走散了火气。宝钗黛玉在旁看凤姐劝人手段，暗叹其面面俱到。晚间宝玉为麝月篦头，被晴雯撞见以冷语讥讽，一时小女儿口角。贾环在薛姨妈处与莺儿掷骰子耍赖哭闹，被宝钗喝住。宝玉以"君子不为己甚"劝之，反被贾环顶撞回府。赵姨娘骂贾环"没脸面的下流东西"，被凤姐隔窗听见，以"他现是主子"训诫赵姨娘，又给了贾环钱去玩。尾声史湘云来府，宝玉黛玉正一处玩，闻湘云到忙起身。黛玉笑湘云咬舌"爱哥哥"之语，湘云反讥黛玉将来嫁了"林姐夫"也会咬舌，三人笑闹一团。
