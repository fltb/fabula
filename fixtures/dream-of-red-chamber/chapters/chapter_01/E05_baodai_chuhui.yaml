authorNotes:
  - "要求'这个妹妹我曾见过的'与摔玉对白入文。宝玉初见黛玉的原著对白——'这个妹妹我曾见过的''虽然未曾见过他，然我看着面善，心里倒像是远别重逢的一般'——以及摔玉时的'什么罕物！连人之高低不择，还说通灵不通灵呢！我也不要这劳什子了！'须以原文呈现。"
  - "宝玉为黛玉取字'颦颦'是二人关系中一个重要仪式——需在叙述中呈现取字的缘由和两人的互动氛围。"
