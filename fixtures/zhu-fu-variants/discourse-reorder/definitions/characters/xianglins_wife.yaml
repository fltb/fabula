voiceNotes: "初到鲁镇时沉默寡言，只是不停地做活。丧子后反复讲述阿毛被狼叼走的故事——'我真傻，真的'是她的标志句，全镇人都能背诵。被拒绝触碰祭祀物品后变得呆滞，不再开口，只偶尔自言自语。她的语言从叙述型（讲阿毛故事）退化到零碎的自语，最终完全沉默。"
backstory: "她是卫家山人，家里穷，年纪很小的时候就嫁给了比她小十岁的祥林。祥林是个打柴为生的樵夫，婆婆精明强干——一个严厉的当家女人。祥林在春天死去后，她成了寡妇。婆婆打算把她卖掉换钱给第二个儿子娶媳妇，她便从婆家逃了出来，经邻居卫老婆子介绍到鲁镇鲁四老爷家做帮工。她在鲁家工作了三四个月，因勤快被四婶看重，但她的过去被婆婆发现——婆婆带人将她绑走，以八十千的价钱卖给了贺家坳的猎户贺老六。她被捆着塞进花轿，在拜堂时一头撞在香案角上，额头上留下永久的伤疤。然而命运短暂垂青——贺老六是个力气体面、能干活的男人，有自己的房子，上头没有婆婆。年底她生下儿子阿毛，母子都养得胖胖的。但好景不长，贺老六染上伤寒，病刚好吃了冷饭复发而死；阿毛在春天独自坐在门口剥豆时被狼叼走，找到时五脏已被吃空。大伯来收了房子、赶她出门。她再次回到鲁家，但此时她已被视为'败坏风俗'的人。柳妈告诉她来世要被锯成两半分给两个死鬼男人，她恐惧之下用了近一年的工钱捐了土地庙的门槛，以为从此赎了罪。但冬至祭祀时四婶一句'你放着罢，祥林嫂！'彻底击碎了她——连捐了门槛也洗不清她的'污秽'。此后她精神崩溃，记性衰退，连淘米也忘记，最终被赶出鲁家，沦为乞丐。"
knownSecrets:
  - "她曾从婆家逃跑，这被视为不守妇道"
  - "她是被绑着、塞进花轿强行嫁给贺老六的——在拜堂时曾以头撞桌角自杀未遂"
  - "她捐门槛的事鲁四老爷和四婶可能不完全知情，是她私下进行的"
