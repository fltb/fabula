sceneBrief: 小崔拉了一个日本兵，到了背静处那兵不给钱就想跑。小崔火冒三丈，追上去把那兵打倒在地——他早就想打日本人了！可是打了几拳之后，那兵突然用中国话告饶，原来是个东北人，从小受日本教育长大的。小崔愣住了，心里说不出的恶心。他把这事告诉了瑞宣，瑞宣叹道：老一辈的东北人永远是中国人，但在日本教育下长大的孩子已经变了。小崔问：要是北平老让日本人占着，过几年咱们的孩子也会变吗？瑞宣听了浑身发冷。
