ruleId: patriarchal_family_order
name: 四世同堂的宗法家庭秩序
typeId: constraint
initialEpochId: patriarchal_family_order:epoch-1
initialSpecificationId: patriarchal_family_order:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: patriarchal_family_order:exception:1
    status: active
    constraintIds:
      - patriarchal_family_order:constraint:1
      - patriarchal_family_order:constraint:2
      - patriarchal_family_order:constraint:3
      - patriarchal_family_order:constraint:4
      - patriarchal_family_order:constraint:5
    scopeBindings: {}
    condition:
      type: expression
      expression: 瑞全离家出走的决定违背了祁老人的意愿，但最终被容忍
    effect:
      type: exempt
  - exceptionId: patriarchal_family_order:exception:2
    status: active
    constraintIds:
      - patriarchal_family_order:constraint:1
      - patriarchal_family_order:constraint:2
      - patriarchal_family_order:constraint:3
      - patriarchal_family_order:constraint:4
      - patriarchal_family_order:constraint:5
    scopeBindings: {}
    condition:
      type: expression
      expression: 瑞丰夫妇好吃懒做，但在饥荒中其寄生性暴露无遗
    effect:
      type: exempt
specifications:
  patriarchal_family_order:specification-1:
    statement: 祁家四世同堂——祁老人、祁天佑夫妇、瑞宣瑞丰瑞全三兄弟及其家眷——是北平传统大家庭的缩影。宗法秩序以年齿和辈分为轴心：祁老人是最高权威，但他的权威不是靠暴力而是靠年资和家族伦理维持的。长孙瑞宣在最中间的夹层——他是孙辈的长兄，又是家里的主要经济支柱，既受老人的管束又有管束弟弟的责任。瑞丰夫妇好吃懒做，理所当然地被全家养活。韵梅作为长孙媳妇，伺候老人、操持家务是她的天职，天经地义，没人觉得不公平。这个秩序不是法律条文而是日用不知的准则——它让每个人都有其位、各安其位。但当战争打破了这个封闭体系，这种温情脉脉的秩序也暴露出它的脆弱：传统尊老爱幼在饥饿面前不堪一击，家庭责任变成了套在瑞宣脖子上的枷锁。
    constraints:
      - constraintId: patriarchal_family_order:constraint:1
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.id='sr_qi' => entity.authority>=90 AND
            entity.final_decision_maker=true
      - constraintId: patriarchal_family_order:constraint:2
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.id='qi_ruixuan' => entity.financial_responsibility>=80 AND
            entity.status='teaching'
      - constraintId: patriarchal_family_order:constraint:3
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.id='yunmei' => entity.housework_burden>=90
      - constraintId: patriarchal_family_order:constraint:4
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.family='qi_family' AND entity.marital_status='已婚' =>
            entity.income_shares_with_family=true
      - constraintId: patriarchal_family_order:constraint:5
        kind: transition_constraint
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: event.id='famine_winter' => sr_qi.authority<50 OR
            qi_ruixuan.confidence_in_order<30
