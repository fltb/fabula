styleGuidance:
  tone: "先热闹谐趣，后转入沉思参悟"
  targetWordCount: 1200
  atmosphere: "贾母院内灯火辉煌、戏台上锣鼓丝竹。众人围坐看戏，说笑吃酒。宝玉拍膝叫好的兴奋，黛玉斜眼打趣的酸意，湘云不悦的静默——看似热闹，底下已是情丝千缕。"
  scenePacing: "宝钗点戏→宝玉嫌→宝钗念曲→宝玉称赏→湘云说像→宝玉使眼色→湘黛皆恼→宝玉写偈→黛玉改偈→释然"
  characterVoice:
    jiabaoyu: "从热闹中的兴奋到独处的沉思——写偈子时的宝玉与席上的判若两人。但被黛玉一问便'谁又参禅了'——他的悟终究还浅，一句玩笑话便回到了世间。"
    xuebaochai: "点戏时信口念出整支《寄生草》——她在文学和戏曲方面的修养令人刮目相看。她念曲文时那种低回婉转的语调，是她在众人面前少有的展露才华时刻。"
    lindaiyu: "两次打趣——先是'还没唱《山门》，你倒《妆疯》了'，后是'无立足境，是方干净'——她的机锋与智慧在此刻完全压倒了宝玉。她是唯一能从禅理上点醒宝玉的人。"
    shixiangyun: "心直口快，被宝玉的'使眼色'惹恼。'我也原不如你林妹妹'——湘云吃醋也是坦坦荡荡的，不高兴就是不高兴。"
