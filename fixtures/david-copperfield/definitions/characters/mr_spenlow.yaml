  - fond_of_dora
voiceNotes: "Measured, legalistic, and a little pompous — he speaks in rounded periods about the dignity of Doctors' Commons and the dangers of imprudent attachments. He is always mindful of appearances."
backstory: "A proctor of Doctors' Commons, widower and father of Dora Spenlow. He takes David as an articled clerk. When David falls in love with Dora, Mr Spenlow opposes the match; his sudden death from a riding accident leaves Dora an orphan and her fortune subject to Chancery proceedings."
