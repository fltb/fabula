sceneBrief: 秋雨淅沥之夜，黛玉在潇湘馆卧病。宝钗冒雨前来探望，二人促膝畅谈。宝钗见黛玉咳嗽不止，劝她少看杂书伤神，更以自家名义送来燕窝和冰糖给她养病。黛玉深感意外，坦言素日以为宝钗心里藏奸，此刻方知错怪了人。她含泪诉说寄人篱下的孤苦——'你如何比我？你又有母亲，又有哥哥，这里又有买卖地土，家里又仍旧有房有地……我是一无所有'。宝钗温言宽慰，说但凡有需用的只管找她。二人自此互剖金兰之语，结为知己。这场是钗黛关系从暗斗到真情的彻底转折。
