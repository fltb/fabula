description: "The first-person narrator of the novel — David Copperfield as a mature man, looking back over his own life and writing it down. His voice is warm, detailed, self-deprecating, and emotionally honest, moving between the child's feelings and the adult's understanding. He is the retrospective author of the whole story, and every event of the novel is filtered through his memory and his moral reckoning with his own 'undisciplined heart'."
