sceneBrief: 贾珍请凤姐协理宁国府丧事，宝玉将对牌强递凤姐。凤姐受命后迅速理出宁府五件弊端，于次日卯正二刻点卯分派，将一百余人分班定责，立下严格章程：卯正二刻点卯，巳正吃饭，午初刻领牌回事，戌初查夜。次日一切混乱骤除，秩序井然。五七正五日佛事繁忙，凤姐按时到灵前痛哭举哀，入场点卯时有一人迟到，凤姐冷笑训斥，同时从容处理荣府来人支取物件之事，挑出错账掷还帖子，尽显威重令行、条理分明之能。
