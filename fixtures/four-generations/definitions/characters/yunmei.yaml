description: 瑞宣的妻子，小顺儿和妞子的母亲。她在祁家被称为"小顺儿的妈"，是个典型的北平贤惠媳妇。她没受过多少教育，但有实际的生活智慧。她伺候老人、管教孩子、操持家务，在战乱中撑起祁家的日常生活。她不懂什么国家大事，却知道怎么省下一把米、怎么哄老人们开心。瑞宣的苦闷她不完全理解，但总是默默支持。
