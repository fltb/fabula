styleGuidance:
  tone: "sombre, pained, with sparks of dark comedy in the Micawber scenes"
  targetWordCount: 800
  atmosphere: "the deathly quiet of Blunderstone at the funeral; the stench and rot of the Thames-side wine warehouse; the chaotic warmth of the Micawber lodgings where everything is being pawned; the cold stone walls of the Marshalsea prison"
  scenePacing: "mother's funeral (slow, grieving) → warehouse routine (repetitive, grinding) → Micawber domesticity (comic, chaotic) → arrest (swift, inevitable)"
  characterVoice:
    narrator: "David's voice is at its most wounded here — the adult narrator still feels the shame of the warehouse as a fresh wound. The prose is stripped of humour, replaced by raw indignation and grief"
    micawber: "Oratorical, grandiose, endlessly optimistic — every sentence is a rhetorical performance. 'My dear Copperfield, something will turn up!' His speech is a comedy of misplaced confidence and elaborate vocabulary"
    murdstone: "Colder than ever — his words are business-like, efficient, devastating. He disposes of David as one would dispose of an inconvenient package"
