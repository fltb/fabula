styleGuidance:
  tone: "质朴、平淡、细微的温暖与持续的艰辛并存。不能用浪漫化的笔调写'田园幸福'——这是穷人的日子，每一天都需要用力气去挣。但厨房里的热气、阿毛的叫喊、贺老六扛柴回来的脚步声——这些细节之中有另一种叙述能量：生存的、具体的、不需要救赎的。"
  scenePacing: "以日常劳作节奏为轴——从早到晚的重复，四季节气的变化。中间插入卫老婆子的路过作为外部视角的映照。结尾回到祥林嫂在井边的画面，形成一个安静的、不煽情的定格。"
  characterVoice:
    xianglins_wife: "她的话少了很多——不需要讲述了。没有'我真傻，真的'的重复。沉默是她新的语言。但沉默不是创伤，是她不再需要向任何人解释自己。"
    avoid: "不要写任何类似'她终于幸福了'的句子——这不是幸福。这是一条没有被截断的日子。"
