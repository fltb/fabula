threadProgress:
  - thread: T1
    advancement: "David's journey from birth to maturity concludes — the orphaned boy, the abused child, the struggling youth, the successful writer, the loving husband and father. The entire bildungsroman resolves into the final image of David and Agnes journeying together along the road of life, the road that stretches out before them."
    progressAfter: 100
    progressTotal: 100
  - thread: T2
    advancement: "David finally recognises Agnes's true worth — the 'undisciplined heart' is disciplined at last. The love that was always present but unrecognised is now the central fact of his life. Agnes, who has loved him in patient silence through all his wanderings, is at last acknowledged as the guiding star of his existence."
    progressAfter: 100
    progressTotal: 100
  - thread: T3
    advancement: "Heep's defeat is complete and permanent — mentioned only in passing as a closed chapter. Justice has been done, and the worm has been crushed by the machinery of law and society."
    progressAfter: 100
    progressTotal: 100
  - thread: T4
    advancement: "Emily's redemption is confirmed — she and Mr Peggotty are contented in Australia, the past forgiven and the future secure. The 'fallen woman' has been restored to life and hope."
    progressAfter: 100
    progressTotal: 100
  - thread: T5
    advancement: "Micawber's triumph in Australia is complete — he has become a respected magistrate, his 'something will turn up' finally justified. The man who was always a failure in England found his element in a new world, proving that his talents were never the problem — only the circumstances."
    progressAfter: 100
    progressTotal: 100
