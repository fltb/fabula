description: "祥林嫂是个二十六七岁（初到鲁镇时）到四十岁上下（死时）的农村寡妇。她身材高大，手脚壮大，是能干的劳动力。她的面容在故事中经历了显著的退化：初到鲁镇时脸色青黄但两颊还有红色，是一个安分耐劳的模样；丧夫失子后两颊的血色消失，眼角带着泪痕，眼光也失去了精神；捐门槛被拒后脸色变成灰黑，眼睛窅陷，变成一个木偶人；最后沦为乞丐时头发全白，脸上瘦削不堪，黄中带黑，只有眼珠间或一轮表明她是个活物。她头上始终扎着白头绳（寡妇标识），穿着乌裙、蓝夹袄、月白背心。额角上有一块伤疤——那是被强迫改嫁时一头撞在香案角上留下的。"
appearance: "初到鲁镇：脸色青黄但两颊还是红的，手脚壮大，安分耐劳的农妇模样。丧子归来：两颊血色消失，眼角带泪痕，眼光无神。崩溃后：脸色灰黑，眼睛窅陷，神情呆滞，直是一个木偶人。沦为乞丐：头发全白，脸黄中带黑，瘦削不堪，木刻似的，只有眼珠间或一轮表明她还活着。始终穿乌裙、蓝夹袄、月白背心，头上扎白头绳。额角有撞香案留下的伤疤。"
