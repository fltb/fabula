chapter: 2
title: "The Hunt Begins"
summary: "Zaroff confronts Rainsford at luncheon the next day. When Rainsford demands to leave, Zaroff forces the choice: hunt or be turned over to Ivan. Rainsford chooses the hunt. Given a three-hour head start with only a hunting knife, he plunges into the jungle. He tries eluding Zaroff with fox-like dodges, climbs a tree to rest, and is discovered by Zaroff who toys with him. Rainsford builds a Malay man-catcher that wounds Zaroff. The hunt becomes a desperate flight through the island's deadly terrain."
intent: "Move from moral choice to pure survival. The chapter establishes the physical and psychological stakes of the game: Rainsford must use every trick he knows as a hunter to survive becoming the hunted. Zaroff's superiority is demonstrated — he tracks Rainsford through the night, finds him in the tree, and deliberately spares him for another day's sport."
plannedScenes: 4
