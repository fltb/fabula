chapter: 1
title: "第一章"
summary: "分支B：贺老六没有死于伤寒——他在祥林嫂的照顾下康复了。她不再被迫回到鲁镇，不再成为二次寡妇，不再遭受柳妈的地狱恐吓和捐门槛后仍被排斥的二次创伤。她的后半生在贺家坳度过，养育阿毛和他的弟妹，经历了漫长的平静——贫困但未被摧毁的平静。她最终老死在自己的床上，身边是家人。这是祥林嫂本来可能拥有的'正常'人生——但它需要的，仅仅是一个偶然。"
intent: "分支B探索了'如果贺老六没死'的平行叙事——目的不是提供'幸福结局'，而是揭示：在封建社会的四大绳索中，底层女性需要多少偶然的幸运才能勉强活到老。分支B中的祥林嫂仍然贫穷、无名、依附于丈夫——她的'熬出来了'本身就是对这个系统的控诉。"
plannedScenes: 7
