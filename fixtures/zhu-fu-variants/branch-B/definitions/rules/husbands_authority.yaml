ruleId: husbands_authority
name: 夫权 — 一女不事二夫的贞节观
typeId: constraint
initialEpochId: husbands_authority:epoch-1
initialSpecificationId: husbands_authority:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: husbands_authority:exception:1
    status: active
    constraintIds:
      - husbands_authority:constraint:1
      - husbands_authority:constraint:2
      - husbands_authority:constraint:3
    scopeBindings: {}
    condition:
      type: expression
      expression: 如果死了丈夫后仍有儿子，母以子贵，社会地位有所保全
    effect:
      type: exempt
specifications:
  husbands_authority:specification-1:
    statement: 女子一生只能侍奉一个丈夫。守寡是美德，改嫁是耻辱。祥林嫂因改嫁而被视为'败坏风俗'的人——即使她是在被绑、被卖的强迫下改嫁的。她的身份永远依附于丈夫：即使祥林已死、她已改嫁贺老六，她仍然被叫做'祥林嫂'（祥林的妻子）。死后她的身体需要在两个丈夫之间平分——生时没有自主权，死后也不得自主。
    constraints:
      - constraintId: husbands_authority:constraint:1
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.gender='女' AND entity.marital_status='widow' =>
            entity.identity.derived_from='deceased_husband'
      - constraintId: husbands_authority:constraint:2
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.gender='女' AND entity.marital_status='remarried' =>
            entity.social_label='immoral'
      - constraintId: husbands_authority:constraint:3
        kind: transition_constraint
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.gender='女' AND entity.marital_status='remarried_widow' =>
            entity.can_touch_ritual_items=false
