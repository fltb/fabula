types:
  character:
    typeId: character
    kind: character
    attributes:
      lifecycle:
        attributeId: lifecycle
        valueType: string
        requiredAt: introduction
        writePolicy: lifecycle_managed
        allowedLifecycleStates:
          - active
          - inactive
          - retired
        unsetAllowed: false
        semanticRole: lifecycle
      chose_hunt:
        attributeId: chose_hunt
        valueType: boolean
        requiredAt: never
        writePolicy: mutable
        unsetAllowed: true
      traits:
        attributeId: traits
        valueType: string_list
        requiredAt: never
        writePolicy: immutable
        unsetAllowed: true
    lifecyclePolicy:
      allowedTransitions:
        - - active
          - inactive
        - - active
          - retired
        - - inactive
          - active
        - - inactive
          - retired
    referenceCapabilities:
      defaultEligibility: live
    typedInvariants: []
