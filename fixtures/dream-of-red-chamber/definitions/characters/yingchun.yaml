voiceNotes: 言语温柔沉默，不争不抢。绰号"二木头"，被人欺负也不敢出声。被父亲许配孙绍祖时哭诉无助，言语间全是对命运的绝望。
backstory: 贾赦之女，贾琏同父异母的妹妹，荣国府二小姐。性格温柔懦弱，被人称为"二木头"。在抄检大观园时，她的丫鬟司棋被撵，她无力保护。后被父亲许配给孙绍祖，遭受家暴虐待，一年后便折磨而死。
