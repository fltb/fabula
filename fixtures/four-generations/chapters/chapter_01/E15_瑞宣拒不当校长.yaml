sceneBrief: 瑞丰当上科长后，跑来告诉瑞宣：学校的校长辞职了，他可以活动让瑞宣当校长。瑞宣一口拒绝。瑞丰急了，说大哥太固执："南京都丢了，你一个人有骨头又怎样？"瑞宣平静而坚定地回答：可以教书就教书，不可以教书就去卖落花生，但绝不给日本人做事。瑞丰认为大哥疯了，悻悻而去。瑞宣向祖父和母亲表明心迹：宁可饿死，也不做汉奸。祁老人和天佑太太虽不理解，但也只能支持。
