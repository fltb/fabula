id: liu_shifu
name: "刘棚匠"
type: patriotic_artisan
archetype: plain_man_of_backbone
role: supporting
description: "小羊圈胡同的棚匠（搭棚的手艺人），身强力壮，为人刚直。日本人占领北平后，冠晓荷为讨好日本人，请他出面在庆祝活动中耍狮子（舞狮）；刘师傅断然拒绝——他空有一身本事却不能去打日本鬼子，心中郁郁。他的拒绝是沦陷区普通市民骨气的写照。"
appearance: "结实的身板，结实的胳膊，白牙一闪一闪。收拾棚匠家什时动作利落有力。"
aliases:
  - "刘师傅"
  - "刘棚匠"
gender: male
age: "壮年"
profession: "棚匠（搭棚手艺人）"
traits:
  - 刚直
  - 爱国
  - 有骨气
  - 手艺好
  - 沉默寡言
voiceNotes: "话不多，但句句硬气。拒绝冠晓荷时干脆利落，不留情面；提起不能去打鬼子，语气里满是憋闷。"
backstory: "小羊圈胡同的棚匠，一身好手艺。北平沦陷后拒绝为日本人耍狮子，让冠晓荷碰了钉子，也让瑞宣看到了普通市民的血性。"
