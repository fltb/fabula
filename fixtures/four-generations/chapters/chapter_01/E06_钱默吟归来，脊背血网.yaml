sceneBrief: 金三爷和瑞宣把昏迷的钱默吟抬进屋中，发现他背上的衣服已与血肉粘在一起。那些血道子有的是黑色的旧疤，有的是鲜红的伤口，有的还流着黄水——日本人的毒刑在他背上织成了一张血网。医生来了却百般刁难，瑞宣怒斥庸医。金三爷气不过，一拳打倒冠晓荷——他终于替亲家出了一口气。钱默吟在昏迷中反复说："打！打！我没的说！"
