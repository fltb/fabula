ruleId: religious_authority
name: 神权 — 民间宗教的精神控制
typeId: constraint
initialEpochId: religious_authority:epoch-1
initialSpecificationId: religious_authority:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: religious_authority:exception:1
    status: active
    constraintIds:
      - religious_authority:constraint:1
      - religious_authority:constraint:2
    scopeBindings: {}
    condition:
      type: expression
      expression: 如果寺庙不收，不能捐门槛
    effect:
      type: exempt
specifications:
  religious_authority:specification-1:
    statement: 民间佛教信仰体系通过'来世惩罚'对活人进行精神控制。改嫁的女子死后在阴司将被两个死鬼丈夫争夺，阎罗王会把她锯成两半分给他们。捐门槛可以赎罪，但赎罪的效力取决于活人的认可——如果地上的人仍视你为不洁，捐了门槛也是白捐。
    constraints:
      - constraintId: religious_authority:constraint:1
        kind: state_invariant
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.gender='女' AND entity.marital_status='remarried_widow' =>
            entity.afterlife_punishment='sawn_in_half'
      - constraintId: religious_authority:constraint:2
        kind: transition_constraint
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.has_donated_threshold=true =>
            entity.ritual_purity_status!='clean' IF
            entity.social_acceptance='rejected'
