description: "柳妈是一个在鲁家帮忙做年终杂活的老妇人，被称为'善女人'——吃素、不杀生，是民间佛教的信徒。她性格开朗，爱说话，是个典型的农村老太太。她无意中成为摧毁祥林嫂精神的关键人物：她以关心的口吻告诉祥林嫂，来世到了阴司，两个死鬼丈夫会争夺她，阎罗大王只好把她锯成两半分给他们。她建议祥林嫂去土地庙捐一条门槛作为替身，给千人踏万人跨，以此赎清一世罪名。柳妈不是恶意的——她是真的相信自己在帮助祥林嫂，她自己也是这套信仰体系的受害者。"
appearance: "一个上了年纪的鲁镇老妇人，穿着素净。作为'善女人'，她的衣着可能带着信佛的标志（如素色衣服、念珠等）。面容是农村老太太的朴实模样，但絮叨起来很有活力。"
