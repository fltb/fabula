chapter: 1
title: "David Copperfield"
summary: "The novel traces the life of David Copperfield from his birth at Blunderstone Rookery in Suffolk through his childhood under the Murdstones' cruelty, his happy school days at Salem House and Canterbury, his rise to success as a novelist, and his two great loves — Dora Spenlow and Agnes Wickfield. Along the way he encounters a vivid cast of characters: the steadfast Peggotty, the tragic Little Emily, the villainous Uriah Heep, the ever-optimistic Mr Micawber, and his eccentric aunt Betsey Trotwood. The story moves from Blunderstone to Yarmouth, Salem House to London, Dover to Canterbury, and back to London, following David's moral and emotional education. The 20 selected scenes cover David's birth, his fall into disgrace under Murdstone, his friendships at Salem House, his mother's death and his abandonment to child labour, his flight to Dover and adoption by Aunt Betsey, his schooling in Canterbury (where he meets Agnes and Uriah Heep), his entry into London society and his infatuation with Dora, his marriage and Dora's death, the exposure of Heep's frauds, the tempest that kills Ham and Steerforth, David's period of mourning abroad, Emily's redemption and emigration, and the final retrospect where David surveys his completed life at Agnes's side."
intent: "Model the complete bildungsroman arc of David Copperfield as a first-person retrospective narrative. The 20 scenes span from birth to maturity, testing the system's ability to handle temporal progression (day-based timeAnchors from davids_birth through return_to_england), consistent first-person POV with the narrator as protagonist, multi-thread weaving (bildungsroman, romance, villain scheme, seduction tragedy, comic relief), and a large character ensemble (14+ characters) with evolving relationships and states. The long temporal span (years between events) exercises the snapshotInterval and state management systems."
