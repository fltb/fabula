styleGuidance: "Atmospheric, languid opening. Build the Caribbean night as a tangible presence — thick, warm, black. The dialogue should establish Rainsford's confidence and Whitney's unease. The gunshots arrive as an abrupt intrusion."
narrativeContent:
  opening: "The yacht slid through the Caribbean night like a ghost on water, its engine a muffled heartbeat beneath the deck. Rainsford leaned against the rail, the bowl of his brier pipe glowing and fading in the darkness, and watched the place where the island ought to be — a place that was only a denser patch of blackness against the black sky.\n\n'I rather think they understand one thing — fear,' Whitney was saying. 'The fear of pain and the fear of death.'\n\nRainsford laughed, a short, dismissive sound. 'Nonsense. This hot weather is making you soft, Whitney. Be a realist. The world is made up of two classes — the hunters and the huntees. Luckily, you and I are hunters.'\n\nHe did not see Whitney's troubled expression in the dark. He did not feel the chill that had crept into the air, or the way the crew had gone silent when the island's unseen bulk had passed somewhere off the starboard bow. He only heard, faint and far away, the sound he had been waiting for — three shots, spaced precisely, punching through the velvet night like a message from another world."
