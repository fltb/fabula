sceneBrief: 秦可卿殡仪队伍送至铁槛寺安灵，凤姐嫌铁槛寺不便，带了宝玉和秦钟住进附近的馒头庵（水月庵）。庵中老尼净虚趁机求凤姐办事——有一大户人家张财主的女儿金哥已许配守备之子，却被长安府太爷的小舅子李衙内看中，两家争聘打官司。净虚请凤姐以贾府权势出面摆平守备退亲。凤姐起初推托，经净虚激将——'虽说如此，只是太太知道，连我也不敢去的'——凤姐好胜心起，开价三千两银子。凤姐以贾琏名义写信给长安节度使云光，云光便压守备退婚。不料金哥是个多情烈女，闻退婚消息后自缢身亡；守备之子也投河殉情。凤姐坐享三千两，此后胆子更大，从此'所作所为，诸如此类，不可胜数'——这是凤姐手上沾上的第一条人命。
styleGuidance: {"tone":"冷峻、精于算计，结尾急转直下的悲剧","characterVoice":{"wangxifeng":"表面推辞实则精算——'我又不等着银钱使，也不做这样的事'——以退为进。被净虚一激立刻接话：'你是素日知道我的，从来不信什么阴司地狱报应的'——这句话是她整个人生哲学的注脚。","jingxu_nun":"老尼姑口齿伶俐，深谙人情世故。她以'太太知道'激将凤姐——她精准抓住了凤姐最大的软肋：好胜心。"},"scenePacing":"停灵铁槛寺→住进馒头庵→净虚求助→凤姐要价→双方议定→写信云光→金哥自缢→守备子投河→凤姐从容收银","atmosphere":"馒头庵本是停灵之所，却成了权钱交易的密谋地。老尼净虚的精明、凤姐的精算、最终两条年轻生命的消逝——佛寺之净与此事之污形成反讽。","targetWordCount":1200}
