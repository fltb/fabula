sceneBrief: 晴雯因抄检后被王夫人以'狐狸精'之名撵出大观园，病卧在表哥多浑虫家。宝玉偷偷出府探望，只见晴雯卧在芦席土炕上，瘦如枯柴，茶水俱无。晴雯又悲又愤——'我虽生得比别人好些，并没有私情勾引，怎么一口死咬定了我是个狐狸精？'她铰下两根葱管般的指甲，脱下贴身的旧红绫袄交给宝玉作念想，又让宝玉给自己倒茶——那茶竟是凉的，全无茶味。当夜晴雯含冤而终，临死前叫了一夜娘。宝玉悲痛欲绝，却无法留下她的遗体，更无力为她正名——这是全书最令人心碎的底层悲剧之一。
