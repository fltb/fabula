description: 甄士隐，姓甄名费，字士隐，姑苏阊门外乡宦。红楼梦第一回出场的关键人物，为全书"真事隐去"的谐音象征。因女儿英莲被拐、家宅被烧后顿悟，随跛足道人出家。
