threadProgress:
  - thread: T1
    advancement: 祥林嫂的生命轨迹至此完成：逃婚寡妇→勤快帮工→被卖改嫁→丧夫失子→再回鲁镇→捐门槛被拒→精神崩溃→沦为乞丐→冻死街头。她在除夕夜死去，第二天清晨祝福仪式的爆竹声照常响起——她的死亡没有在鲁镇的祝福中留下一丝痕迹。
    progressAfter: 100
    progressTotal: 100
  - thread: T2
    advancement: 祥林嫂在死前问'我'灵魂问题——这说明她直到生命最后一刻还在寻找答案。她死于不知道答案的恐惧中。而'我'的'说不清'——那个逃避的回答——在她死后再也无法收回。
    progressAfter: 100
    progressTotal: 100
  - thread: T3
    advancement: 从四婶的'倒不如那时不留她'到短工的'还不是穷死的'到四叔的'谬种'——每个人都在为她的死亡找理由，没有人觉得自己的行为与她的死亡有任何关联。鲁镇的社会良心在她死后完全闭合。
    progressAfter: 100
    progressTotal: 100
  - thread: T4
    advancement: 故事的结尾——'我'在祝福的爆竹声中感到懒散和舒适，天地圣众醉醺醺地赐福给鲁镇——这是全文最尖锐的讽刺：祝福仪式在为杀死祥林嫂的社会系统提供神圣的合法性。
    progressAfter: 100
    progressTotal: 100
