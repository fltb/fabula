voiceNotes: "第三人称全知叙事，穿插人物内心独白，冷静中带着对亡国奴相的痛切与对民族气节的敬意。"
backstory: "《四世同堂》的全知叙述声音，贯穿全书，观察并讲述北平小羊圈胡同在沦陷时期的故事。"
