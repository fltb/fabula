sceneBrief: 瑞全再也待不住了。他悄悄收拾了简单的行李，把书籍托付给大哥瑞宣，在一个清晨不辞而别。他吻了吻熟睡的小顺儿和妞子，看了一眼院中的枣树和老槐树，便头也不回地走出了小羊圈。瑞宣发现后追出去，只在胡同口看见弟弟的背影消失在晨雾中。瑞宣心中说不出的羡慕与惭愧——老三做到了他做不到的事。
