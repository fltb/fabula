event: E3
title: 林黛玉抛父进京都
narrativeOrder: 3
sceneType: linear
pov:
  character: narrator_omniscient
  type: omniscient
sceneBrief: 黛玉辞别父亲林如海，随贾雨村进京投奔外祖母。至荣国府，黛玉经垂花门入内，见贾母迎出，二人抱头痛哭。贾母引黛玉见邢夫人、王夫人、李纨及迎春探春惜春三姐妹。王夫人告之宝玉乃孽根祸胎，嘱黛玉不必睬他。凤姐人未至而笑先闻，携黛玉手上下打量，夸赞其标致如嫡亲孙女，又拭泪哀叹姑母早逝，旋即转悲为喜。宝玉出场，细问黛玉有无玉，得知无玉后摘下通灵宝玉狠命摔去，贾母急劝哄方休。宝玉为黛玉取字"颦颦"。
