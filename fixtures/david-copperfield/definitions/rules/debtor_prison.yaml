ruleId: debtor_prison
name: Debtors' Prison System
typeId: constraint
initialEpochId: debtor_prison:epoch-1
initialSpecificationId: debtor_prison:specification-1
initialActivation: enabled
initialEffectiveness: full
scopeBindings: {}
exceptions:
  - exceptionId: debtor_prison:exception:1
    status: active
    constraintIds:
      - debtor_prison:constraint:1
      - debtor_prison:constraint:2
      - debtor_prison:constraint:3
    scopeBindings: {}
    condition:
      type: expression
      expression: A debtor who can pay for 'the rules' (the liberty of the rules) may
        leave the prison during the day to work
    effect:
      type: exempt
  - exceptionId: debtor_prison:exception:2
    status: active
    constraintIds:
      - debtor_prison:constraint:1
      - debtor_prison:constraint:2
      - debtor_prison:constraint:3
    scopeBindings: {}
    condition:
      type: expression
      expression: A friend or relative may pay the debt and secure release
    effect:
      type: exempt
specifications:
  debtor_prison:specification-1:
    statement: Under Victorian English law, a person unable to pay their debts could
      be imprisoned indefinitely at the pleasure of their creditors. The debtor
      was confined to a prison — most famously the Marshalsea, the Fleet, and
      the King's Bench — until the debt was paid, a friend paid it, or the
      creditor relented. Imprisonment did not discharge the debt; it merely
      prevented the debtor from earning money to repay it, creating a trap from
      which few escaped. Debtors' prisons were classified; those who could
      afford 'the rules' (a fee for limited liberty outside the walls) had some
      freedom. Families often lived with the debtor inside the prison, sharing
      his confinement. The system was widely condemned but persisted until the
      Debtors Act of 1869. The threat of debtors' prison hung over the lives of
      the Victorian poor and middle class alike — a single financial reverse
      could destroy a family.
    constraints:
      - constraintId: debtor_prison:constraint:1
        kind: transition_constraint
        enforcement: hard
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.debt>0 AND entity.can_pay=false => entity.imprisoned=true AND
            entity.release_condition='debt_paid_or_forgiven'
      - constraintId: debtor_prison:constraint:2
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.imprisoned_for_debt=true => entity.can_earn_income=false
      - constraintId: debtor_prison:constraint:3
        kind: state_invariant
        enforcement: audit
        applicableEffectiveness:
          - full
          - limited
          - nullified
        scope: {}
        predicate:
          version: "1"
          type: simple
          expression: entity.imprisoned_for_debt=true =>
            entity.family_may_cohabit_prison=true AND
            entity.dependents.quality_of_life=degraded
