info:
  currentEra: 一九三七年抗日战争初期，北平沦陷时期
  politicalSituation: 七七卢沟桥事变后，日军占领北平，成立伪政权。北平市民在日伪统治下生活艰难，物资匮乏，人心惶惶。汉奸势力抬头，抗日志士转入地下。战争形势尚不明朗，上海、南京相继陷落，华北已成敌占区。
timeAnchors:
  - id: lugouqiao_incident
    at: day_0
    description: 一九三七年七月七日卢沟桥事变爆发。祁家正在筹划祁老人的七十五岁生日，北平城内开始人心浮动。
  - id: fall_of_beiping
    at: day_22
    description: 七月二十九日，北平沦陷。小羊圈胡同的人们第一次听到敌人的炮声，感到惶惑与苦闷。祁瑞全决定出走，奔赴国难。
  - id: qian_moyin_arrested
    at: day_45
    description: 冠晓荷向日本人告密，钱默吟被日本宪兵逮捕，钱家遭受搜查。这是小羊圈胡同第一次直面日本人的残暴。
  - id: mid_autumn_festival
    at: day_60
    description: 中秋前后，北平之秋依旧美丽，但人心已非。钱孟石在父亲被捕、弟弟殉国的双重打击下病逝，钱太太在送殡途中触棺身亡。钱家彻底破碎。
  - id: qian_moyin_returned
    at: day_75
    description: 钱默吟被日本宪兵释放，身受重伤，面目全非。他被金三爷背回家中，开始了漫长的康复。瑞宣日夜照看，从钱先生身上看到不屈的精神。
  - id: celebration_baoding
    at: day_90
    description: 保定陷落，日伪强迫学生游行庆祝。瑞宣因拒绝参加而陷入苦闷，瑞丰却积极领队。北平市民第一次公开向敌人屈服。
  - id: celebration_nanjing
    at: day_150
    description: 南京陷落消息传来，瑞宣痛哭。日伪大肆庆祝，汉奸们弹冠相庆。大赤包就任妓女检查所所长，瑞丰当上教育局庶务科科长，汉奸势力抬头。
  - id: fall_of_shanghai
    at: day_120
    description: 上海失守，北平人的最后希望受挫。孙七剃头时失手扔了剃刀，小崔与程长顺激烈争辩。北平的冬天更加寒冷。
  - id: spring_of_next_year
    at: day_270
    description: 一九三八年春，战争进入相持阶段。钱默吟伤愈后秘密从事抗日宣传，瑞宣在迷茫中找到方向，决定暗中帮助抗日工作。
  - id: famine_winter
    at: day_500
    description: 战争持续，北平物资极度匮乏，饥荒来临。祁家面临断粮危机，小羊圈胡同的底层市民在饥饿与寒冷中挣扎求生。
  - id: end_of_novel
    at: day_730
    description: 约两年后，瑞全秘密潜回北平执行任务。瑞宣终于与弟弟重逢，并在老三元启发下决心投入地下抗日工作。祁家四世同堂在战火中艰难延续。
threads:
  - threadId: T1
    name: 抗日救国
    description: 从瑞全出走、钱默吟被捕受刑、到钱先生伤愈后从事抗日宣传、瑞全秘密潜回北平。这条线索贯穿全书，展现北平市民在亡国之后从忍耐走向抵抗的觉醒过程。
    typeId: primary
    initialPhase: opening
    targetRevealChapter: 1
    initialProgress: "0.00"
  - threadId: T2
    name: 祁瑞宣的苦闷与觉醒
    description: 瑞宣是祁家的长孙，受过新式教育，既有传统的家庭责任，又有现代的国家意识。他在忠孝之间反复挣扎——想离家抗日又放不下老小，想保持气节又不得不为生计教书。他的苦闷代表了沦陷区知识分子的典型心态。
    typeId: primary
    initialPhase: opening
    targetRevealChapter: 1
    initialProgress: "0.00"
  - threadId: T3
    name: 钱家人的抗争
    description: 钱默吟本是饮酒赏菊的诗人，儿子仲石摔死一车日本兵后，他遭遇被捕、毒刑、家破人亡。出狱后他变成了另一个人——不再吟诗，而是以抗日宣传为己任。钱家的遭遇是全书最惨烈的悲剧，也是民族觉醒的缩影。
    typeId: sub
    initialPhase: opening
    targetRevealChapter: 1
    initialProgress: "0.00"
  - threadId: T4
    name: 汉奸丑态
    description: 冠晓荷、大赤包、蓝东阳、瑞丰是一群投机分子。他们在亡国之际趋炎附势，争权夺利。大赤包当上妓女检查所所长，瑞丰做了教育局科长，汉奸之间互相倾轧、丑态百出。他们的无耻与祁家的苦闷形成鲜明对照。
    typeId: sub
    initialPhase: opening
    targetRevealChapter: 1
    initialProgress: "0.00"
  - threadId: T5
    name: 小人物群像
    description: 小崔（车夫）、孙七（剃头匠）、程长顺（孤儿）、李四爷（杠夫头）、白巡长等底层市民，在亡国后各有各的苦难与选择。他们不懂什么大道理，却有着朴素的爱国心与正义感。小崔打了日本兵，刘棚匠拒绝为日本人耍狮子，展现了北平普通人的骨气。
    typeId: sub
    initialPhase: opening
    targetRevealChapter: 1
    initialProgress: "0.00"
worldFacts:
  - id: four_generations_qi
    value: 祁家是北平小羊圈胡同的老住户，祁老人白手起家置下了五号院的房产。四世同堂：祁老人（七十五岁）、祁天佑（布铺掌柜）、祁天佑太太、长孙瑞宣（中学教师）与媳妇韵梅及两个孩子（小顺儿、妞子）、二孙瑞丰夫妇、三孙瑞全（学生）。这是北平典型的旧式大家庭，以祁老人的传统观念为核心。
    description: 祁家的家庭结构——四世同堂，北平老式市民家庭的代表
  - id: xiaoyangquan_hutong
    value: 小羊圈胡同是北平西城一条不起眼的小巷，形状像葫芦——口小肚子大。胡同里住着五六户人家：五号祁家、三号冠家、六号小文夫妇与刘棚匠、钱家（一号）、李四爷（四号）等。胡同虽小，却浓缩了沦陷区北平的众生相。
    description: 小说主要舞台——小羊圈胡同的地理与住户
  - id: beiping_under_occupation
    value: 沦陷后的北平物资紧缺，煤、粮、布匹均被日军控制。城门时开时闭，市民出入受日军盘查。日伪强迫学生游街庆祝日军胜利，发放良民证。汉奸组织新民会、伪政府相继成立。北平从繁华古都变成一座死气沉沉的被占领城市。
    description: 日军占领下的北平日常生活的现实状况
  - id: beiping_culture_decay
    value: 北平的文化在太平年月孕育了温和、礼让、享乐的精神，但在亡国之际，这种文化也暴露出软弱和麻木的一面。瑞宣反复思考：喜爱和平是不是错误？文化太熟了就烂了。钱默吟从诗人变成战士，象征着文化必须浴火重生。
    description: 北平传统文化在战争中的两面性——既温和又软弱
  - id: hanjian_network
    value: 以冠晓荷、大赤包、蓝东阳、瑞丰为代表的汉奸群体，靠出卖同胞、巴结日本人换取权势。他们相互勾结又相互倾轧——蓝东阳威胁瑞丰、冠晓荷想利用金三爷、大赤包笼络李空山。汉奸们的丑态是旧中国官场腐败文化的延续。
    description: 汉奸之间的权力勾结与倾轧
  - id: hunger_and_cold
    value: 战争持续一年后，北平的物资供应已极度紧张。煤缺、粮缺、布缺。祁家买不到煤球，祁老人冻得睡不着觉。底层市民如小崔、孙七等人更是朝不保夕。饥饿与寒冷成为比枪炮更残酷的敌人，逼迫每个人做出选择。
    description: 沦陷区物资匮乏对普通市民的摧残
