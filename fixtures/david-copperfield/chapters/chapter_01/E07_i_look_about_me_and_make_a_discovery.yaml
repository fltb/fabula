    hint: "Rosa Dartle's scarred lip and her piercing, angry questions about Steerforth hint at a hidden history of injury — both physical and emotional — at Steerforth's hands. Her intensity is the first crack in David's idealised portrait of his friend."
    targetRevealChapter: 22
    thread: T4
  - id: doctors_commons
    hint: "The quaint, antiquated world of Doctors' Commons — with its proctors, advocates, and arcane procedures — becomes a symbolic setting for David's early adult life. It represents a genteel but rather stagnant profession, a holding pattern before the real dramas of life begin."
