id: kongkongdaoren
name: 空空道人
type: mythical
role: background
description: 空空道人，神话框架中的关键人物——一位经过大荒山无稽崖青埂峰的道人，见顽石上所记历世传奇，与石头一番辩论后抄录传世，将《石头记》传入人间。随后"因空见色，由色生情，传情入色，自色悟空"，遂改名为情僧，改《石头记》为《情僧录》。他是全书"空—色—情—空"哲学框架的化身。
appearance: 道人装扮，仙风道骨
aliases:
  - 情僧
gender: 无（出世之人）
age: 无
profession: 道人（后为僧）
traits:
  - 超然
  - 好问
  - 求道
initialState:
  location: 大荒山
  status: alive
  condition: mythical
backstory: 路经大荒山无稽崖青埂峰时，见一块大石上字迹分明、编述历历，乃无材补天之顽石所记下凡历劫之故事。道人从头至尾抄录回来，问世传奇。经历了"从空到色、从色到情、从情再悟到空"的完整哲学循环后，改名为情僧。他是全书"作者—叙述者—传者"链条中最外一环，也是虚构文本进入现实世界的桥梁——《石头记》→《情僧录》→《红楼梦》→《风月宝鉴》→《金陵十二钗》五名同书的起点。
knownSecrets:
  - 顽石所记故事全部内容
  - 与石头关于"理治之书"与"适趣闲文"的价值辩论
