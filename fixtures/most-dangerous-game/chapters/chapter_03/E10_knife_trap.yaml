styleGuidance: "Frantic, desperate. The knife trap should feel like throwing the last card in a losing hand. The moment Ivan dies is a split-second triumph swallowed by the continuing baying of the hounds."
narrativeContent:
  opening: "The sound that found Rainsford at daybreak was the most terrible thing he had ever heard — the deep, throbbing bay of a pack of hounds on a fresh scent, faint in the distance but growing nearer with every beat of his heart. Zaroff had kept his promise. The whole pack was coming.\n\nRainsford ran, but his mind worked with a cold clarity he had not known he possessed. He found a springy young sapling and bent it back, lashing his hunting knife to its tip with a strip of wild grapevine, blade pointing down the trail. A Ugandan trick. A desperate, final throw of the dice.\n\nHe released the sapling and ran. Behind him, the baying grew louder, nearer, until — silence.\n\nHe shinned up a tree and looked back. General Zaroff stood alone in the shallow valley, staring down at the huge shape that lay crumpled on the jungle floor. Ivan. The knife, driven by the recoil of the springing tree, had not wholly failed."
