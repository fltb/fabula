narrativeContent:
  opening: "Rainsford's hands shook as he worked, but his mind was clear — clearer than it had been since he fell into the sea. He had played the fox. Now he would play the cat. The dead tree leaned against its living neighbor at a precarious angle, and he saw in an instant how the physics of it could be made to serve him. He drove his knife into the wood, cutting, shaping, testing. The Malay man-catcher was a trick he had learned in another life, on another continent, when hunting was a game and not a matter of survival. Now it was his only weapon.\n\nHe finished and crawled behind a fallen log a hundred feet away. He did not have to wait long. The cat was coming again to play with the mouse."
