authorNotes:
  - "宝玉挨打是全书暴力描写的顶点——板子落在宝玉身上的声音需要写得直击人心。贾政的愤怒中既有'恨铁不成钢'的父爱，也有家族危机感酿成的疯狂"
  - "黛玉哭肿了眼来看宝玉——曹雪芹只写了'两个眼睛肿得桃儿一般'，这是极简而极有力的描写，需要用心呈现"
  - "袭人向王夫人进言是全书的重大转折——她说'如今二爷也大了，里头姑娘们也大了'——这句话直接触发了抄检大观园的连锁反应"
