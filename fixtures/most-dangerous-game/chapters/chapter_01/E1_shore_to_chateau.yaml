styleGuidance:
  tone: "Exploration and discovery. The island should feel beautiful and menacing at once — evidence of violence accumulates gradually, building unease. The château's appearance should feel like a mirage. Ivan at the door is a jump-scare; Zaroff's entrance is a relief that curdles into unease. End with Rainsford crossing the threshold, leaving the jungle for the gilded cage."
