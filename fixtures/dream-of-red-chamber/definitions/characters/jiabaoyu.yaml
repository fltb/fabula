description: 贾宝玉，首次出现于第3回，共提及102次。贾宝玉的常用简称
appearance: 面若中秋之月，色如春晓之花，鬓若刀裁，眉如墨画，面如桃瓣，目若秋波。项上金螭璎珞，又有一根五色丝绦，系着一块美玉。
