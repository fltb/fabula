styleGuidance: "Drawing-room horror. The dinner should feel opulent and civilized — the finest linen, crystal, silver, china, perfectly cooked food — while Zaroff calmly describes mass murder. The mounting heads on the walls take on new meaning. Rainsford's horror should grow as Zaroff's pleasantness never wavers."
narrativeContent:
  opening: "The dining hall was a cathedral of death. Lions, tigers, elephants, moose, bears — their glass-eyed heads stared down from every wall, trophies of a lifetime of slaughter. Rainsford sat at the vast refectory table, eating borsch from a silver spoon, while his host, immaculate in evening clothes, smiled with red lips and pointed teeth.\n\n'I have but one passion in my life, Mr. Rainsford,' said General Zaroff, 'and it is the hunt.'\n\nHe refilled Rainsford's glass with a venerable port, and his black eyes glittered in the candlelight. 'I have invented a new sensation. A new animal to hunt. The most dangerous game of all.'\n\nRainsford set down his glass. 'What game?'\n\nZaroff's smile widened. 'It must have courage, cunning, and above all, it must be able to reason.'\n\nA pause. The candles flickered. The dead animals watched.\n\n'But you can't mean——' Rainsford gasped.\n\n'And why not?' said General Zaroff."
