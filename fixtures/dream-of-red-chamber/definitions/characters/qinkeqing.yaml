backstory: 秦业从养生堂抱养之女，长大后人品出众，嫁入宁国府为贾蓉之妻。在宁国府行事温柔和平，上下敬服。贾珍对其异常重视（疑点之一）。一病不起后，名医束手无策，临终前托梦给王熙凤，预言贾府盛极必衰，建议凤姐置办祭田、家塾以备后路。死后贾珍倾尽全力大办丧事，棺材用薛蟠处所得义忠亲王千岁之樯木，为贾蓉捐五品龙禁尉之职以显丧礼体面。葬礼盛况空前，王公贵族纷纷路祭。
knownSecrets:
  - 托梦凤姐预言贾府败落（"三春去后诸芳尽，各自须寻各自门"）
  - 其死因有"淫丧天香楼"之说，为全书最大疑案之一
