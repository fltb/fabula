threadProgress:
  - thread: T1
    advancement: "The turning point — David takes his fate into his own hands. The journey from London to Dover is the first truly independent act of his life, transforming him from passive sufferer to active agent of his own destiny."
    progressAfter: 25
    progressTotal: 100
  - thread: T2
    advancement: "Miss Betsey's adoption sets David on the path that will lead him to the Wickfields of Canterbury. By establishing him in Dover and sending him to school in Canterbury, Betsey unwittingly places David in the orbit of Agnes Wickfield, the woman who will ultimately become his 'better self.'"
    progressAfter: 3
    progressTotal: 100
foreshadowing:
  - id: trotwood_name
    hint: "Miss Betsey's renaming of David — 'Trotwood Copperfield' — is a symbolic adoption. She claims him as her own, and the name 'Trotwood' will become David's dearest identity. It also hints at the elision of the Copperfield name that Murdstone has sullied."
    targetRevealChapter: 13
    thread: T1
  - id: betsey_fortitude
    hint: "Miss Betsey's fierce protection of David — her confrontation with the Murdstones, her declaration 'I will be your guardian' — reveals the steel beneath her eccentricity. Her strength prefigures her role as David's anchor through all future trials."
    targetRevealChapter: 60
    thread: T1
  - id: dover_as_haven
    hint: "Dover — the white cliffs, the sea, Miss Betsey's cottage with its neat garden — becomes the symbolic haven of David's childhood, the place where he is saved. The contrast between the filthy London warehouse and the clean Dover cottage marks the moral geography of the novel."
    targetRevealChapter: 13
    thread: T1
