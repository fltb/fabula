sceneBrief: "几年过去了。阿毛长成了一个半大小子，能帮贺老六上山打柴了。祥林嫂后来又生了一个女儿——取名春丫头，因为出生在春天。贺老六照旧在山里干活，人瘦了，背也微微驼了，但精神还好。一家人住在贺家坳那间泥墙草顶的屋子里，冬天漏风，夏天漏雨，但灶火总是热的。祥林嫂的手粗糙得像树皮——洗衣、做饭、劈柴、喂猪，从早忙到晚。她偶尔想起鲁镇——想起鲁四老爷，想起四婶，想起那个她曾经拼命干活的地方——但那是另一个世界了。她听不到柳妈的地狱故事，不需要去土地庙捐门槛。她每天最操心的事是：米缸里的米够不够吃到月底。这穷让她安心——穷是具体的、眼前的，不像地狱那样看不见摸不着。有一年冬天，卫老婆子路过贺家坳，看见她在井边洗菜，远远喊了一声'祥林嫂'——她抬起头来，笑了笑，又低下头继续洗。卫老婆子后来对人说：'那个祥林嫂——她倒熬出来了。'但她不知道，'熬出来了'不是因为她做了什么，而是因为这一次，天没有塌下来。"
