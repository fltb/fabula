sceneBrief: 天越来越冷，北平的煤断了来源。祁家的炕烧不起了，祁老人夜里冻得睡不着，把身子蜷成一只大猫。天佑太太的南屋更加潮湿寒冷，夜里能把水瓶冻炸。瑞宣为买煤的钱发愁——他已经几个月没拿到薪水了。韵梅提醒丈夫冬天没火怎么活，小顺儿天真地说"没煤我去拣煤核儿"。瑞宣心中茫然：今天缺煤，明天缺粮，一家人在沦陷的北平怎么活得下去？
