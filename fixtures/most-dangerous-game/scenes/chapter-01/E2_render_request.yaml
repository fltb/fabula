sceneBrief: Rainsford wakes late in the afternoon, hungry but refreshed. He follows the shore and finds evidence of a chase: crushed underbrush, bloodstained weeds, an empty .22 cartridge. He finds the print of hunting boots and follows the trail, noticing the peculiar tree-skeleton warning left behind. As darkness falls, he sights the lights of an enormous château on a high bluff. He approaches the spiked iron gate, exhausted but hopeful.
styleGuidance: Exploration and discovery. The island should feel beautiful and menacing at once. The evidence of violence should accumulate gradually, building unease. The château's appearance should feel like a mirage — impossible and ominous.
