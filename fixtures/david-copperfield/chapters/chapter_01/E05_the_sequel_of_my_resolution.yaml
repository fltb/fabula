styleGuidance:
  tone: "desperate journey giving way to warmth and relief — the prose rises from the dust of the road into the light of Miss Betsey's cottage"
  targetWordCount: 800
  atmosphere: "the open road under a harsh sun; hunger and exhaustion; the theft and the selling of clothes; the first sight of Dover's white cliffs; the neat order of Miss Betsey's cottage with its fuchsia bushes and the donkey-free garden; the tea served by a woman who has just saved a life"
  scenePacing: "resolution to flee (quick, decisive) → the journey (long, episodic, trials) → arrival at Dover (climactic) → the confrontation with Murdstone (dramatic showdown) → acceptance and renaming (peaceful close)"
  characterVoice:
    narrator: "David's voice shifts from desperation to relief over the course of the event. The journey is told with breathless urgency — the adult narrator recreating the panic and hope of the ten-year-old. Upon reaching Betsey, the prose softens into gratitude"
    betsey_trotwood: "Initially brusque and bewildered — 'Go away! I don't know anything about you!' — then softening into fierce protectiveness. Her confrontation with Murdstone is magnificent: she is imperious, sarcastic, utterly commanding"
    murdstone: "Defensive, then defeated — for the first time his cold authority meets its match. He speaks in his usual measured tones, but Betsey dismantles his arguments systematically"
    mr_dick: "Friendly, confused, tangential — his speech wanders, circling back to King Charles's head, but his kindness to David is immediate and genuine"
