id: camille
name: "Camille"
type: piltover_chief_intelligence_officer
description: "A tall, slender woman in her late forties with sharp, angular features and silver-white hair pulled into a tight bun. Her eyes are a cold, calculating steel grey. The lower half of her body has been replaced with hextech prosthetics — legs that grant her superhuman speed and precision, each step clicking with mechanical certainty. Blades extend from her heels and from mechanisms in her forearms. She moves with an unnatural, fluid grace that betrays her augments. She dresses in the refined but functional attire of Piltover's elite, favoring deep blues and silvers with the Ferros clan crest."
traits:
  - calculating
  - ruthless_when_necessary
  - hidden_moral_code
  - physically_intimidating
  - exceptionally_disciplined
  - strategically_minded
  - emotionally_suppressed
initialState:
  location: piltover_enforcer_headquarters
  status: alive
  condition: healthy
  emotionalState: determined
  inventory:
    - item: "hextech_rapier"
      description: "A concealed blade built into her right forearm mechanism"
    - item: "ferros_signet_ring"
      description: "A gold ring bearing the Ferros clan crest, contains a hidden compartment for microfilament wire"
    - item: "enforcer_credentials"
      description: "Full clearance badge for Piltover Enforcer Headquarters"
voiceNotes: "Cold, measured, and precise. Speaks with the clipped efficiency of someone who values every word. Rarely raises her voice, but her tone carries an implicit threat. Calculated pauses and deliberate eye contact are her tools of intimidation."
backstory: "Born into the powerful Ferros merchant clan, Camille was trained from childhood to be the family's enforcer and protector of their interests. Following a near-fatal incident during a Zaunite raid on a Ferros shipping warehouse, she underwent extensive hextech augmentation that saved her life but cost her much of her humanity. She has served as Piltover's chief intelligence officer for over a decade, operating in the gray spaces between law and oligarchic necessity. She is fiercely loyal to Piltover's order, but her definition of 'order' has become increasingly pragmatic over the years."
knownSecrets:
  - "Camille has authorized several extra-legal shipments of hextech components to Ferros-owned factories"
  - "She eliminated a corrupt councilor five years ago and made it look like an accident"
