event: E10
title: 金寡妇贪利权受辱 秦可卿病笃延名医
narrativeOrder: 10
sceneType: linear
pov:
  character: narrator_omniscient
  type: omniscient
sceneBrief: 金荣之母胡氏劝说儿子忍让学堂争端，转而往宁府找尤氏欲讨说法，却见尤氏心绪烦忧——秦可卿病笃不愈，尤氏叮嘱贾蓉不可令媳妇劳神。胡氏不敢开口便回。冯紫英举荐张友士先生为秦可卿诊脉。张太医细诊细辨，断定乃心气虚而生火、肝家气滞血亏、脾土被肝木克制、肺经气分太虚，非妊娠之喜。开出益气养荣补脾和肝汤，言若过了春分可望痊愈。贾珍闻其论病精细，不觉称奇。可卿病势日沉，宁府上下忧心忡忡。
