backstory: 都中古董商人，为人精明世故，对金陵城中世家大族的内情颇为了解。因买卖常出入荣国府，娶周瑞之女为妻，对贾府内幕知之甚详。在扬州郊外酒肆中偶遇贾雨村，长篇大论演说荣国府的衰败先兆——"如今外面的架子虽未甚倒，内囊却也尽上来了"。
