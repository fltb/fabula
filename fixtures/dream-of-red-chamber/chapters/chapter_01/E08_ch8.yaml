event: E8
title: 贾宝玉大醉绛芸轩 薛宝钗巧合认通灵
narrativeOrder: 8
sceneType: linear
pov:
  character: narrator_omniscient
  type: omniscient
sceneBrief: 贾宝玉至梨香院探视薛宝钗微恙。宝钗近前细看通灵宝玉，翻来覆去念诵"莫失莫忘，仙寿恒昌"之语。莺儿在旁笑言此与宝钗金锁上的"不离不弃，芳龄永继"恰成一对。宝玉要看金锁，宝钗推辞不过遂解排扣取出，宝玉果然念了两遍。正说间黛玉走来笑言"早知他来我就不来了"，以暖手捂嘴戏谑众人。李嬷嬷劝宝玉少饮酒，宝玉只管饮至酣醉。晚间回绛芸轩，晴雯接出来抱怨被墨污了门斗，宝玉亲书"绛芸轩"三字。李嬷嬷又来骂袭人，宝玉酒醒后不悦，其乳母李嬷嬷被撵之事初现端倪。
