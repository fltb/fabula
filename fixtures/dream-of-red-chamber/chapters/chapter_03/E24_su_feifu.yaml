sceneBrief: 史湘云来怡红院，劝宝玉留心仕途经济。宝玉当即拉下脸说："林妹妹从不说这些混账话。"黛玉在窗外听见，又惊又喜又悲又叹——喜的是认他为知己，悲的是父母早逝无人做主。宝玉出来撞见黛玉独自垂泪，追上去替她拭泪。黛玉说："你死了倒不值什么，只是丢下了什么金、什么麒麟的。"宝玉急得满脸通红，一把抓住她，半晌只说出三个字："你放心。"黛玉怔住，如雷击顶。宝玉又说："你皆因总是不放心的原故，才弄了一身病。"黛玉点了点头转身离去。宝玉痴立出神，袭人赶来送扇，宝玉一把拉住她，口中说道："好妹妹——我为你也弄了一身的病，这睡里梦里也忘不了你！"——这原是满心要对黛玉说的话，却错对袭人说了出来。袭人听了，吓得魂飞魄散。
