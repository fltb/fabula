sceneBrief: 刘姥姥因家中冬事未办，想起女婿王狗儿祖上曾与王夫人之父连宗，遂携外孙板儿赴荣国府求助。先寻至周瑞家的，得引见。周瑞家的告知凤姐如今当家，又暗示王夫人素日乐善好施。刘姥姥见平儿遍身绫罗插金戴银，误认为是凤姐。及至凤姐接见，凤姐一面命人传饭一面告艰难，最终仍给二十两银子一吊钱，刘姥姥千恩万谢而去。
