description: "Agnes Wickfield's father, a widowed solicitor of Canterbury in whose house David lodges while at Doctor Strong's school. A man of real ability and probity, he is nevertheless broken by his wife's death and her memory; he drinks, neglects his affairs, and falls increasingly under the power of his clerk Uriah Heep, who exploits his guilt and his grief to defraud him and seize control of the firm. His salvation comes through Micawber's exposure of Heep, after which he recovers his sobriety and his affairs, and lives to see Agnes happily married to David."
appearance: "A handsome, dignified gentleman of middle age, with a grave and melancholy countenance, prematurely grey. He is always neatly dressed in black, with an air of faded gentility."
