sceneBrief: 有一年的冬初，四叔家里要换女工，做中人的卫老婆子带了一个女人进来——她就是祥林嫂。她头上扎着白头绳，乌裙，蓝夹袄，月白背心，年纪大约二十六七，脸色青黄，但两颊却还是红的。四叔皱了皱眉——他讨厌她是一个寡妇。但四婶看她模样周正、手脚壮大、安分耐劳，便留下了她。试工期内她整天的做，似乎闲着就无聊，简直抵得过一个男子。到了年底，她一个人竟能担当起全部的祝福准备工作——扫尘、洗地、杀鸡、宰鹅、彻夜的煮福礼。她的口角边渐渐有了笑影，脸上也白胖了。人们从她断断续续的叙述中知道了她的来历：春天死了丈夫（比她小十岁的打柴的丈夫），家里有严厉的婆婆和一个十多岁能打柴的小叔子——她是逃出来的。
