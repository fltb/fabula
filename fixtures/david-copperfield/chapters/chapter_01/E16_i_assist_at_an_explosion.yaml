styleGuidance:
  tone: dramatic, triumphant, with an undertone of theatrical release — the long-built
    tension of the Heep plot explodes in a scene of rhetorical fireworks and moral
    vindication
  targetWordCount: 1200
  atmosphere: 'the close, dusty office of Wickfield & Heep in Canterbury — morning
    light through the windows, the shelves of grim legal books, the smell of old paper.
    Every character is wound tight: Micawber trembling with the magnitude of his moment,
    Heep''s eyes narrowing in calculation, Traddles quietly arranging papers, Aunt
    Betsey''s stony satisfaction. The room becomes a stage for the unmasking.'
  scenePacing: arrival in Canterbury (tense expectancy) → assembly in Wickfield's
    office (charged stillness) → Micawber's written statement (building crescendo)
    → the reading of evidence (relentless, methodical) → Heep's reactions (writhing,
    threatening, collapsing) → Traddles takes legal charge (calm competence) → the
    settlement (justice done) → aftermath (release and exultation)
  characterVoice:
    narrator: Adult David reporting a scene of rare, unequivocal triumph — the prose
      rises to the occasion, matching Micawber's rhetoric with its own urgency. David
      stands as both participant and witness, his voice carrying the thrill of justice
      finally served.
    micawber: At his most magnificent — his written statement is the crowning achievement
      of his rhetorical gift, all his grandiloquence pressed into the service of truth.
      He speaks with the authority of a man who has endured humiliation and emerged
      with evidence. His voice is tremulous with emotion but absolutely clear.
    uriah_heep: His ingratiating 'umble' manner drops away piece by piece as the evidence
      mounts. He begins with false innocence and protests of wounded virtue, progresses
      to threats and bluster, and ends in sullen, defeated silence. The underlying
      ugliness that his humility has always concealed is finally exposed.
    traddles: Quiet, methodical, unshakeable — the contrast with Micawber's drama
      is deliberate. Traddles speaks in short, precise sentences about bonds, accounts,
      and legal remedies. His competence provides the sturdy framework for Micawber's
      theatrical revelation.
    betsey_trotwood: Laconic, severe, and deeply satisfied — she says little during
      the confrontation but her presence is felt. When she does speak, it is to deliver
      a dry, devastating remark that cuts through Heep's prevarications.
