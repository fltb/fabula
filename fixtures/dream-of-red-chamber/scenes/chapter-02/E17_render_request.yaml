sceneBrief: 薛宝钗及笄生日，贾母出资摆酒唱戏。宝钗点了《鲁智深醉闹五台山》，宝玉嫌热闹，宝钗笑念戏中《寄生草》——'赤条条来去无牵挂'。宝玉拍膝叫好。席间凤姐说小旦像某人，湘云直口说像黛玉，宝玉使眼色制止，湘黛皆恼。宝玉两头劝解不成，反被抢白，回想'赤条条来去无牵挂'的句意，回房提笔写下禅偈——'你证我证，心证意证。无可云证，是立足境。'又续填一支《寄生草》。黛玉看了偈子，笑改一句——‘“无立足境，是方干净”——你这偈子还不通透呢！’宝玉无言以对，只得笑道'谁又参禅了'。
styleGuidance: {"tone":"先热闹谐趣，后转入沉思参悟","characterVoice":{"jiabaoyu":"从热闹中的兴奋到独处的沉思——写偈子时的宝玉与席上的判若两人。但被黛玉一问便'谁又参禅了'——他的悟终究还浅，一句玩笑话便回到了世间。","xuebaochai":"点戏时信口念出整支《寄生草》——她在文学和戏曲方面的修养令人刮目相看。她念曲文时那种低回婉转的语调，是她在众人面前少有的展露才华时刻。","lindaiyu":"两次打趣——先是'还没唱《山门》，你倒《妆疯》了'，后是'无立足境，是方干净'——她的机锋与智慧在此刻完全压倒了宝玉。她是唯一能从禅理上点醒宝玉的人。","shixiangyun":"心直口快，被宝玉的'使眼色'惹恼。'我也原不如你林妹妹'——湘云吃醋也是坦坦荡荡的，不高兴就是不高兴。"},"scenePacing":"宝钗点戏→宝玉嫌→宝钗念曲→宝玉称赏→湘云说像→宝玉使眼色→湘黛皆恼→宝玉写偈→黛玉改偈→释然","atmosphere":"贾母院内灯火辉煌、戏台上锣鼓丝竹。众人围坐看戏，说笑吃酒。宝玉拍膝叫好的兴奋，黛玉斜眼打趣的酸意，湘云不悦的静默——看似热闹，底下已是情丝千缕。","targetWordCount":1200}
