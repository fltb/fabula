role: supporting
description: "David's great-aunt, the most memorable character in the novel after David himself. A fierce, eccentric, essentially kind-hearted spinster with an imperious manner, a rigid sense of propriety, and a profound contempt for donkeys on her green. She is tall and upright, with a severe countenance that nevertheless softens with affection. She disapproved of her nephew's marriage to Clara (whom she called 'a wax doll') and walked out of David's life at his birth when she learned the baby was a boy — only to reappear years later when David runs to her for refuge. She takes him in, names him 'Trotwood Copperfield,' educates him, and becomes his staunchest supporter. Her own history includes an unhappy marriage to a younger man who mistreated her and whom she eventually bought off."
appearance: "Tall, erect, with an aquiline nose, bright black eyes, and a steady frowning expression. She wears a lavender-coloured silk gown, a cap with a stiff border, and a tucker. Her hands are always busy. She carries a sturdy walking stick and uses it to threaten donkeys. In later years she wears spectacles."
