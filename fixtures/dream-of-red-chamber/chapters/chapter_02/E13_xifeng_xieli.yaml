    wangxifeng: "句句有力、字字不虚。她不用高声，但每句话都是命令。'既托了我，我就说不得要讨你们嫌了'——既是预告也是警告。对迟到仆人的处置简洁干脆：'打二十板子！革一个月银米！'"
