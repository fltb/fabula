chapter: 1
title: "四世同堂"
summary: "一九三七年七七事变后，北平沦陷。小说以小羊圈胡同祁家、钱家、冠家三户人家为核心，描写了在日寇占领下的北平市民的苦难生活与精神挣扎。祁家的四世同堂在战火中风雨飘摇——瑞全出走、天佑惨死、瑞丰堕落为汉奸、瑞宣在苦闷中找到方向；钱默吟由隐士诗人变成抗日战士；冠晓荷夫妇卖身求荣最终自食其果。全书通过市民群像展现了亡国之痛与民族觉醒的艰难历程。"
intent: "建立一个在沦陷区背景下的多线程叙事模型。使用第三人称全知视角、过去时态，通过祁家、钱家、冠家三条线索的平行交织，展现抗日战争初期北平市民的不同人生选择。测试系统的多视点切换、线程并发推进、时序锚点编排、以及汉奸/英雄/平民多种角色类型的事实跟踪。同时测试 preconditions/postconditions 在连续事件链条中的状态继承。"
plannedScenes: 20
