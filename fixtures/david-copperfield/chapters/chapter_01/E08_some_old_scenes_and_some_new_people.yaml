threadProgress:
  - thread: T4
    advancement: "Steerforth's seduction of Emily begins in earnest. He charms the entire Peggotty family, commissions the boat 'Little Emily,' and fixes his fascination on the beautiful girl. Dan Peggotty is utterly taken in, Ham is quietly watchful, and David sees nothing but his friend's generosity. The trap is set in the warmest of settings."
    progressAfter: 15
    progressTotal: 100
  - thread: T1
    advancement: "David's blindness to Steerforth's true character is at its most complete. His hero-worship prevents him from seeing what the reader suspects: that Steerforth's interest in Yarmouth and in Emily is predatory. This marks a critical failure of David's judgment — his 'undisciplined heart' extends to his choice of friends."
    progressAfter: 40
    progressTotal: 100
foreshadowing:
  - id: the_little_emily_boat
    hint: "Steerforth's commissioning and naming of the boat 'Little Emily' is an act of possession disguised as generosity. The name itself is a claim: she is now 'his' Little Emily in more ways than one. The boat symbolizes the vessel of her ruin."
    targetRevealChapter: 31
    thread: T4
  - id: martha_watching
    hint: "Martha Endell, the shunned girl of the town, watches Emily's growing fascination with Steerforth with a knowing, haunted look. She knows what ruin looks like — and she will reappear at the critical moment of Emily's fall."
    targetRevealChapter: 40
    thread: T4
  - id: miss_mowchers_knowledge
    hint: "Miss Mowcher, the sharp-eyed little hairdresser, knows every secret in Yarmouth society. Her garrulous, gossipy manner masks a shrewd understanding of human nature. She will later play a crucial role in unmasking Steerforth's treachery."
    targetRevealChapter: 32
    thread: T4
