ruleId: hextech_crystal_scarcity
name: "Hextech Crystal Scarcity"
category: state_invariant
type: "rule"
statement: "Hextech crystals are scarce and tightly controlled after Piltover's Season 1 crisis."
ruleClass: social_norm
logicalConsequences:
  - description: "Hextech-augmented characters without maintenance degrade over time."
    check:
      type: state_invariant
      filter: "character.traits includes hextech_augmented"
      severity: error
      assert: "maintenance overdue implies degradation status"
  - description: "Large crystal holdings raise external interest."
    check:
      type: state_invariant
      filter: "faction.hextech_crystal_count > 10"
      severity: warning
      assert: "threat level is elevated"
evidenceChain: []
