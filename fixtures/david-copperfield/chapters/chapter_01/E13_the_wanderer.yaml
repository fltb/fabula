styleGuidance:
  tone: "solemn, compassionate, redemptive — the darkest hour before the dawn of forgiveness"
  targetWordCount: 900
  atmosphere: "the Thames at night — fog, mud, the hulks on the river, the desperate houses near Blackfriars Bridge where ruined women hide. Then the candlelit room where Mr Peggotty holds his niece and says nothing but her name."
  scenePacing: "conversation with Aunt Betsey (thoughtful, measured) → Mr Peggotty's arrival (worn, sorrowful) → Martha's revelation (urgent, tense) → the night journey to the Thames (dread and hope) → the reunion (climactic forgiveness, quiet and immense)"
  characterVoice:
    narrator: "Adult David recounting the night he helped find Emily — the memory still heavy with the weight of what Steerforth did, and the even heavier weight of Mr Peggotty's grace. The prose is stripped of irony, almost biblical in its restraint."
    dan_peggotty: "Worn by months of fruitless searching across Europe — his voice is quieter now, the booming warmth muted by suffering, but it rises with renewed purpose when there is hope. His reunion speech is brief: he simply holds Emily and calls her his 'dear' — it is everything."
    martha_endell: "Low, urgent, knowing — she speaks from the margins, her voice carrying the weight of experience with the world's cruelty. She knows where Emily will be because she herself has been there."
    emily: "Broken but not beyond hope — she speaks little, her shame so deep it is nearly wordless. Her repentance is in her collapse, her uncle's forgiveness in his embrace. No words are needed."
