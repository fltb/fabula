styleGuidance:
  tone: elegiac, interior, slowly resolving — the prose moves at the pace of grief,
    circling, repeating, lingering on images of landscape and memory. There is no
    dramatic action, only the slow work of the soul healing itself.
  targetWordCount: 800
  atmosphere: 'the shifting landscapes of Europe as seen through the eyes of a man
    carrying an immense invisible weight — the Swiss Alps in snow and mist, the Italian
    lakes at twilight, the French country roads in autumn. Every scene is filtered
    through David''s interior state: the mountains are ''too grand to sympathise,''
    the cities are ''foreign and indifferent,'' and only the solitude of the high
    passes offers any kinship to his mood.'
  scenePacing: 'the decision to leave England (hollow, automatic) → departure (a fading
    coastline) → the first months: France (numb, mechanical sightseeing) → the Alps
    (solitude, the first stirrings of something other than pain) → Italy (colour,
    warmth, the slow return of sensation) → the third year (acceptance, the beginning
    of wisdom) → the decision to return (calm, settled, ready)'
  characterVoice:
    narrator: Adult David at his most introspective — this is the section of the novel
      where the retrospective narrator most fully merges with his younger self. The
      prose is lyrical but subdued, as if the pain is still too close for full articulation.
      He speaks of grief in universal terms — 'Grief is a thing that comes not quickly'
      — reaching for the consolations of philosophy and shared human experience.
    david_copperfield: Quiet, reflective, stripped of the energy that has driven him
      through the earlier chapters. His voice in this section is that of a man learning
      to be alone — turning over memories, examining his 'undisciplined heart,' slowly
      coming to terms with loss. The voice of a soul in convalescence.
