sceneBrief: "傻大姐在园中拾到绣春囊，王善保家的趁机挑唆王夫人抄检大观园。王熙凤领人连夜挨院搜查。到秋爽斋，探春秉烛开门以待，命丫鬟敞箱——'我的东西倒许你们搜阅；要想搜我的丫头，这却不能！'——并痛斥'百足之虫，死而不僵，从外头杀来一时是杀不死的'。到紫菱洲，从司棋箱中查出潘又安情书和鞋袜，司棋低头不语。到藕香榭，入画因怯私传哥哥寄存之物被惜春撵走。到潇湘馆查而无获。抄检暴露了大观园内部的猜忌和矛盾，是贾府盛极而衰的正式转折点。"
