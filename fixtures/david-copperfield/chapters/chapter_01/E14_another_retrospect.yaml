styleGuidance:
  tone: "elegiac, tender, suffused with quiet sorrow — the retrospect slows time to a near halt, every scene steeped in the awareness of approaching loss"
  targetWordCount: 800
  atmosphere: "the small cottage with the dying fire, Jip curled blind on Dora's lap, the dust motes in the afternoon light, David writing at his desk in the next room while his wife fades — everything softened, muted, already half-memory"
  scenePacing: "the retrospect frame (slow, contemplative) → domestic vignettes: Dora with the housekeeping book, Dora with Jip, David trying to teach her (fond but painful) → the first signs of illness (hushed, creeping) → the deepening shadow (inexorable) → the close: winter light, Dora's thin hand, Jip's unseeing eyes"
  characterVoice:
    narrator: "Adult David at his most vulnerable — the retrospect removes the ironic distance and leaves only memory and grief. The prose becomes lyrical, impressionistic, as if written through tears."
    dora_spenlow: "Light, fluttering, childlike even in decline — she calls David 'Doady' and cannot manage a household but knows how to love. Her voice grows fainter as the chapter goes on, her last words tender and selfless."
    david_copperfield: "Frustrated, loving, guilty — he tries to shape Dora into a practical wife and fails, then watches her slip away, realising too late that he should have loved her as she was. His voice carries the weight of unspoken apologies."
