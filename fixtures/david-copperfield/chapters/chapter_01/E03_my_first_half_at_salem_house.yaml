sceneBrief: "David arrives at Salem House school, a grim establishment run by the cruel Mr Creakle who beats boys with a stick. As a punishment for biting Mr Murdstone, David is made to wear a placard on his back reading 'Take care of him. He bites.' The older, charismatic James Steerforth takes David under his protection, making him his 'favourite' and securing him privileges. David becomes Steerforth's devoted admirer, telling him stories at night and buying him wine and biscuits. He also befriends the poor, good-natured Tommy Traddles, who draws skeletons on his slate and is beaten more than any other boy. Despite the harsh conditions, David finds a measure of happiness through these friendships."
