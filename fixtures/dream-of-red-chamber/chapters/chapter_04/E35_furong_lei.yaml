sceneBrief: "晴雯死后，小丫头为安慰宝玉，谎称晴雯做了芙蓉花神。宝玉半信半疑，在池边芙蓉花下设摆晴雯素日喜吃的果品，洒泪誊写《芙蓉女儿诔》——一篇长达千余言的骈体祭文。他边哭边诵，以芙蓉喻晴雯之洁，以烈风暴雨喻谗言之毒，以'钳诐奴之口，讨岂从宽；剖悍妇之心，忿犹未释'痛斥迫害者。正诵时，黛玉从芙蓉花后走出，形容却似在笑。她为他修改文中词句，将'红绡帐里，公子多情'改为'茜纱窗下，我本无缘'——宝玉拍手称妙，竟不知这改句暗合了自己与黛玉的结局。诔文诔晴雯而实诔黛玉，是全书最重要的象征预言之一。"
