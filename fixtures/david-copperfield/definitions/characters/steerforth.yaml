role: supporting
description: "David's charismatic schoolfellow at Salem House and later his fatal friend. Steerforth is older than David, strikingly handsome, self-possessed, and commanding — everything the younger boy admires. He protects David from bullies at school and becomes David's idol. But Steerforth is fundamentally corrupt: he treats people as instruments of his pleasure, seduces and abandons Little Emily (ruining her and breaking the Peggotty family), and ultimately drowns in the great storm off Yarmouth. David's love for Steerforth is the most ambivalent relationship in the novel — a boyish hero-worship that David must later reckon with as a moral failure of his own perception."
appearance: "Exceptionally handsome: tall, well-formed, with a fine open countenance, curling chestnut hair, a melodious voice, and a winning smile. He dresses with careless elegance. His good looks and easy manners make him universally admired."
