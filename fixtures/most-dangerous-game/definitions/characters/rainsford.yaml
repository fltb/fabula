id: rainsford
name: "Sanger Rainsford"
type: big_game_hunter
description: "Sanger Rainsford is a celebrated American big-game hunter from New York City, in his early thirties. He has the lean, muscular build of an active outdoorsman, with keen eyes accustomed to scanning distant horizons and hands that are steady on the trigger. His face is handsome in a rugged, weathered way, with a strong jaw and the alert expression of a man who has spent his life reading terrain and tracking game. He carries himself with the easy confidence of someone who has never been the prey."
traits:
  - hunter
  - pragmatic
  - athletic
  - blood_sport_defender
