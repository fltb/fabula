styleGuidance:
  tone: "Desperate climax followed by tense, intimate confrontation. The sea leap should feel like a final, irrational act of defiance — choosing the ocean over the hounds. Zaroff's casual response (brandy, cigarette, opera) should feel more chilling than any rage. The bedroom confrontation should feel like a trap that has snapped shut. Zaroff's politeness remains until the end. The fight itself can be brief; the meaning is in the dialogue and the closing line. End on the quiet, resonant final sentence."
