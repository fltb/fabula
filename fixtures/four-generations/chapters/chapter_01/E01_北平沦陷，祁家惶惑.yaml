sceneBrief: 一九三七年七七事变后，北平城在七月二十九日沦陷。小羊圈胡同里，祁老人还惦记着三个月准保平安的老话和八十大寿；瑞宣听到炮声心中惶惑；瑞全热血沸腾想要出走；韵梅依旧操持家务。胡同里的人们第一次感觉到亡国的滋味——不知日本人来了会怎样，是福是祸。
