voiceNotes: 言语诚恳真挚，忠心护主。在黛玉面前体贴入微，言辞温柔；在外人面前则为黛玉据理力争。曾用言辞试探宝玉真心，言语间充满智慧与忠诚。
backstory: 原名鹦哥，贾母的丫鬟，被派去服侍林黛玉。与黛玉情同姊妹，是黛玉在贾府中最贴心的人。真心为黛玉着想，曾以"黛玉要回苏州"之言试探宝玉真情。黛玉死后，紫鹃看破红尘，随惜春出家。
