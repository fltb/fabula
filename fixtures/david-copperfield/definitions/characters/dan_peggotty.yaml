description: "Peggotty's brother, a Yarmouth fisherman of extraordinary goodness and dignity. Mr Peggotty lives in a remarkable house — a converted boat on Yarmouth beach — where he raises his orphaned nephew Ham and niece Little Emily. He is a man of few words, immense physical strength, and profound emotional depth. When Emily is seduced and abandoned by Steerforth, Mr Peggotty's response is not rage but a determination to find her and bring her home. He travels across Europe for months, and when he finds her, his forgiveness is complete and unconditional. He is the moral heart of the novel's subplot — a poor, illiterate fisherman who embodies Christian forgiveness more perfectly than any clergyman in the book."
appearance: "A big, sturdy fisherman with a weather-beaten face, a rough beard, a broad chest, and powerful arms. He wears a flannel shirt, a waistcoat, trousers tucked into sea-boots, and a sou'wester hat. He has a ruddy complexion and a voice as deep as a foghorn. His eyes are honest and kind."
