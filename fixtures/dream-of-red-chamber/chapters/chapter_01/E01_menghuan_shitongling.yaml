sceneBrief: "女娲炼石补天，遗一顽石于大荒山青埂峰下。石经煅炼灵性已通，因无材补天，自怨自叹。一日一僧一道坐于石边论及红尘荣华，顽石心动，恳求携入红尘。僧人以幻术将大石化为一枚美玉，与道人飘然而去。几世几劫后，空空道人经青埂峰见大石上字迹历历，抄录《石头记》传世。另叙姑苏甄士隐伏几入梦，随僧道至太虚幻境牌坊前，见“假作真时真亦假，无为有处有还无”对联，正欲跨入，被霹雳惊醒。"
