description: 贾瑞，贾代儒之孙（贾家族人），在贾府家塾中附读。第十二回"王熙凤毒设相思局"的核心人物，因垂涎王熙凤美色，被凤姐两次设局捉弄后病倒，照风月宝鉴而亡。是全书"情淫"教训的典型案例。
